                  <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                    <span>📷</span> Take Court Photo
                  </h3>
                  <button onClick={stopCamera} className="text-slate-400 hover:text-white font-bold text-xs">✕</button>
                </div>
                
                <div className="w-full h-64 rounded-2xl bg-slate-950 border border-slate-800 overflow-hidden relative flex items-center justify-center">
                  <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                  <canvas ref={canvasRef} className="hidden"></canvas>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={stopCamera}
                    className="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={capturePhoto}
                    className="py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-md active:scale-95"
                  >
                    Capture Photo
                  </button>
                </div>
              </div>
            </div>
          )}

          {(activeNavTab === 'approvals' || activeNavTab === 'home') && (
            <>
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <h3 className="text-xs font-bold text-white flex items-center justify-between border-b border-slate-800 pb-2">
                  <span>⚡ Player League Registrations & Approvals</span>
                </h3>

                {loading ? (
                  <LoadingSpinner label="Fetching player requests..." />
                ) : playerRequests.length === 0 ? (
                  <p className="text-xs text-slate-500 py-4 text-center">No player league registration requests pending review.</p>
                ) : (
                  <div className="space-y-2.5 max-h-[260px] overflow-y-auto pr-1">
                    {playerRequests.map((req) => (
                      <div key={req.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold text-xs text-white">{req.profiles?.full_name || 'Player'}</p>
                            <p className="text-[10px] text-slate-500">{req.profiles?.email}</p>
                          </div>
                          <StatusBadge status={req.status} scheduleStr={req.semester} />
                        </div>

                        <p className="text-xs font-bold text-brand-400">{req.course_program}</p>
                        <p className="text-[10px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(req.semester)}</p>

                        {(req.status === 'submitted' || req.status === 'Pending') && (
                          <div className="grid grid-cols-2 gap-2 pt-1">
                            <button
                              onClick={() => handleOrganizerApprove(req.id, 'Approved')}
                              className="py-1.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold rounded-lg text-[10px] active:scale-95"
                            >
                              Approve
                            </button>
                            <button
                              onClick={() => handleOrganizerApprove(req.id, 'Declined')}
                              className="py-1.5 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-bold rounded-lg text-[10px] active:scale-95"
                            >
                              Decline
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <h3 className="text-xs font-bold text-white flex items-center justify-between border-b border-slate-800 pb-2">
                  <span>📋 My Published Leagues</span>
                </h3>

                {loading ? (
                  <LoadingSpinner label="Fetching proposals..." />
                ) : myLigas.length === 0 ? (
                  <p className="text-xs text-slate-500 py-4 text-center">No leagues created yet.</p>
                ) : (
                  <div className="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                    {myLigas.map((l) => (
                      <div key={l.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1">
                        <div className="flex justify-between items-start">
                          <p className="text-xs font-bold text-white leading-tight">{l.course_program}</p>
                          <StatusBadge status={l.status} scheduleStr={l.semester} />
                        </div>
                        <p className="text-[10px] text-brand-400 font-mono">{formatScheduleTo12Hour(l.semester) || 'Date Unspecified'}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </>
          )}

          {activeNavTab === 'create_league' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
              <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                <span>🏆</span> Create & Publish League
              </h3>

              <form onSubmit={handleCreateLiga} className="space-y-3">
                <div>
                  <label className="block text-[10px] font-bold text-slate-400 mb-1">League Name</label>
                  <input
                    type="text"
                    value={ligaTitle}
                    onChange={(e) => setLigaTitle(e.target.value)}
                    placeholder="e.g., Ormoc Inter-Barangay Basketball Cup"
                    className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"

                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-400 mb-1">Select Sport</label>

                    <label className="block text-[10px] font-bold text-slate-400 mb-1">Registration Fee (₱)</label>
                    <input
                      type="number"
                      value={ligaFee}
                      onChange={(e) => setLigaFee(e.target.value)}
                      placeholder="500"
                      className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-400 mb-1">Tournament Date</label>
                    <input
                      type="date"
                      value={reserveDate}
                      onChange={(e) => setReserveDate(e.target.value)}
                      className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 cursor-pointer"

                  Publish League

          {activeNavTab === 'add_court' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
              <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                <span>🏟️</span> Propose a New Ormoc City Court
              </h3>

              <form onSubmit={handleProposeNewCourt} className="space-y-3">
                <div>
                  <label className="block text-[10px] font-bold text-slate-400 mb-1">Court / Facility Name</label>
                  <input
                    type="text"
                    value={newCourtName}
                    onChange={(e) => setNewCourtName(e.target.value)}
                    placeholder="e.g., Ormoc City Sports Complex"
                    className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                  />
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-slate-400 mb-1">Hourly Rate (₱)</label>
                  <input
                    type="number"
                    value={newCourtRate}
                    onChange={(e) => setNewCourtRate(e.target.value)}
                    placeholder="200"
                    className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                  />
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-slate-400 mb-1">Location</label>
                  <input
                    type="text"
                    value={courtLocation}
                    onChange={(e) => setCourtLocation(e.target.value)}
                    placeholder="e.g., Carlos tan St. Ormoc City"
                    className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                  />
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-slate-400 mb-1">Court Picture / Document File</label>
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="file"
                      accept="image/*,.pdf"
                      onChange={handleFileChange}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-300 outline-none file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-brand-500 file:text-slate-950 hover:file:bg-brand-400 cursor-pointer"
                    />
                    <button
                      type="button"
                      onClick={startCamera}
                      className="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-brand-400 border border-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all shadow active:scale-95"
                    >
                      <span>📷</span> Take Photo
                    </button>

                </div>

                {courtImagePreview && (
                  <div className="w-full h-28 rounded-xl bg-slate-950 border border-slate-800 overflow-hidden relative">

                <button
                  type="submit"
                  className="w-full py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-md active:scale-95"
                >
                  Submit Court Proposal
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. ADMIN LIGA & COURT PROPOSAL APPROVAL DESK
    // =========================================================================
    function AdminDashboard({ currentUser, showNotification, refreshCourts }) {
      const [activeSubTab, setActiveSubTab] = React.useState('approvals');
      const [pendingProposals, setPendingProposals] = React.useState([]);
      const [logs, setLogs] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetchProposals();
        fetchAuditLogs();
      }, []);

      const fetchProposals = async () => {
        setLoading(true);
        
        const { data: rawEnrollments, error } = await supabase
          .from('enrollments')
          .select('*')
          .order('submitted_at', { ascending: false });

        if (error || !rawEnrollments) {
          setPendingProposals([]);
          setLoading(false);
          return;
        }

        const studentIds = [...new Set(rawEnrollments.map(item => item.student_id).filter(Boolean))];
        let profilesMap = {};

        if (studentIds.length > 0) {
          const { data: profilesData } = await supabase
            .from('profiles')
            .select('id, full_name, email')
            .in('id', studentIds);

          if (profilesData) {
            profilesData.forEach(p => {
              profilesMap[p.id] = p;
            });
          }
        }

        const formattedProposals = rawEnrollments.map(item => ({
          ...item,
          profiles: profilesMap[item.student_id] || { full_name: 'Organizer / User', email: 'Registered User' }
        }));

        setPendingProposals(formattedProposals);
        setLoading(false);
      };

      const fetchAuditLogs = async () => {
        const { data } = await supabase
          .from('audit_logs')
          .select('*')
          .order('created_at', { ascending: false });

        setLogs(data || []);
      };

      const handleAdminApprove = async (id, status) => {
        const { error } = await supabase
          .from('enrollments')
          .update({ status: status })
          .eq('id', id)
          .select();

        if (error) {
          showNotification(`Approval error: ${error.message}`, 'error');
        } else {
          showNotification(`Proposal ${status === 'Approved' ? 'Approved' : 'Declined'} successfully!`, 'success');
          safeAuditLog(currentUser, 'ADMIN_DECISION', { proposal_id: id, status: status });
          fetchProposals();
          if (refreshCourts) refreshCourts();
        }
      };

      return (
        <div className="p-4 space-y-3">
          <div className="grid grid-cols-2 p-1 bg-slate-900 rounded-xl border border-slate-800 text-xs font-bold">
            <button
              onClick={() => setActiveSubTab('approvals')}
              className={`py-1.5 rounded-lg transition-all ${
                activeSubTab === 'approvals' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'
              }`}
            >
              🏆 Approvals Desk
            </button>
            <button
              onClick={() => setActiveSubTab('logs')}
              className={`py-1.5 rounded-lg transition-all ${
                activeSubTab === 'logs' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'
              }`}
            >
              🛡️ Audit Logs
            </button>
          </div>

          {activeSubTab === 'approvals' && (
            <div className="space-y-3">
              <h3 className="text-xs font-bold text-white border-b border-slate-800 pb-2">
                Admin Approvals Desk (Organizer Courts)
              </h3>

              {loading ? (
                <LoadingSpinner label="Fetching proposals..." />
              ) : pendingProposals.length === 0 ? (
                <p className="text-xs text-slate-500 py-6 text-center">No system records available.</p>
              ) : (
                <div className="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
                  {pendingProposals.map((item) => {
                    const isCourtProposal = item.course_program.includes('🏟️ NEW COURT PROPOSAL');
                    const imgData = isCourtProposal && item.academic_year && item.academic_year.startsWith('data:image') ? item.academic_year : null;

                    return (
                      <div key={item.id} className="p-3 bg-slate-900 border border-slate-800 rounded-2xl space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold text-xs text-white">{item.profiles?.full_name || 'Organizer / User'}</p>
                            <p className="text-[10px] text-slate-500">{item.profiles?.email}</p>
                          </div>
                          <StatusBadge status={item.status} scheduleStr={item.semester} />
                        </div>
                        
                        <p className="text-xs font-bold text-brand-400 leading-snug">{item.course_program}</p>
                        
                        {imgData && (
                          <div className="w-full h-28 rounded-xl bg-slate-950 border border-slate-800 overflow-hidden">
                            <img src={imgData} alt="Court Proposal" className="w-full h-full object-cover" />
                          </div>
                        )}

                        <p className="text-[10px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(item.semester) || 'Date Unspecified'}</p>

                        {isCourtProposal && (item.status === 'submitted' || item.status === 'Pending') && (
                          <div className="grid grid-cols-2 gap-2 pt-1">
                            <button
                              onClick={() => handleAdminApprove(item.id, 'Approved')}
                              className="py-1.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold rounded-lg text-[10px] active:scale-95"
                            >
                              Approve Proposal
                            </button>
                            <button
                              onClick={() => handleAdminApprove(item.id, 'Declined')}
                              className="py-1.5 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-bold rounded-lg text-[10px] active:scale-95"
                            >
                              Decline
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {activeSubTab === 'logs' && (
            <div className="space-y-3">
              <h3 className="text-xs font-bold text-white border-b border-slate-800 pb-2 flex justify-between items-center">
                <span>🛡️ System Security Audit Logs</span>
                <button onClick={fetchAuditLogs} className="text-[10px] text-brand-400">Refresh</button>
              </h3>

              <div className="space-y-2 max-h-[460px] overflow-y-auto pr-1">
                {logs.map((log) => (
                  <div key={log.id} className="p-2.5 bg-slate-900 border border-slate-800 rounded-xl space-y-1 font-mono text-[10px]">
                    <div className="flex justify-between text-slate-400">
                      <span>{new Date(log.created_at).toLocaleTimeString()}</span>
                      <span className="text-brand-400">{log.action}</span>
                    </div>
                    <p className="text-white font-sans text-xs">{log.user_email || 'System'}</p>
                    <p className="text-slate-500 text-[9px] truncate">{JSON.stringify(log.details)}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7.5 USER PROFILE VIEW
    // =========================================================================
    function UserProfileView({ currentUser, showNotification }) {
      const [fullName, setFullName] = React.useState(currentUser?.full_name || '');
      const [updating, setUpdating] = React.useState(false);

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        if (!fullName.trim()) {
          showNotification('Full name cannot be empty.', 'error');
          return;
        }

        setUpdating(true);
        try {
          const { error } = await supabase
            .from('profiles')
            .upsert({
              id: currentUser.id,
              full_name: fullName.trim(),
              email: currentUser.email,
              role: currentUser.role
            }, { onConflict: 'id' });

          if (error) {
            showNotification(`Update failed: ${error.message}`, 'error');
          } else {
            currentUser.full_name = fullName.trim();
            showNotification('Profile updated successfully!', 'success');
            safeAuditLog(currentUser, 'UPDATE_PROFILE', { updated_name: fullName.trim() });
          }
        } catch (err) {
          showNotification('Profile update error.', 'error');
        } finally {
          setUpdating(false);
        }
      };

      return (
        <div className="p-4 space-y-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
            <div className="flex items-center gap-3 border-b border-slate-800 pb-3">
              <div className="w-10 h-10 rounded-2xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center p-1">
                <MapPinLogo className="w-8 h-8" />
              </div>
              <div>
                <h3 className="text-sm font-bold text-white">{currentUser?.full_name}</h3>
                <p className="text-[10px] text-brand-400 capitalize font-mono">{currentUser?.role}</p>
              </div>
            </div>

            <form onSubmit={handleUpdateProfile} className="space-y-3">
              <div>
                <label className="block text-[10px] font-bold text-slate-400 mb-1">Email Address (Read-only)</label>
                <input
                  type="text"
                  disabled
                  value={currentUser?.email || ''}
                  className="w-full px-3 py-2 bg-slate-950/50 border border-slate-800 rounded-xl text-xs text-slate-400 font-mono outline-none cursor-not-allowed"
                />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-400 mb-1">Full Name</label>
                <input
                  type="text"
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-400 mb-1">Account Role</label>
                <input
                  type="text"
                  disabled
                  value={currentUser?.role || 'Player / User'}
                  className="w-full px-3 py-2 bg-slate-950/50 border border-slate-800 rounded-xl text-xs text-slate-400 font-mono outline-none cursor-not-allowed"
                />
              </div>

              <button
                type="submit"
                disabled={updating}
                className="w-full py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-md active:scale-95 disabled:opacity-50"
              >
                {updating ? 'Saving Profile...' : 'Save Profile Changes'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. MAIN APP SHELL & NAVIGATION
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = React.useState(null);
      const [activeNavTab, setActiveNavTab] = React.useState('home');
      const [notification, setNotification] = React.useState({ message: '', type: 'info' });
      const [showLogoutModal, setShowLogoutModal] = React.useState(false);
      const [availableCourts, setAvailableCourts] = React.useState([]);

      React.useEffect(() => {
        fetchApprovedCustomCourts();
      }, []);

      const fetchApprovedCustomCourts = async () => {
        const { data } = await supabase
          .from('enrollments')
          .select('*')
          .in('status', ['dean_approved', 'Approved'])
          .like('course_program', '%NEW COURT PROPOSAL%');

        if (data && data.length > 0) {
          const customCourts = data.map((item) => {
            let pureName = item.course_program.replace('🏟️ NEW COURT PROPOSAL: ', '');
            if (pureName.includes(' (₱')) {
              pureName = pureName.split(' (₱')[0];
            }

            const rateMatch = item.course_program.match(/₱(\d+)\/hr/);
            const rateVal = rateMatch ? parseInt(rateMatch[1], 10) : 150;

            const locMatch = item.course_program.match(/@\s*(.*)$/);
            const locVal = locMatch ? locMatch[1].trim() : 'Ormoc City';

            const imgData = item.academic_year && item.academic_year.startsWith('data:image') ? item.academic_year : null;

            return {
              id: `approved_court_${item.id}`,
              name: pureName.trim(),
              sport: 'Basketball',
              rate: rateVal,
              location: locVal,
              image: imgData
            };
          });

          setAvailableCourts(customCourts);
        } else {
          setAvailableCourts([]);
        }
      };

      const showNotification = (message, type = 'info') => {
        setNotification({ message, type });
      };

      const clearNotification = () => {
        setNotification({ message: '', type: 'info' });
      };

      const handleConfirmLogout = async () => {
        await supabase.auth.signOut();
        setCurrentUser(null);
        setShowLogoutModal(false);
        showNotification('Signed out of RecMatch.', 'info');
      };

      const isPlayer = currentUser?.role === 'Player / User' || currentUser?.role === 'student' || !currentUser?.role;
      const isOrganizer = currentUser?.role === 'Organizer' || currentUser?.role === 'dean';
      const isAdmin = currentUser?.role === 'Admin' || currentUser?.role === 'admin';

      return (
        <div className="flex flex-col h-full w-full justify-between overflow-hidden">
          
          <ConfirmModal
            isOpen={showLogoutModal}
            title="Confirm Logout"
            message="Are you sure you want to log out of RecMatch?"
            confirmText="Logout"
            confirmStyle="danger"
            onConfirm={handleConfirmLogout}
            onCancel={() => setShowLogoutModal(false)}
          />

          {!currentUser ? (
            <div className="flex-1 flex flex-col justify-between overflow-y-auto">
              <SystemBanner notification={notification} onClose={clearNotification} />
              <AuthModule onAuthSuccess={(user) => {
                setCurrentUser(user);
                if (user.role === 'Organizer' || user.role === 'dean') {
                  setActiveNavTab('approvals');
                } else {
                  setActiveNavTab('home');
                }
              }} showNotification={showNotification} />
              <footer className="py-3 text-center text-[10px] text-slate-600 font-mono">
                RecMatch Ormoc &copy; 2026
              </footer>
            </div>
          ) : (
            <div className="flex flex-col h-full justify-between">
              
              {/* TOP APP BAR */}
              <header className="px-4 py-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between shrink-0">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center p-0.5 shadow-sm shrink-0">
                    <MapPinLogo className="w-6 h-6" />
                  </div>
                  <div>
                    <h2 className="text-xs font-bold text-white leading-none">{currentUser.full_name}</h2>
                    <p className="text-[10px] text-slate-400 capitalize mt-0.5">
                      Role: <span className="text-brand-400 font-semibold">{currentUser.role}</span>
                    </p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setShowLogoutModal(true)}
                  className="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl text-[10px] font-bold"
                >
                  Logout
                </button>
              </header>

              <SystemBanner notification={notification} onClose={clearNotification} />

              {/* MAIN CONTENT AREA */}
              <main className="flex-1 overflow-hidden flex flex-col p-3">
                {activeNavTab === 'zone' ? (
                  <OrmocZoneSchedule />
                ) : activeNavTab === 'profile' ? (
                  <UserProfileView currentUser={currentUser} showNotification={showNotification} />
                ) : isAdmin ? (
                  <AdminDashboard currentUser={currentUser} showNotification={showNotification} refreshCourts={fetchApprovedCustomCourts} />
                ) : isOrganizer ? (
                  <OrganizerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} refreshCourts={fetchApprovedCustomCourts} activeNavTab={activeNavTab} />
                ) : (
                  <PlayerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} playerNavTab={activeNavTab} />
                )}
              </main>

              {/* BOTTOM NAVIGATION BAR */}
              <nav className="px-4 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-around text-[10px] shrink-0">
                {isPlayer ? (
                  <>
                    <button
                      onClick={() => setActiveNavTab('home')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'home' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>🏠</span>
                      <span>Home</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('reservation')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'reservation' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>📅</span>
                      <span>Reservation</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('leagues')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'leagues' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>🏆</span>
                      <span>Leagues</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('profile')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>👤</span>
                      <span>Profile</span>
                    </button>
                  </>
                ) : isOrganizer ? (
                  <>
                    <button
                      onClick={() => setActiveNavTab('approvals')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'approvals' || activeNavTab === 'home' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>⚡</span>
                      <span>Approvals</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('create_league')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'create_league' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>🏆</span>
                      <span>Create League</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('add_court')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'add_court' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>🏟️</span>
                      <span>Add Court</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('profile')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>👤</span>
                      <span>Profile</span>
                    </button>
                  </>
                ) : (
                  <>
                    <button
                      onClick={() => setActiveNavTab('home')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'home' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>🏀</span>
                      <span>Dashboard</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('zone')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'zone' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>📅</span>
                      <span>Schedule</span>
                    </button>
                    <button
                      onClick={() => setActiveNavTab('profile')}
                      className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                    >
                      <span>👤</span>
                      <span>Profile</span>
                    </button>
                  </>
                )}
              </nav>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
