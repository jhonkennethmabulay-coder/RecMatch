                  <p className="text-[10px] text-emerald-600">Across your community</p>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1 relative">
                  <div className="flex justify-between items-start">
                    <p className="text-[11px] font-bold text-slate-400">Active leagues</p>
                    <span className="p-2 bg-emerald-50 text-emerald-600 rounded-xl text-xs">🏆</span>
                  </div>
                  <p className="text-2xl font-extrabold text-slate-900">{myProposals.length}</p>
                  <p className="text-[10px] text-emerald-600">Published and in review</p>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1 relative">
                  <div className="flex justify-between items-start">
                    <p className="text-[11px] font-bold text-slate-400">Reservations</p>
                    <span className="p-2 bg-emerald-50 text-emerald-600 rounded-xl text-xs">🗓️</span>
                  </div>
                  <p className="text-2xl font-extrabold text-slate-900">3</p>
                  <p className="text-[10px] text-emerald-600">All player bookings</p>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1 relative">
                  <div className="flex justify-between items-start">
                    <p className="text-[11px] font-bold text-slate-400">Pending requests</p>
                    <span className="p-2 bg-emerald-50 text-emerald-600 rounded-xl text-xs">⌛</span>
                  </div>
                  <p className="text-2xl font-extrabold text-slate-900">2</p>
                  <p className="text-[10px] text-emerald-600">Need your attention</p>
                </div>
              </div>

              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-slate-900">Your league activity</h3>
                  <button onClick={() => setActiveNavTab('create_league')} className="text-xs font-bold text-emerald-600 hover:underline">Manage leagues →</button>
                </div>
                {leaguesList.length === 0 ? (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 text-center text-xs text-slate-400">No leagues created yet. Click "+ Create a league" on the sidebar above.</div>
                ) : (
                  <div className="space-y-3">
                    {leaguesList.map(item => (
                      <div key={item.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div className="flex items-center gap-3.5">
                          <div className="w-12 h-12 rounded-2xl bg-orange-100 flex items-center justify-center text-xl shrink-0">🏀</div>
                          <div className="space-y-0.5">
                            <p className="font-extrabold text-slate-900 text-sm">{item.course_program.replace('🏆 LEAGUE: ', '')}</p>
                            <p className="text-[11px] text-slate-500">Basketball • Recreational • Ormoc City</p>
                            <p className="text-[10px] text-emerald-600 font-mono">📅 {formatScheduleTo12Hour(item.semester)} • Organized by {currentUser.full_name}</p>
                          </div>
                        </div>
                        <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                          <div className="text-right">
                            <p className="text-xs font-bold text-slate-900">19/24 players</p>
                            <span className="inline-block px-2 py-0.5 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-full text-[9px] font-bold">Approved</span>
                          </div>
                          <button onClick={() => showNotification('League settings editable.', 'info')} className="px-3.5 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-xl text-xs font-bold">Edit</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </>
          )}

          {selectedOrganizerCourt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-3">
              <div className="w-full max-w-2xl bg-white border border-slate-200 rounded-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                  <h3 className="text-xs font-bold text-slate-900">📅 Slot Matrix: {selectedOrganizerCourt.name}</h3>
                  <button onClick={() => setSelectedOrganizerCourt(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="flex justify-between items-center bg-slate-100 p-2 rounded-xl text-xs font-bold text-slate-700">
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() - 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-white rounded-lg shadow-sm">‹ Prev</button>
                  <span className="text-emerald-600">Ormoc Court Timetable</span>
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() + 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-white rounded-lg shadow-sm">Next ›</button>
                </div>
                <div className="overflow-x-auto border border-slate-200 rounded-2xl bg-slate-50 p-2">
                  <table className="w-full text-left border-collapse text-[11px]">
                    <thead>
                      <tr>
                        <th className="p-2 border-b border-slate-200 text-slate-500">Time</th>
                        {getSevenDays().map(d => <th key={d.dateStr} className="p-2 border-b border-slate-200 text-center text-slate-900 min-w-[90px]">{d.label}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {timeSlots.map(slotLabel => {
                        const time24 = slotTo24Hr(slotLabel);
                        return (
                          <tr key={slotLabel} className="border-b border-slate-100">
                            <td className="p-2 text-slate-500 font-mono text-[10px]">{slotLabel}</td>
                            {getSevenDays().map(d => {
                              const status = getSlotStatus(selectedOrganizerCourt.name, d.dateStr, time24);
                              const isChosen = selectedGridSlot?.date === d.dateStr && selectedGridSlot?.time === time24;
                              let bg = status === 'red' ? 'bg-red-50 text-red-600 border-red-200 opacity-80' : status === 'yellow' ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100';
                              if (isChosen) bg = 'bg-emerald-600 text-white font-extrabold ring-2 ring-emerald-400';
                              return (
                                <td key={d.dateStr} className="p-1.5 text-center">
                                  <button type="button" onClick={() => { if (status !== 'red') setSelectedGridSlot({ date: d.dateStr, time: time24, label: slotLabel }); }} className={`w-full py-2 rounded-xl border text-[10px] font-bold ${bg}`}>
                                    {status === 'red' ? 'Booked' : status === 'yellow' ? 'Pending' : 'Available'}
                                  </button>
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {selectedGridSlot && (
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-2xl flex justify-between items-center text-xs">
                    <span className="text-emerald-800 font-semibold">{selectedGridSlot.date} @ {selectedGridSlot.label}</span>
                    <button onClick={() => setShowOrganizerDetailsModal(true)} className="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl shadow">Confirm Request ›</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {showOrganizerDetailsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2"><h3 className="text-xs font-bold text-slate-900">📝 Request Details</h3><button onClick={() => setShowOrganizerDetailsModal(false)} className="text-slate-400 font-bold">✕</button></div>
                <form onSubmit={handleOrganizerFinalReservationSubmit} className="space-y-3 text-xs">
                  <div><label className="text-slate-600 font-bold block mb-1">Organizer Name</label><input type="text" value={orgResName} onChange={e => setOrgResName(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                  <div><label className="text-slate-600 font-bold block mb-1">Contact Number</label><input type="text" value={orgResContact} onChange={e => setOrgResContact(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-mono" /></div>
                  <div><label className="text-slate-600 font-bold block mb-1">Payment Method</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl font-bold"><button type="button" onClick={() => setOrgResPayment('gcash')} className={`py-1.5 rounded-lg ${orgResPayment === 'gcash' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>GCash</button><button type="button" onClick={() => setOrgResPayment('cash')} className={`py-1.5 rounded-lg ${orgResPayment === 'cash' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>Cash</button></div></div>
                  {orgResPayment === 'gcash' && <div><input type="text" value={orgResGcashRef} onChange={e => setOrgResGcashRef(e.target.value)} placeholder="GCash Ref No." className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-mono text-xs" /></div>}
                  <button type="submit" disabled={submittingOrganizerBooking} className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Submit Request</button>
                </form>
              </div>

          )}
        </div>
      );
    }

    // =========================================================================
    // 7. USER PROFILE VIEW COMPONENT
    // =========================================================================
    function UserProfileView({ currentUser, showNotification }) {
      const [fullName, setFullName] = React.useState(currentUser?.full_name || '');
      const [updating, setUpdating] = React.useState(false);

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        if (!fullName.trim()) return;
        setUpdating(true);
        try {
          await supabase.from('profiles').upsert({ id: currentUser.id, full_name: fullName.trim(), email: currentUser.email, role: currentUser.role }, { onConflict: 'id' });
          currentUser.full_name = fullName.trim();
          safeAuditLog(currentUser, 'UPDATE_PROFILE', { name: fullName.trim() });
          showNotification('Profile updated successfully!', 'success');
        } catch (err) {
          showNotification('Profile update error.', 'error');
        } finally {
          setUpdating(false);
        }
      };

      return (
        <div className="p-4 sm:p-6 max-w-md mx-auto w-full space-y-4">
          <div className="bg-white border border-slate-200 rounded-3xl p-6 space-y-5 shadow-sm">
            <div className="flex items-center gap-3.5 border-b border-slate-100 pb-4">
              <div className="w-12 h-12 rounded-2xl bg-emerald-100 flex items-center justify-center p-1.5 text-emerald-600"><MapPinLogo className="w-9 h-9" /></div>
              <div><h3 className="text-sm font-bold text-slate-900">{currentUser?.full_name}</h3><p className="text-xs text-emerald-600 capitalize font-mono">{currentUser?.role}</p></div>
            </div>
            <form onSubmit={handleUpdateProfile} className="space-y-4 text-xs">
              <div><label className="text-slate-600 font-bold block mb-1">Email</label><input type="text" disabled value={currentUser?.email || ''} className="w-full px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 font-mono" /></div>
              <div><label className="text-slate-600 font-bold block mb-1">Full Name</label><input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
              <button type="submit" disabled={updating} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow">Save Profile</button>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. MAIN APP SHELL & NAVIGATION
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = React.useState(null);
      const [activeNavTab, setActiveNavTab] = React.useState('dashboard');
      const [notification, setNotification] = React.useState({ message: '', type: 'info' });
      const [showLogoutModal, setShowLogoutModal] = React.useState(false);
      const [availableCourts, setAvailableCourts] = React.useState([]);
      const [isDesktopView, setIsDesktopView] = React.useState(window.innerWidth >= 768);

      React.useEffect(() => {
        let inactivityTimer;
        const resetInactivity = () => {
          clearTimeout(inactivityTimer);
          if (currentUser) {
            inactivityTimer = setTimeout(() => {
              safeAuditLog(currentUser, 'AUTO_LOGOUT_INACTIVITY', {});
              supabase.auth.signOut();
              setCurrentUser(null);
              showNotification('Automatically logged out due to 15 minutes of inactivity[cite: 17].', 'error');
            }, 15 * 60 * 1000);
          }
        };

        const events = ['mousemove', 'keydown', 'click', 'scroll'];
        events.forEach(evt => window.addEventListener(evt, resetInactivity));

        const handleStorageEvent = (e) => {
          if (e.key === 'recmatch_logout_sync') {
            setCurrentUser(null);
            showNotification('Logged out from another tab[cite: 17].', 'info');
          }
        };
        window.addEventListener('storage', handleStorageEvent);

        return () => {
          clearTimeout(inactivityTimer);
          events.forEach(evt => window.removeEventListener(evt, resetInactivity));
          window.removeEventListener('storage', handleStorageEvent);
        };
      }, [currentUser]);

      React.useEffect(() => {
        const handleResize = () => setIsDesktopView(window.innerWidth >= 768);
        window.addEventListener('resize', handleResize);
        fetchAdminCreatedCourts();
        return () => window.removeEventListener('resize', handleResize);
      }, [currentUser]);

      const fetchAdminCreatedCourts = async () => {
        const { data: allAdminCourts } = await supabase.from('enrollments').select('*').like('course_program', '%NEW COURT PROPOSAL%').in('status', ['Approved', 'dean_approved']);
        const filteredCourts = [];
        if (allAdminCourts) {
          allAdminCourts.forEach((item) => {
            let pureName = item.course_program.replace('🏟️ NEW COURT PROPOSAL: ', '').split(' (₱')[0].trim();
            const rateMatch = item.course_program.match(/₱(\d+)\/hr/);
            const rateVal = rateMatch ? parseInt(rateMatch[1], 10) : 150;
            const locMatch = item.course_program.match(/@\s*(.*)$/);
            const locVal = locMatch ? locMatch[1].trim() : 'Ormoc City';
            const imgData = item.academic_year && item.academic_year.startsWith('data:image') ? item.academic_year : null;
            filteredCourts.push({ id: `approved_court_${item.id}`, name: pureName, sport: 'Basketball', rate: rateVal, location: locVal, image: imgData });
          });
        }
        setAvailableCourts(filteredCourts);
      };

      const showNotification = (message, type = 'info') => setNotification({ message, type });
      const clearNotification = () => setNotification({ message: '', type: 'info' });

      const handleConfirmLogout = async () => {
        safeAuditLog(currentUser, 'LOGOUT', {});
        await supabase.auth.signOut();
        localStorage.setItem('recmatch_logout_sync', Date.now().toString());
        setCurrentUser(null);
        setShowLogoutModal(false);
        showNotification('Signed out of RecMatch[cite: 17].', 'info');
      };

      const isAdmin = currentUser?.role === 'Admin' || currentUser?.role === 'admin';
      const isOrganizer = currentUser?.role === 'Organizer' || currentUser?.role === 'dean';

      const containerClasses = isDesktopView 
        ? "w-full h-full flex flex-col justify-between overflow-hidden bg-slate-100" 
        : "w-full h-full flex flex-col justify-between overflow-hidden bg-slate-100 max-w-md mx-auto shadow-2xl border border-slate-200 rounded-none sm:rounded-[40px]";

      return (
        <div className={containerClasses}>
          <ConfirmModal isOpen={showLogoutModal} title="Confirm Logout" message="Are you sure you want to log out?" confirmText="Logout" confirmStyle="danger" onConfirm={handleConfirmLogout} onCancel={() => setShowLogoutModal(false)} />
          <SystemBanner notification={notification} onClose={clearNotification} />

          {!currentUser ? (
            <div className="flex-1 flex flex-col justify-between overflow-y-auto bg-slate-100">
              <AuthModule onAuthSuccess={(user) => {
                setCurrentUser(user);
                fetchAdminCreatedCourts();
                setActiveNavTab(user.role === 'Organizer' ? 'approvals' : user.role === 'Admin' ? 'dashboard' : 'home');
              }} showNotification={showNotification} />
              <footer className="py-3 text-center text-[10px] text-slate-400 font-mono">RecMatch Ormoc &copy; 2026</footer>
            </div>
          ) : (
            <div className="flex flex-col h-full justify-between bg-slate-50">
              <header className="px-6 py-4 bg-white border-b border-slate-200 flex items-center justify-between shadow-sm shrink-0">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-extrabold shadow-sm">R</div>
                  <h1 className="text-base font-extrabold text-slate-900 tracking-tight">RecMatch</h1>
                </div>

                <div className="flex items-center gap-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400 font-medium hidden sm:inline">View as</span>
                    <span className="px-3 py-1 bg-slate-100 text-slate-900 rounded-xl text-xs font-bold border border-slate-200">{currentUser.role}</span>
                  </div>
                  <div className="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-xs">
                    {currentUser.full_name?.charAt(0).toUpperCase()}
                  </div>
                  <button type="button" onClick={() => setShowLogoutModal(true)} className="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold transition-all">Logout</button>
                </div>
              </header>

              <div className="flex flex-1 min-h-0 overflow-hidden">
                {isDesktopView && (
                  <aside className="w-64 bg-white border-r border-slate-200 p-5 flex flex-col shrink-0 space-y-6">
                    <div className="space-y-1">
                      <div className="flex items-center gap-3 px-3 py-2 mb-2 bg-slate-50 rounded-2xl border border-slate-100">
                        <div className="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xs">{currentUser.full_name?.charAt(0).toUpperCase()}</div>
                        <div className="overflow-hidden">
                          <p className="text-xs font-bold text-slate-900 truncate">{currentUser.full_name}</p>
                          <p className="text-[10px] text-slate-500 truncate">{currentUser.role} account</p>
                        </div>
                      </div>

                      <p className="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400">Workspace</p>
                      <nav className="space-y-1 pt-1">
                        {(isAdmin ? [
                          { id: 'dashboard', label: 'Overview', icon: '📊' },
                          { id: 'add_court', label: 'Add Court', icon: '➕' },
                          { id: 'profile', label: 'Profile', icon: '👤' }
                        ] : isOrganizer ? [
                          { id: 'approvals', label: 'Overview', icon: '📊' },
                          { id: 'request_court', label: 'Request Court', icon: '🏟️' },
                          { id: 'create_league', label: 'Create League', icon: '🏆' },
                          { id: 'profile', label: 'Profile', icon: '👤' }
                        ] : [
                          { id: 'home', label: 'Overview', icon: '🏠' },
                          { id: 'reservation', label: 'Find Courts', icon: '🏟️' },
                          { id: 'leagues', label: 'Leagues', icon: '🏆' },
                          { id: 'profile', label: 'Profile', icon: '👤' }
                        ]).map((item) => (
                          <button key={item.id} type="button" onClick={() => setActiveNavTab(item.id)} className={`flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-left text-xs font-bold transition-all ${activeNavTab === item.id ? 'bg-emerald-50 text-emerald-700 shadow-sm' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}>
                            <span>{item.icon}</span><span>{item.label}</span>
                          </button>
                        ))}
                      </nav>
                    </div>

                    <div className="mt-auto p-4 bg-emerald-50 rounded-2xl border border-emerald-100 space-y-1">
                      <p className="text-xs font-bold text-emerald-900">Play local. Play together.</p>
                      <p className="text-[10px] text-emerald-700">Find a court, join a league, and meet your teammates.</p>
                    </div>
                  </aside>
                )}

                <main className="flex-1 min-w-0 flex flex-col overflow-hidden bg-slate-50">
                  {activeNavTab === 'profile' ? <UserProfileView currentUser={currentUser} showNotification={showNotification} /> :
                   isAdmin ? <AdminDashboard currentUser={currentUser} showNotification={showNotification} refreshCourts={fetchAdminCreatedCourts} activeSubTab={activeNavTab} setActiveSubTab={setActiveNavTab} availableCourts={availableCourts} /> :
                   isOrganizer ? <OrganizerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} refreshCourts={fetchAdminCreatedCourts} activeNavTab={activeNavTab} setActiveNavTab={setActiveNavTab} /> :
                   <PlayerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} playerNavTab={activeNavTab} setActiveNavTab={setActiveNavTab} />}
                </main>
              </div>

              {!isDesktopView && (
                <nav className="px-4 py-2.5 bg-white border-t border-slate-200 flex items-center justify-around text-[10px] shrink-0 font-bold">
                  {isAdmin ? (
                    <>
                      <button onClick={() => setActiveNavTab('dashboard')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'dashboard' ? 'text-emerald-600' : 'text-slate-400'}`}><span>📊</span><span>Overview</span></button>
                      <button onClick={() => setActiveNavTab('add_court')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'add_court' ? 'text-emerald-600' : 'text-slate-400'}`}><span>➕</span><span>Add Court</span></button>
                      <button onClick={() => setActiveNavTab('profile')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-emerald-600' : 'text-slate-400'}`}><span>👤</span><span>Profile</span></button>
                    </>
                  ) : isOrganizer ? (
                    <>
                      <button onClick={() => setActiveNavTab('approvals')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'approvals' ? 'text-emerald-600' : 'text-slate-400'}`}><span>📊</span><span>Overview</span></button>
                      <button onClick={() => setActiveNavTab('request_court')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'request_court' ? 'text-emerald-600' : 'text-slate-400'}`}><span>🏟️</span><span>Request</span></button>
                      <button onClick={() => setActiveNavTab('create_league')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'create_league' ? 'text-emerald-600' : 'text-slate-400'}`}><span>🏆</span><span>Leagues</span></button>
                      <button onClick={() => setActiveNavTab('profile')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-emerald-600' : 'text-slate-400'}`}><span>👤</span><span>Profile</span></button>
                    </>
                  ) : (
                    <>
                      <button onClick={() => setActiveNavTab('home')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'home' ? 'text-emerald-600' : 'text-slate-400'}`}><span>🏠</span><span>Home</span></button>
                      <button onClick={() => setActiveNavTab('reservation')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'reservation' ? 'text-emerald-600' : 'text-slate-400'}`}><span>🏟️</span><span>Courts</span></button>
                      <button onClick={() => setActiveNavTab('leagues')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'leagues' ? 'text-emerald-600' : 'text-slate-400'}`}><span>🏆</span><span>Leagues</span></button>
                      <button onClick={() => setActiveNavTab('profile')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-emerald-600' : 'text-slate-400'}`}><span>👤</span><span>Profile</span></button>
                    </>
                  )}
                </nav>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
