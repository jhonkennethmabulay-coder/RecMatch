<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RecMatch — Play More. Connect Local.</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-full text-slate-800 antialiased font-sans bg-slate-100 selection:bg-emerald-500 selection:text-white flex flex-col overflow-hidden m-0 p-0">

  <div id="root" class="w-full h-full flex flex-col overflow-hidden relative"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://wzqwlfexvrijxdvyxhvc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_tZf_thg0O-sPQxxuOAb83w_5bTgM9Hs";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const IAS_PASSWORD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!\%*?&]{8,}$/;

    const safeAuditLog = async (user, action, details) => {
      try {
        await supabase.from('audit_logs').insert({
          user_id: user?.id || 'guest',
          user_email: user?.email || 'unknown',
          user_role: user?.role || 'Guest',
          action: action,
          details: typeof details === 'object' ? JSON.stringify(details) : details,
          created_at: new Date().toISOString()
        });
      } catch (err) {
        console.warn('Audit log entry skipped:', err);
      }
    };

    const formatScheduleTo12Hour = (scheduleStr) => {
      if (!scheduleStr) return '';
      const convertSingleTimeTo12Hour = (str) => {
        const trimmed = str.trim();
        if (!trimmed.includes('@')) return trimmed;
        const parts = trimmed.split(' @ ');
        const datePart = parts[0].replace('Date: ', '').trim();
        const timePart = parts[1].trim();
        const timeSubParts = timePart.split(':');
        if (timeSubParts.length < 2) return trimmed;
        let hours = parseInt(timeSubParts[0], 10);
        const minutes = timeSubParts[1];
        if (isNaN(hours)) return trimmed;
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const formattedHours = hours < 10 ? '0' + hours : hours;
        return `${datePart} @ ${formattedHours}:${minutes} ${ampm}`;
      };

      if (scheduleStr.includes(' to ') || scheduleStr.includes(' - ')) {
        const separator = scheduleStr.includes(' to ') ? ' to ' : ' - ';
        const rangeParts = scheduleStr.split(separator);
        const startFormatted = convertSingleTimeTo12Hour(rangeParts[0]);
        const endPartRaw = rangeParts[1].trim();
        let endFormatted = endPartRaw;
        if (endPartRaw.includes(':') && !endPartRaw.includes('@')) {
          const timeSubParts = endPartRaw.split(':');
          let hours = parseInt(timeSubParts[0], 10);
          const minutes = timeSubParts[1];
          if (!isNaN(hours)) {
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedHours = hours < 10 ? '0' + hours : hours;
            endFormatted = `${formattedHours}:${minutes} ${ampm}`;
          }
        } else {
          endFormatted = convertSingleTimeTo12Hour(endPartRaw);
        }
        return `${startFormatted} to ${endFormatted}`;
      }
      return convertSingleTimeTo12Hour(scheduleStr);
    };

    const isSchedulePast = (scheduleStr) => {
      if (!scheduleStr) return false;
      const mainPart = scheduleStr.split(' to ')[0].split(' - ')[0];
      const parts = mainPart.split(' @ ');
      if (parts.length < 2) return false;
      const datePart = parts[0].replace('Date: ', '').trim();
      const timePart = parts[1].trim();
      const scheduleDate = new Date(`${datePart}T${timePart}`);
      return isNaN(scheduleDate.getTime()) ? false : scheduleDate < new Date();
    };

    function MapPinLogo({ className = "w-8 h-8" }) {
      return (
        <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 5C27.9086 5 10 22.9086 10 45C10 68 50 95 50 95C50 95 90 68 90 45C90 22.9086 72.0914 5 50 5Z" fill="#10B981" />
          <circle cx="50" cy="42" r="22" fill="#F8FAFC" />
          <path d="M28 42H72" stroke="#10B981" strokeWidth="2.5" />
          <path d="M50 20V64" stroke="#10B981" strokeWidth="2.5" />
        </svg>
      );
    }

    const parseTimeToMinutes = (timeStr) => {
      if (!timeStr) return 0;
      let str = timeStr.trim().toUpperCase();
      let hours = 0;
      let minutes = 0;
      if (str.includes('PM') || str.includes('AM')) {
        const parts = str.split(' ');
        const timeParts = parts[0].split(':');
        hours = parseInt(timeParts[0], 10);
        minutes = parseInt(timeParts[1] || 0, 10);
        const ampm = parts[1];
        if (ampm === 'PM' && hours < 12) hours += 12;
        if (ampm === 'AM' && hours === 12) hours = 0;
      } else {
        const timeParts = str.split(':');
        hours = parseInt(timeParts[0], 10);
        minutes = parseInt(timeParts[1] || 0, 10);
      }
      return hours * 60 + minutes;
    };

    function SystemBanner({ notification, onClose }) {
      if (!notification || !notification.message) return null;
      const isError = notification.type === 'error';
      const isSuccess = notification.type === 'success';

      return (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-md p-3.5 rounded-2xl border flex items-start justify-between gap-3 text-xs font-medium shadow-2xl backdrop-blur-md transition-all duration-300 ${
          isError ? 'bg-red-900 text-white border-red-700' :
          isSuccess ? 'bg-emerald-900 text-white border-emerald-700' :
          'bg-slate-900 text-white border-slate-700'
        }`}>
          <div className="flex items-center gap-2.5">
            <span>{isError ? '⚠️' : isSuccess ? '✅' : 'ℹ️'}</span>
            <p>{notification.message}</p>
          </div>
          {onClose && <button onClick={onClose} className="font-bold">✕</button>}
        </div>
      );
    }

    function ConfirmModal({ isOpen, title, message, confirmText, confirmStyle, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4">
          <div className="w-full max-w-xs bg-white border border-slate-200 rounded-3xl p-5 shadow-2xl text-center space-y-4">
            <h3 className="text-base font-bold text-slate-900">{title || 'Confirm Action'}</h3>
            <p className="text-xs text-slate-600">{message}</p>
            <div className="grid grid-cols-2 gap-2 pt-2">
              <button onClick={onCancel} className="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">Cancel</button>
              <button onClick={onConfirm} className={`py-2.5 rounded-xl text-xs font-semibold text-white ${confirmStyle === 'danger' ? 'bg-red-600 hover:bg-red-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}>{confirmText || 'Confirm'}</button>
            </div>
          </div>
        </div>
      );
    }

    function StatusBadge({ status, scheduleStr }) {
      const isPast = isSchedulePast(scheduleStr);
      let styles = 'bg-slate-100 text-slate-600 border-slate-200';
      let label = status;

      if (isPast && (status === 'Approved' || status === 'dean_approved')) {
        styles = 'bg-slate-100 text-slate-500 border-slate-200';
        label = 'Expired';
      } else if (status === 'submitted' || status === 'Pending') {
        styles = 'bg-amber-50 text-amber-600 border-amber-200';
        label = 'Pending';
      } else if (status === 'dean_approved' || status === 'Approved') {
        styles = 'bg-emerald-50 text-emerald-600 border-emerald-200';
        label = 'Approved';
      } else if (status === 'rejected' || status === 'Declined') {
        styles = 'bg-red-50 text-red-600 border-red-200';
        label = 'Declined';
      }

      return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border ${styles}`}>{label}</span>;
    }

    // =========================================================================
    // 3. AUTH MODULE
    // =========================================================================
    function AuthModule({ onAuthSuccess, showNotification }) {
      const [activeTab, setActiveTab] = React.useState('login');
      const [loginEmail, setLoginEmail] = React.useState('');
      const [loginPassword, setLoginPassword] = React.useState('');
      const [showLoginPassword, setShowLoginPassword] = React.useState(false);
      const [failedAttempts, setFailedAttempts] = React.useState(0);
      const [isLockedOut, setIsLockedOut] = React.useState(false);
      const [lockoutTimer, setLockoutTimer] = React.useState(0);

      const [regFullName, setRegFullName] = React.useState('');
      const [regEmail, setRegEmail] = React.useState('');
      const [regRole, setRegRole] = React.useState('Player / User');
      const [regPassword, setRegPassword] = React.useState('');
      const [showRegPassword, setShowRegPassword] = React.useState(false);
      const [regConfirmPassword, setRegConfirmPassword] = React.useState('');
      const [regLoading, setRegLoading] = React.useState(false);

      const [showOtpModal, setShowOtpModal] = React.useState(false);
      const [generatedOtp, setGeneratedOtp] = React.useState('');
      const [enteredOtp, setEnteredOtp] = React.useState('');
      const [pendingUserData, setPendingUserData] = React.useState(null);

      const [showForgotModal, setShowForgotModal] = React.useState(false);
      const [forgotEmail, setForgotEmail] = React.useState('');
      const [forgotStep, setForgotStep] = React.useState(1);
      const [forgotOtp, setForgotOtp] = React.useState('');
      const [systemForgotOtp, setSystemForgotOtp] = React.useState('');
      const [newPassword, setNewPassword] = React.useState('');
      const [showNewPassword, setShowNewPassword] = React.useState(false);

      React.useEffect(() => {
        let interval = null;
        if (isLockedOut && lockoutTimer > 0) {
          interval = setInterval(() => setLockoutTimer(prev => prev - 1), 1000);
        } else if (lockoutTimer === 0 && isLockedOut) {
          setIsLockedOut(false);
          setFailedAttempts(0);
        }
        return () => clearInterval(interval);
      }, [isLockedOut, lockoutTimer]);

      const determineUserRole = (email, metadataRole) => {
        const lowerEmail = String(email || '').toLowerCase();
        if (lowerEmail.includes('admin')) return 'Admin';
        if (lowerEmail.includes('organizer') || lowerEmail.includes('dean')) return 'Organizer';
        if (metadataRole === 'Admin' || metadataRole === 'Organizer') return metadataRole;
        if (metadataRole === 'dean') return 'Organizer';
        if (metadataRole === 'admin') return 'Admin';
        return regRole || 'Player / User';
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        if (isLockedOut) { showNotification(`Account temporarily locked. Try again in ${lockoutTimer}s.`, 'error'); return; }
        if (!loginEmail.trim() || !loginPassword) { showNotification('Empty email or password field.', 'error'); return; }
        try {
          const { data, error } = await supabase.auth.signInWithPassword({ email: loginEmail, password: loginPassword });
          if (error) {
            const nextAttempts = failedAttempts + 1;
            setFailedAttempts(nextAttempts);
            safeAuditLog({ email: loginEmail }, 'FAILED_LOGIN', { attempts: nextAttempts });
            if (nextAttempts >= 3) {
              setIsLockedOut(true);
              setLockoutTimer(60);
              showNotification('Account locked due to 3 consecutive failed login attempts[cite: 17].', 'error');
            } else {
              showNotification(`Invalid credentials. Attempts remaining: ${3 - nextAttempts}[cite: 17].`, 'error');
            }
            return;
          }
          setFailedAttempts(0);
          let { data: profile } = await supabase.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
          let userRole = determineUserRole(loginEmail, profile?.role || data.user.user_metadata?.role);
          let userName = profile?.full_name || data.user.user_metadata?.full_name || loginEmail.split('@')[0];
          const loggedUser = { id: data.user.id, full_name: userName, email: loginEmail, role: userRole };
          safeAuditLog(loggedUser, 'SUCCESSFUL_LOGIN', { role: userRole });
          onAuthSuccess(loggedUser);
        } catch (err) {
          showNotification('Authentication error.', 'error');
        }
      };

      const handleRegisterTrigger = (e) => {
        e.preventDefault();
        if (!regFullName.trim() || !regEmail.trim()) { showNotification('All fields required.', 'error'); return; }
        if (!IAS_PASSWORD_REGEX.test(regPassword)) { showNotification('Password must have min 8 chars, uppercase, lowercase, number & special character[cite: 17].', 'error'); return; }
        if (regPassword !== regConfirmPassword) { showNotification('Passwords do not match[cite: 17].', 'error'); return; }

        const mockOtp = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(mockOtp);
        setPendingUserData({ email: regEmail, password: regPassword, full_name: regFullName, role: determineUserRole(regEmail, regRole) });
        setShowOtpModal(true);
        showNotification(`[SIMULATION OTP] Your verification code is: ${mockOtp}`, 'success');
        safeAuditLog({ email: regEmail }, 'OTP_GENERATED_SIGNUP', {});
      };

      const handleVerifyOtpAndRegister = async (e) => {
        e.preventDefault();
        if (enteredOtp !== generatedOtp) { showNotification('Invalid OTP code[cite: 17].', 'error'); return; }
        setRegLoading(true);
        try {
          const { data, error } = await supabase.auth.signUp({ email: pendingUserData.email, password: pendingUserData.password, options: { data: { full_name: pendingUserData.full_name, role: pendingUserData.role } } });
          if (error) { showNotification(error.message, 'error'); setRegLoading(false); return; }
          if (data?.user) {
            await supabase.from('profiles').upsert({ id: data.user.id, full_name: pendingUserData.full_name, email: pendingUserData.email, role: pendingUserData.role }, { onConflict: 'id' });
          }
          safeAuditLog({ email: pendingUserData.email }, 'ACCOUNT_VERIFIED_AND_REGISTERED', {});
          showNotification('Account verified and created successfully! Please sign in.', 'success');
          setShowOtpModal(false);
          setActiveTab('login');
          setLoginEmail(pendingUserData.email);
        } catch (err) {
          showNotification('Registration error.', 'error');
        } finally {
          setRegLoading(false);
        }
      };

      const handleForgotTrigger = (e) => {
        e.preventDefault();
        if (!forgotEmail.trim()) { showNotification('Enter your email address.', 'error'); return; }
        const mockOtp = Math.floor(100000 + Math.random() * 900000).toString();
        setSystemForgotOtp(mockOtp);
        setForgotStep(2);
        showNotification(`[SIMULATION OTP] Reset Code: ${mockOtp}`, 'success');
        safeAuditLog({ email: forgotEmail }, 'FORGOT_PASSWORD_REQUEST', {});
      };

      const handleVerifyForgotOtp = (e) => {
        e.preventDefault();
        if (forgotOtp !== systemForgotOtp) { showNotification('Invalid OTP code[cite: 17].', 'error'); return; }
        setForgotStep(3);
      };

      const handleFinalResetPassword = (e) => {
        e.preventDefault();
        if (!IAS_PASSWORD_REGEX.test(newPassword)) { showNotification('Password must have min 8 chars, uppercase, lowercase, number & special character[cite: 17].', 'error'); return; }
        showNotification('Password successfully reset! Please sign in with your new password.', 'success');
        safeAuditLog({ email: forgotEmail }, 'PASSWORD_RESET_SUCCESS', {});
        setShowForgotModal(false);
        setForgotStep(1);
        setForgotEmail('');
        setNewPassword('');
      };

      const hasLength = regPassword.length >= 8;
      const hasUpper = /[A-Z]/.test(regPassword);
      const hasLower = /[a-z]/.test(regPassword);
      const hasNum = /\d/.test(regPassword);
      const hasSym = /[@$!%*?&]/.test(regPassword);

      return (
        <div className="max-w-md w-full mx-auto p-6 bg-white rounded-3xl shadow-xl border border-slate-200 my-auto space-y-6">
          {showOtpModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-xs bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2"><h3 className="text-xs font-bold text-slate-900">🔐 Email OTP Verification</h3><button onClick={() => setShowOtpModal(false)} className="text-slate-400 font-bold">✕</button></div>
                <p className="text-xs text-slate-600">Enter the 6-digit OTP sent to your email to complete registration[cite: 17].</p>
                <form onSubmit={handleVerifyOtpAndRegister} className="space-y-3 text-xs">
                  <input type="text" value={enteredOtp} onChange={e => setEnteredOtp(e.target.value)} placeholder="Enter 6-digit OTP" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-center font-mono text-sm tracking-widest text-slate-900" maxLength={6} />
                  <button type="submit" disabled={regLoading} className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">{regLoading ? 'Verifying...' : 'Verify & Register'}</button>
                </form>
              </div>
            </div>
          )}

          {showForgotModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2"><h3 className="text-xs font-bold text-slate-900">🔑 Forgot Password Recovery</h3><button onClick={() => setShowForgotModal(false)} className="text-slate-400 font-bold">✕</button></div>
                {forgotStep === 1 && (
                  <form onSubmit={handleForgotTrigger} className="space-y-3 text-xs">
                    <div><label className="text-slate-600 font-bold mb-1 block">Registered Email</label><input type="email" value={forgotEmail} onChange={e => setForgotEmail(e.target.value)} placeholder="jhon@recmatch.com" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                    <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Send Recovery OTP</button>
                  </form>
                )}
                {forgotStep === 2 && (
                  <form onSubmit={handleVerifyForgotOtp} className="space-y-3 text-xs">
                    <p className="text-[11px] text-slate-500">Enter OTP sent to {forgotEmail}</p>
                    <input type="text" value={forgotOtp} onChange={e => setForgotOtp(e.target.value)} placeholder="Enter OTP" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-center font-mono text-sm tracking-widest text-slate-900" maxLength={6} />
                    <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Verify OTP</button>
                  </form>
                )}
                {forgotStep === 3 && (
                  <form onSubmit={handleFinalResetPassword} className="space-y-3 text-xs">
                    <div>
                      <label className="text-slate-600 font-bold mb-1 block">New Password</label>
                      <div className="relative">
                        <input type={showNewPassword ? 'text' : 'password'} value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 pr-10" />
                        <button type="button" onClick={() => setShowNewPassword(!showNewPassword)} className="absolute right-3 top-2.5 text-slate-400 text-[10px] font-bold">{showNewPassword ? 'Hide' : 'Show'}</button>
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Update Password</button>
                  </form>
                )}
              </div>
            </div>
          )}

          <div className="text-center space-y-1">
            <div className="inline-flex items-center justify-center p-3 rounded-2xl bg-emerald-100 text-emerald-600 mb-1">
              <MapPinLogo className="w-8 h-8" />
            </div>
            <h1 className="text-2xl font-extrabold text-slate-900">RecMatch</h1>
            <p className="text-xs text-slate-500">Play More. Connect Local.</p>
          </div>
          <div className="grid grid-cols-2 p-1 bg-slate-100 rounded-xl text-xs font-bold">
            <button type="button" onClick={() => setActiveTab('login')} className={`py-2 rounded-lg transition-all ${activeTab === 'login' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}>Sign In</button>
            <button type="button" onClick={() => setActiveTab('register')} className={`py-2 rounded-lg transition-all ${activeTab === 'register' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'}`}>Sign Up</button>
          </div>
          {activeTab === 'login' ? (
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} placeholder="jhon@recmatch.com" className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 outline-none focus:border-emerald-500" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <div className="relative">
                  <input type={showLoginPassword ? 'text' : 'password'} value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 outline-none focus:border-emerald-500 pr-12" />
                  <button type="button" onClick={() => setShowLoginPassword(!showLoginPassword)} className="absolute right-3 top-3 text-[10px] font-bold text-slate-400 hover:text-slate-600">{showLoginPassword ? 'Hide' : 'Show'}</button>
                </div>
              </div>
              <button type="submit" disabled={isLockedOut} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/20 transition-all">{isLockedOut ? `Locked (${lockoutTimer}s)` : 'Sign In'}</button>
              
              <div className="text-center pt-1">
                <button type="button" onClick={() => setShowForgotModal(true)} className="text-xs text-emerald-600 font-bold hover:underline">Forgot Password?</button>
              </div>
            </form>
          ) : (
            <form onSubmit={handleRegisterTrigger} className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
              <div>
                <label className="block text-[11px] font-bold text-slate-700 mb-1">Full Name</label>
                <input type="text" value={regFullName} onChange={e => setRegFullName(e.target.value)} placeholder="Jhon Kenneth" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900" />
              </div>
              <div>
                <label className="block text-[11px] font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" value={regEmail} onChange={e => setRegEmail(e.target.value)} placeholder="jhon@recmatch.com" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900" />

    // =========================================================================
    // 4. ADMIN MANAGEMENT DESK
    // =========================================================================
    function AdminDashboard({ currentUser, showNotification, refreshCourts, activeSubTab, setActiveSubTab, availableCourts }) {
      const [pendingProposals, setPendingProposals] = React.useState([]);
      const [auditLogs, setAuditLogs] = React.useState([]);
      const [approvingItem, setApprovingItem] = React.useState(null);
      const [adminEndTime, setAdminEndTime] = React.useState('18:00');
      const [courtName, setCourtName] = React.useState('');
      const [courtLocation, setCourtLocation] = React.useState('Ormoc City');
      const [courtRate, setCourtRate] = React.useState('200');
      const [courtImagePreview, setCourtImagePreview] = React.useState('');
      const [addingCourt, setAddingCourt] = React.useState(false);

      React.useEffect(() => {
        fetchProposals();
        fetchAuditLogs();
      }, []);

      const fetchProposals = async () => {
        const { data } = await supabase.from('enrollments').select('*').order('submitted_at', { ascending: false });
        setPendingProposals(data || []);
      };

      const fetchAuditLogs = async () => {
        const { data } = await supabase.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(50);
        setAuditLogs(data || []);
      };

      const handleCourtImageChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => setCourtImagePreview(event.target.result);
        reader.readAsDataURL(file);
      };

      const handleAddCourt = async (e) => {
        e.preventDefault();
        if (!courtName.trim()) return;
        setAddingCourt(true);
        try {
          const courtTag = `🏟️ NEW COURT PROPOSAL: ${courtName.trim()} (₱${courtRate}/hr) - Basketball @ ${courtLocation.trim()}`;
          await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: courtTag, academic_year: courtImagePreview || '2026', semester: `Loc: ${courtLocation.trim()}`, status: 'Approved' });
          safeAuditLog(currentUser, 'ADMIN_ADD_COURT', { court: courtName.trim() });
          showNotification('Court added successfully!', 'success');
          setCourtName(''); setCourtImagePreview('');
          fetchProposals();
          if (refreshCourts) refreshCourts();
          setActiveSubTab('dashboard');
        } catch (err) {
          showNotification('Error adding court.', 'error');
        } finally {
          setAddingCourt(false);
        }
      };

      const handleConfirmApprovalWithEndTime = async (e) => {
        e.preventDefault();
        if (!approvingItem) return;
        const updatedSemester = `${approvingItem.semester} to ${adminEndTime}`;
        const { error } = await supabase.from('enrollments').update({ status: 'Approved', semester: updatedSemester }).eq('id', approvingItem.id);
        if (error) {
          showNotification(`Approval failed: ${error.message}`, 'error');
        } else {
          safeAuditLog(currentUser, 'ADMIN_APPROVE_BOOKING', { id: approvingItem.id });
          showNotification('Court reservation approved with End Time set!', 'success');
          setApprovingItem(null);
          fetchProposals();
          if (refreshCourts) refreshCourts();
        }
      };

      const handleDownloadBackup = async () => {
        try {
          const { data } = await supabase.from('enrollments').select('*');
          const backupData = JSON.stringify(data, null, 2);
          const blob = new Blob([backupData], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `recmatch_database_backup_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          safeAuditLog(currentUser, 'DATABASE_BACKUP_EXPORT', {});
          showNotification('Database backup successfully exported[cite: 17]!', 'success');
        } catch (err) {
          showNotification('Backup export failed.', 'error');
        }
      };

      const handleRestoreBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              for (const item of parsed) {
                delete item.id;
                await supabase.from('enrollments').insert(item);
              }
              safeAuditLog(currentUser, 'DATABASE_RESTORE', { recordsCount: parsed.length });
              showNotification('Database successfully restored from backup file[cite: 17]!', 'success');
              fetchProposals();
            } else {
              showNotification('Invalid backup file format.', 'error');
            }
          } catch (err) {
            showNotification('Error parsing backup file.', 'error');
          }
        };
        reader.readAsText(file);
      };

      const activeLeaguesCount = pendingProposals.filter(p => p.course_program?.includes('LEAGUE:') && (p.status === 'Approved' || p.status === 'dean_approved')).length;
      const totalBookingsCount = pendingProposals.filter(p => !p.course_program?.includes('NEW COURT PROPOSAL') && !p.course_program?.includes('LEAGUE')).length;
      const pendingReviewCount = pendingProposals.filter(p => p.status === 'Pending' || p.status === 'submitted').length;

                <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1">

                  <p className="text-[10px] text-emerald-600 font-mono">Start: {formatScheduleTo12Hour(approvingItem.semester)}</p>
                </div>
                <form onSubmit={handleConfirmApprovalWithEndTime} className="space-y-3.5 text-xs">

                    <label className="block text-[10px] font-bold text-slate-600 mb-1">Reservation End Time (e.g., 12:00 PM)</label>

                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button type="button" onClick={() => setApprovingItem(null)} className="py-2.5 px-3 bg-slate-100 text-slate-700 rounded-xl font-semibold">Cancel</button>
                    <button type="submit" className="py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Confirm & Approve</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {activeSubTab === 'add_court' ? (
            <div className="max-w-xl mx-auto bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-sm my-auto">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">🏟️ Add a Court Facility</h3>
                <button onClick={() => setActiveSubTab('dashboard')} className="text-slate-400 font-bold text-xs">✕ Back</button>
              </div>
              <form onSubmit={handleAddCourt} className="space-y-4 text-xs">
                <div><label className="block text-xs font-bold text-slate-700 mb-1">Court Name</label><input type="text" value={courtName} onChange={(e) => setCourtName(e.target.value)} placeholder="SuperDome" className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                <div className="grid grid-cols-2 gap-3">
                  <div><label className="block text-xs font-bold text-slate-700 mb-1">Rate (₱/hr)</label><input type="number" value={courtRate} onChange={(e) => setCourtRate(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                  <div><label className="block text-xs font-bold text-slate-700 mb-1">Location</label><input type="text" value={courtLocation} onChange={(e) => setCourtLocation(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                </div>
                <div><label className="block text-xs font-bold text-slate-700 mb-1">Court Picture</label><input type="file" accept="image/*" onChange={handleCourtImageChange} className="w-full text-xs text-slate-500" /></div>
                <button type="submit" disabled={addingCourt} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow">Add Court Facility</button>
              </form>
            </div>
          ) : activeSubTab === 'logs' ? (
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">🛡️ IAS 1 Security Audit Log Trail</h3>
                <button onClick={fetchAuditLogs} className="text-xs text-emerald-600 hover:underline">Refresh Logs</button>
              </div>
              <div className="overflow-x-auto max-h-[400px]">
                <table className="w-full text-left border-collapse text-[11px]">
                  <thead>
                    <tr className="border-b border-slate-100 text-slate-400 font-bold">
                      <th className="pb-2">TIMESTAMP</th>
                      <th className="pb-2">USER</th>
                      <th className="pb-2">ROLE</th>
                      <th className="pb-2">ACTION</th>
                      <th className="pb-2">DETAILS</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 font-mono">
                    {auditLogs.map(log => (
                      <tr key={log.id} className="hover:bg-slate-50">
                        <td className="py-2.5 text-slate-500">{new Date(log.created_at).toLocaleString()}</td>
                        <td className="py-2.5 font-bold text-slate-800">{log.user_email}</td>

          ) : activeSubTab === 'backup' ? (
            <div className="max-w-xl mx-auto bg-white border border-slate-200 rounded-3xl p-6 space-y-5 shadow-sm my-auto">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">💾 Database Backup & Recovery</h3>

                <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl space-y-2">

                  <button onClick={handleDownloadBackup} className="py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow">Download Backup File</button>

                <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                  <p className="font-bold text-slate-900">Data Restoration[cite: 17]</p>
                  <p className="text-slate-600">Select a previously saved backup file to restore system records[cite: 17].</p>
                  <input type="file" accept=".json" onChange={handleRestoreBackup} className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-200 file:text-slate-700 hover:file:bg-slate-300" />

            <>

                  <p className="text-2xl font-extrabold text-slate-900">{activeLeaguesCount}</p>
                  <p className="text-[10px] text-emerald-600">Community competitions</p>
                </div>
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                  <p className="text-[11px] font-bold text-slate-400">Total bookings</p>
                  <p className="text-2xl font-extrabold text-slate-900">{totalBookingsCount}</p>
                  <p className="text-[10px] text-emerald-600">All reservation records</p>

                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">

              <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">

                            <td className="py-3.5"><StatusBadge status={req.status} scheduleStr={req.semester} /></td>

                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    // =========================================================================
    // 5. PLAYER / USER DASHBOARD
    // =========================================================================
    function PlayerDashboard({ currentUser, showNotification, availableCourts, playerNavTab, setActiveNavTab }) {
      const [bookings, setBookings] = React.useState([]);
      const [openLeagues, setOpenLeagues] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [selectedCourt, setSelectedCourt] = React.useState(null);
      const [calendarStartDate, setCalendarStartDate] = React.useState(new Date());
      const [allBookingsForMatrix, setAllBookingsForMatrix] = React.useState([]);
      const [selectedGridSlot, setSelectedGridSlot] = React.useState(null);

      const [showDetailsModal, setShowDetailsModal] = React.useState(false);
      const [resName, setResName] = React.useState(currentUser?.full_name || '');
      const [resContact, setResContact] = React.useState('');
      const [resPayment, setResPayment] = React.useState('gcash');
      const [resGcashRef, setResGcashRef] = React.useState('');
      const [submittingBooking, setSubmittingBooking] = React.useState(false);

      const [activeModalLeague, setActiveModalLeague] = React.useState(null);
      const [regType, setRegType] = React.useState('team');
      const [teamName, setTeamName] = React.useState('');
      const [repName, setRepName] = React.useState('');
      const [repContact, setRepContact] = React.useState('');
      const [rosterList, setRosterList] = React.useState('');
      const [paymentMethod, setPaymentMethod] = React.useState('gcash');
      const [gcashRef, setGcashRef] = React.useState('');
      const [submittingLeague, setSubmittingLeague] = React.useState(false);

      const timeSlots = [
        "12:00 AM", "01:00 AM", "02:00 AM", "03:00 AM", "04:00 AM", "05:00 AM", 
        "06:00 AM", "07:00 AM", "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", 
        "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM", "05:00 PM", 
        "06:00 PM", "07:00 PM", "08:00 PM", "09:00 PM", "10:00 PM", "11:00 PM"
      ];

      const slotTo24Hr = (slotStr) => {
        if (!slotStr) return '00:00';
        const parts = slotStr.split(' ');
        const timeSub = parts[0].split(':');
        let hours = parseInt(timeSub[0], 10);
        const minutes = timeSub[1] || '00';
        const ampm = parts[1];
        if (ampm === 'PM' && hours < 12) hours += 12;
        if (ampm === 'AM' && hours === 12) hours = 0;
        return `${String(hours).padStart(2, '0')}:${minutes}`;
      };

      React.useEffect(() => {
        fetchMyBookings();
        fetchOpenLeagues();
        fetchAllBookingsMatrix();
      }, []);

      const fetchAllBookingsMatrix = async () => {
        const { data } = await supabase.from('enrollments').select('*').in('status', ['Approved', 'dean_approved', 'submitted', 'Pending']);
        setAllBookingsForMatrix(data || []);
      };

      const fetchMyBookings = async () => {
        setLoading(true);
        const { data } = await supabase.from('enrollments').select('*').eq('student_id', currentUser.id).order('submitted_at', { ascending: false });
        setBookings(data || []);
        setLoading(false);
      };

      const fetchOpenLeagues = async () => {
        const { data } = await supabase.from('enrollments').select('*').in('status', ['dean_approved', 'Approved']).like('course_program', '%LEAGUE:%');
        setOpenLeagues(data || []);
      };

      const getSevenDays = () => {
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(calendarStartDate);
          d.setDate(d.getDate() + i);
          days.push({ dateStr: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, label: `${d.toLocaleDateString('en-US', { weekday: 'short' })}, ${d.toLocaleDateString('en-US', { month: 'short' })} ${d.getDate()}` });
        }
        return days;
      };

      const getSlotStatus = (dateStr, time24) => {
        if (!selectedCourt) return 'green';
        const currentSlotMinutes = parseTimeToMinutes(time24);
        for (const b of allBookingsForMatrix) {
          if (!b.course_program.includes(selectedCourt.name) || !b.semester) continue;
          if (!b.semester.includes(dateStr)) continue;
          const isApprovedOrPending = b.status === 'Approved' || b.status === 'dean_approved' || b.status === 'Pending' || b.status === 'submitted';
          if (!isApprovedOrPending) continue;

          const sem = b.semester;
          if (sem.includes(' to ') || sem.includes(' - ')) {
            const separator = sem.includes(' to ') ? ' to ' : ' - ';
            const parts = sem.split(separator);
            const startPart = parts[0].includes(' @ ') ? parts[0].split(' @ ')[1] : parts[0];
            const endPart = parts[1];
            const startMin = parseTimeToMinutes(startPart);
            let endMin = parseTimeToMinutes(endPart);
            if (endMin <= startMin) endMin += 24 * 60;
            let checkMin = currentSlotMinutes;
            if (checkMin < startMin && endMin > 24 * 60) checkMin += 24 * 60;
            if (checkMin >= startMin && checkMin < endMin) {
              return (b.status === 'Approved' || b.status === 'dean_approved') ? 'red' : 'yellow';
            }
          } else {
            const timePart = sem.includes(' @ ') ? sem.split(' @ ')[1] : sem;
            if (parseTimeToMinutes(timePart) === currentSlotMinutes) {
              return (b.status === 'Approved' || b.status === 'dean_approved') ? 'red' : 'yellow';
            }
          }
        }
        return 'green';
      };

      const handleFinalReservationSubmit = async (e) => {
        e.preventDefault();
        if (!selectedCourt || !selectedGridSlot) return;
        if (!resName.trim() || !resContact.trim()) { showNotification('Name & contact required.', 'error'); return; }
        if (resPayment === 'gcash' && !resGcashRef.trim()) { showNotification('GCash reference no. required.', 'error'); return; }

        setSubmittingBooking(true);
        try {
          const scheduleString = `${selectedGridSlot.date} @ ${selectedGridSlot.time}`;
          const formattedBookingName = `${selectedCourt.name} | Reserver: ${resName.trim()} (Contact: ${resContact.trim()}) | Pay: ${resPayment.toUpperCase()}${resPayment === 'gcash' ? ` [Ref: ${resGcashRef.trim()}]` : ''}`;
          await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: formattedBookingName, academic_year: '2026', semester: scheduleString, status: 'Pending' });
          safeAuditLog(currentUser, 'PLAYER_BOOK_COURT', { court: selectedCourt.name, time: scheduleString });
          showNotification('Court reservation successfully submitted!', 'success');
          setShowDetailsModal(false);
          setSelectedGridSlot(null);
          setSelectedCourt(null);
          setResGcashRef('');
          fetchMyBookings();
          fetchAllBookingsMatrix();
        } catch (err) {
          showNotification('Booking error.', 'error');
        } finally {
          setSubmittingBooking(false);
        }
      };

      const handleLeagueRegistrationSubmit = async (e) => {
        e.preventDefault();
        if (regType === 'team' && !teamName.trim()) { showNotification('Team name required.', 'error'); return; }
        if (!repName.trim() || !repContact.trim()) { showNotification('Representative details required.', 'error'); return; }
        if (paymentMethod === 'gcash' && !gcashRef.trim()) { showNotification('GCash reference no. required.', 'error'); return; }

        setSubmittingLeague(true);
        try {
          const cleanTitle = activeModalLeague.course_program.replace('🏆 LEAGUE: ', '').replace(/\s*\(Fee:.*\)/i, '');
          const formattedDetails = `🏆 LEAGUE REGISTRATION (${regType.toUpperCase()}): ${cleanTitle}${regType === 'team' ? ` | Team: ${teamName.trim()}` : ''} | Rep: ${repName.trim()} (${repContact.trim()}) | Pay: ${paymentMethod.toUpperCase()}${paymentMethod === 'gcash' ? ` [Ref: ${gcashRef.trim()}]` : ''}${rosterList ? ` | Roster: ${rosterList.trim()}` : ''}`;
          await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: formattedDetails, academic_year: '2026', semester: activeModalLeague.semester || 'TBD', status: 'Pending' });
          safeAuditLog(currentUser, 'PLAYER_JOIN_LEAGUE', { league: cleanTitle });
          showNotification('League registration submitted successfully!', 'success');
          setActiveModalLeague(null);
          setTeamName(''); setRepName(''); setRepContact(''); setRosterList(''); setGcashRef('');
          fetchMyBookings();
        } catch (err) {
          showNotification('League registration error.', 'error');
        } finally {
          setSubmittingLeague(false);
        }
      };

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-6 overflow-y-auto flex-1">
          {playerNavTab === 'reservation' ? (
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4 max-w-xl mx-auto w-full my-auto">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">🏟️ Select Court for Matrix Reservation</h3>
                <button onClick={() => setActiveNavTab('home')} className="text-slate-400 font-bold text-xs">✕ Back</button>
              </div>
              {availableCourts.length === 0 ? (
                <p className="text-xs text-slate-500 py-6 text-center">No approved courts available yet.</p>
              ) : (
                <div className="space-y-3">
                  {availableCourts.map(c => (
                    <div key={c.id} onClick={() => setSelectedCourt(c)} className="p-4 bg-slate-50 border border-slate-200 hover:border-emerald-500 rounded-2xl cursor-pointer flex justify-between items-center transition-all">
                      <div>
                        <p className="font-bold text-slate-950 text-sm">{c.name}</p>
                        <p className="text-xs text-slate-500">📍 {c.location} • <span className="text-emerald-600 font-semibold">₱{c.rate}/hr</span></p>
                      </div>
                      <span className="px-3 py-1.5 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow">Open Matrix ›</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : playerNavTab === 'leagues' ? (
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4 max-w-xl mx-auto w-full my-auto">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">🏆 Open Leagues Created by Organizers</h3>
                <button onClick={() => setActiveNavTab('home')} className="text-slate-400 font-bold text-xs">✕ Back</button>
              </div>
              {openLeagues.length === 0 ? (
                <p className="text-xs text-slate-500 py-6 text-center">Wala pang nabuong liga mula sa mga organizer.</p>
              ) : (
                <div className="space-y-3">
                  {openLeagues.map(l => (
                    <div key={l.id} className="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center">
                      <div>
                        <p className="font-extrabold text-slate-900 text-xs">{l.course_program}</p>
                        <p className="text-[11px] text-emerald-600 font-mono mt-0.5">📅 {formatScheduleTo12Hour(l.semester)}</p>
                      </div>
                      <button onClick={() => setActiveModalLeague(l)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow">Join ›</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : (
            <>
              <div className="relative bg-emerald-900 rounded-3xl p-6 sm:p-8 text-white overflow-hidden shadow-xl flex flex-col justify-between">
                <div className="relative z-10 space-y-2 max-w-xl">
                  <span className="px-3 py-1 bg-emerald-800 text-emerald-300 rounded-full text-[10px] font-bold uppercase tracking-wider">Your Sports Community</span>
                  <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Let's get in the game.</h2>
                  <p className="text-xs text-emerald-200">Discover courts, book your next match, and meet your local team.</p>
                </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                  <div><p className="text-[11px] font-bold text-slate-400">My bookings</p><p className="text-xl font-extrabold text-slate-900">{bookings.length}</p></div>
                  <span className="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl">📅</span>
                </div>
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                  <div><p className="text-[11px] font-bold text-slate-400">Open leagues</p><p className="text-xl font-extrabold text-slate-900">{openLeagues.length}</p></div>
                  <span className="p-2.5 bg-amber-50 text-amber-600 rounded-xl">🏆</span>
                </div>
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                  <div><p className="text-[11px] font-bold text-slate-400">Courts listed</p><p className="text-xl font-extrabold text-slate-900">{availableCourts.length}</p></div>
                  <span className="p-2.5 bg-rose-50 text-rose-600 rounded-xl">📍</span>
                </div>
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                  <div><p className="text-[11px] font-bold text-slate-400">Leagues joined</p><p className="text-xl font-extrabold text-slate-900">0</p></div>
                  <span className="p-2.5 bg-blue-50 text-blue-600 rounded-xl">🤝</span>
                </div>
              </div>

              {playerNavTab === 'home' && (
                <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                  <h3 className="text-sm font-bold text-slate-900">📋 My Bookings</h3>
                  <div className="space-y-3">
                    {bookings.map(b => (
                      <div key={b.id} className="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center">
                        <div>
                          <p className="font-bold text-slate-950 text-xs">{b.course_program}</p>
                          <p className="text-xs text-emerald-600 font-mono mt-0.5">📅 {formatScheduleTo12Hour(b.semester)}</p>
                        </div>
                        <StatusBadge status={b.status} scheduleStr={b.semester} />
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}

          {selectedCourt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-3">
              <div className="w-full max-w-2xl bg-white border border-slate-200 rounded-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-xs font-bold text-slate-900">📅 Slot Matrix: {selectedCourt.name}</h3>
                  <button onClick={() => setSelectedCourt(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="flex justify-between items-center bg-slate-100 p-2 rounded-xl text-xs font-bold text-slate-700">
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() - 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-white rounded-lg shadow-sm">‹ Prev</button>
                  <span className="text-emerald-600">Ormoc Court Timetable</span>
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() + 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-white rounded-lg shadow-sm">Next ›</button>
                </div>
                <div className="overflow-x-auto border border-slate-200 rounded-2xl bg-slate-50 p-2">
                  <table className="w-full text-left border-collapse text-[11px]">
                    <thead>
                      <tr>
                        <th className="p-2 border-b border-slate-200 text-slate-500">Time</th>
                        {getSevenDays().map(d => <th key={d.dateStr} className="p-2 border-b border-slate-200 text-center text-slate-900 min-w-[90px]">{d.label}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {timeSlots.map(slotLabel => {
                        const time24 = slotTo24Hr(slotLabel);
                        return (
                          <tr key={slotLabel} className="border-b border-slate-100">
                            <td className="p-2 text-slate-500 font-mono text-[10px]">{slotLabel}</td>
                            {getSevenDays().map(d => {
                              const status = getSlotStatus(d.dateStr, time24);
                              const isChosen = selectedGridSlot?.date === d.dateStr && selectedGridSlot?.time === time24;
                              let bg = status === 'red' ? 'bg-red-50 text-red-600 border-red-200 opacity-80' : status === 'yellow' ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100';
                              if (isChosen) bg = 'bg-emerald-600 text-white font-extrabold ring-2 ring-emerald-400';
                              return (
                                <td key={d.dateStr} className="p-1.5 text-center">
                                  <button type="button" onClick={() => { if (status !== 'red') setSelectedGridSlot({ date: d.dateStr, time: time24, label: slotLabel }); }} className={`w-full py-2 rounded-xl border text-[10px] font-bold ${bg}`}>
                                    {status === 'red' ? 'Booked' : status === 'yellow' ? 'Pending' : 'Available'}
                                  </button>
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {selectedGridSlot && (
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-2xl flex justify-between items-center text-xs">
                    <span className="text-emerald-800 font-semibold">{selectedGridSlot.date} @ {selectedGridSlot.label}</span>
                    <button onClick={() => setShowDetailsModal(true)} className="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl shadow">Confirm Reservation ›</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {showDetailsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2"><h3 className="text-xs font-bold text-slate-900">📝 Reservation Details</h3><button onClick={() => setShowDetailsModal(false)} className="text-slate-400 font-bold">✕</button></div>
                <form onSubmit={handleFinalReservationSubmit} className="space-y-3 text-xs">
                  <div><label className="text-slate-600 font-bold block mb-1">Your Name</label><input type="text" value={resName} onChange={e => setResName(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                  <div><label className="text-slate-600 font-bold block mb-1">Contact Number</label><input type="text" value={resContact} onChange={e => setResContact(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-mono" /></div>
                  <div><label className="text-slate-600 font-bold block mb-1">Payment Method</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl font-bold"><button type="button" onClick={() => setResPayment('gcash')} className={`py-1.5 rounded-lg ${resPayment === 'gcash' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>GCash</button><button type="button" onClick={() => setResPayment('cash')} className={`py-1.5 rounded-lg ${resPayment === 'cash' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>Cash</button></div></div>
                  {resPayment === 'gcash' && <div><input type="text" value={resGcashRef} onChange={e => setResGcashRef(e.target.value)} placeholder="GCash Ref No." className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-mono text-xs" /></div>}
                  <button type="submit" disabled={submittingBooking} className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Complete Reservation</button>
                </form>
              </div>
            </div>
          )}

          {activeModalLeague && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-5 space-y-3.5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2"><h3 className="text-xs font-bold text-slate-900">🏆 Register for League</h3><button onClick={() => setActiveModalLeague(null)} className="text-slate-400 font-bold">✕</button></div>
                <form onSubmit={handleLeagueRegistrationSubmit} className="space-y-3 text-xs">
                  <div><label className="text-slate-600 font-bold mb-1 block">Mode</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl font-bold"><button type="button" onClick={() => setRegType('team')} className={`py-1.5 rounded-lg ${regType === 'team' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>Team</button><button type="button" onClick={() => setRegType('solo')} className={`py-1.5 rounded-lg ${regType === 'solo' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>Solo</button></div></div>
                  {regType === 'team' && (
                    <div className="space-y-2">
                      <div><label className="text-slate-600 font-bold">Team Name</label><input type="text" value={teamName} onChange={e => setTeamName(e.target.value)} placeholder="Ormoc Ballers" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                      <div><label className="text-slate-600 font-bold">Team Roster</label><textarea value={rosterList} onChange={e => setRosterList(e.target.value)} placeholder="Player 1, Player 2..." rows={2} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                    </div>
                  )}
                  <div><label className="text-slate-600 font-bold">Representative Name</label><input type="text" value={repName} onChange={e => setRepName(e.target.value)} placeholder="Name" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" /></div>
                  <div><label className="text-slate-600 font-bold">Contact Number</label><input type="text" value={repContact} onChange={e => setRepContact(e.target.value)} placeholder="09123456789" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-mono" /></div>
                  <div><label className="text-slate-600 font-bold mb-1 block">Payment Method</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl font-bold"><button type="button" onClick={() => setPaymentMethod('gcash')} className={`py-1.5 rounded-lg ${paymentMethod === 'gcash' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>GCash</button><button type="button" onClick={() => setPaymentMethod('cash')} className={`py-1.5 rounded-lg ${paymentMethod === 'cash' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>Cash</button></div></div>
                  {paymentMethod === 'gcash' && <div><input type="text" value={gcashRef} onChange={e => setGcashRef(e.target.value)} placeholder="GCash Ref No." className="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-mono text-xs" /></div>}
                  <button type="submit" disabled={submittingLeague} className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow">Confirm League Registration</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. COURT ORGANIZER DASHBOARD
    // =========================================================================
    function OrganizerDashboard({ currentUser, showNotification, availableCourts, refreshCourts, activeNavTab, setActiveNavTab }) {
      const [ligaTitle, setLigaTitle] = React.useState('');
      const [selectedSport, setSelectedSport] = React.useState('Basketball');
      const [organizerApprovedCourts, setOrganizerApprovedCourts] = React.useState([]);
      const [selectedCourt, setSelectedCourt] = React.useState('');
      const [ligaFee, setLigaFee] = React.useState('500');
      const [reserveDate, setReserveDate] = React.useState(new Date().toISOString().split('T')[0]);

      const [selectedOrganizerCourt, setSelectedOrganizerCourt] = React.useState(null);
      const [calendarStartDate, setCalendarStartDate] = React.useState(new Date());
      const [allBookingsForMatrix, setAllBookingsForMatrix] = React.useState([]);
      const [selectedGridSlot, setSelectedGridSlot] = React.useState(null);

      const [showOrganizerDetailsModal, setShowOrganizerDetailsModal] = React.useState(false);
      const [orgResName, setOrgResName] = React.useState(currentUser?.full_name || '');
      const [orgResContact, setOrgResContact] = React.useState('');
      const [orgResPayment, setOrgResPayment] = React.useState('gcash');
      const [orgResGcashRef, setOrgResGcashRef] = React.useState('');
      const [submittingOrganizerBooking, setSubmittingOrganizerBooking] = React.useState(false);

      const [myProposals, setMyProposals] = React.useState([]);

      const timeSlots = [
        "12:00 AM", "01:00 AM", "02:00 AM", "03:00 AM", "04:00 AM", "05:00 AM", 
        "06:00 AM", "07:00 AM", "08:00 AM", "09:00 AM", "10:00 AM", "11:00 AM", 
        "12:00 PM", "01:00 PM", "02:00 PM", "03:00 PM", "04:00 PM", "05:00 PM", 
        "06:00 PM", "07:00 PM", "08:00 PM", "09:00 PM", "10:00 PM", "11:00 PM"
      ];

      const slotTo24Hr = (slotStr) => {
        if (!slotStr) return '00:00';
        const parts = slotStr.split(' ');
        const timeSub = parts[0].split(':');
        let hours = parseInt(timeSub[0], 10);
        const minutes = timeSub[1] || '00';
        const ampm = parts[1];
        if (ampm === 'PM' && hours < 12) hours += 12;
        if (ampm === 'AM' && hours === 12) hours = 0;
        return `${String(hours).padStart(2, '0')}:${minutes}`;
      };

      React.useEffect(() => {
        fetchOrganizerData();
        fetchAllBookingsMatrix();
      }, []);

      const fetchAllBookingsMatrix = async () => {
        const { data } = await supabase.from('enrollments').select('*').in('status', ['Approved', 'dean_approved', 'submitted', 'Pending']);
        setAllBookingsForMatrix(data || []);
      };

      const fetchOrganizerData = async () => {
        const { data: props } = await supabase.from('enrollments').select('*').eq('student_id', currentUser.id).order('submitted_at', { ascending: false });
        setMyProposals(props || []);
        const approvedOrgCourts = (props || []).filter(item => {
          const isApproved = item.status === 'Approved' || item.status === 'dean_approved';
          const isCourtRequest = availableCourts.some(c => item.course_program.startsWith(c.name));
          return isApproved && isCourtRequest;
        }).map(item => {
          const matchCourt = availableCourts.find(c => item.course_program.startsWith(c.name));
          return matchCourt ? matchCourt.name : item.course_program.split(' | ')[0];
        });
        const uniqueApprovedCourts = [...new Set(approvedOrgCourts)];
        setOrganizerApprovedCourts(uniqueApprovedCourts);
        if (uniqueApprovedCourts.length > 0 && !selectedCourt) setSelectedCourt(uniqueApprovedCourts[0]);
      };

      const handleCreateLiga = async (e) => {
        e.preventDefault();
        if (!ligaTitle.trim()) { showNotification('League title required.', 'error'); return; }
        if (!selectedCourt) { showNotification('Please select an approved court first.', 'error'); return; }
        const fullLigaName = `🏆 LEAGUE: [${selectedSport}] ${ligaTitle.trim()} @ ${selectedCourt} (Fee: ₱${ligaFee})`;
        const { error } = await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: fullLigaName, academic_year: '2026', semester: `Date: ${reserveDate}`, status: 'Approved' });
        if (error) showNotification(`Error: ${error.message}`, 'error');
        else {
          safeAuditLog(currentUser, 'ORGANIZER_CREATE_LEAGUE', { league: ligaTitle.trim() });
          showNotification('League published successfully!', 'success');
          setLigaTitle(''); fetchOrganizerData(); setActiveNavTab('approvals');
        }
      };

      const getSevenDays = () => {
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(calendarStartDate);
          d.setDate(d.getDate() + i);
          days.push({ dateStr: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, label: `${d.toLocaleDateString('en-US', { weekday: 'short' })}, ${d.toLocaleDateString('en-US', { month: 'short' })} ${d.getDate()}` });
        }
        return days;
      };

      const getSlotStatus = (courtName, dateStr, time24) => {
        const currentSlotMinutes = parseTimeToMinutes(time24);
        for (const b of allBookingsForMatrix) {
          if (!b.course_program.includes(courtName) || !b.semester) continue;
          if (!b.semester.includes(dateStr)) continue;
          const isApprovedOrPending = b.status === 'Approved' || b.status === 'dean_approved' || b.status === 'Pending' || b.status === 'submitted';
          if (!isApprovedOrPending) continue;

          const sem = b.semester;
          if (sem.includes(' to ') || sem.includes(' - ')) {
            const separator = sem.includes(' to ') ? ' to ' : ' - ';
            const parts = sem.split(separator);
            const startPart = parts[0].includes(' @ ') ? parts[0].split(' @ ')[1] : parts[0];
            const endPart = parts[1];
            const startMin = parseTimeToMinutes(startPart);
            let endMin = parseTimeToMinutes(endPart);
            if (endMin <= startMin) endMin += 24 * 60;
            let checkMin = currentSlotMinutes;
            if (checkMin < startMin && endMin > 24 * 60) checkMin += 24 * 60;
            if (checkMin >= startMin && checkMin < endMin) {
              return (b.status === 'Approved' || b.status === 'dean_approved') ? 'red' : 'yellow';
            }
          } else {
            const timePart = sem.includes(' @ ') ? sem.split(' @ ')[1] : sem;
            if (parseTimeToMinutes(timePart) === currentSlotMinutes) {
              return (b.status === 'Approved' || b.status === 'dean_approved') ? 'red' : 'yellow';
            }
          }
        }
        return 'green';
      };

      const handleOrganizerFinalReservationSubmit = async (e) => {
        e.preventDefault();
        if (!selectedOrganizerCourt || !selectedGridSlot) return;
        if (!orgResName.trim() || !orgResContact.trim()) { showNotification('Name & contact required.', 'error'); return; }
        if (orgResPayment === 'gcash' && !orgResGcashRef.trim()) { showNotification('GCash reference no. required.', 'error'); return; }

        setSubmittingOrganizerBooking(true);
        try {
          const scheduleString = `${selectedGridSlot.date} @ ${selectedGridSlot.time}`;
          const formattedName = `${selectedOrganizerCourt.name} | Organizer: ${orgResName.trim()} (Contact: ${orgResContact.trim()}) | Pay: ${orgResPayment.toUpperCase()}${orgResPayment === 'gcash' ? ` [Ref: ${orgResGcashRef.trim()}]` : ''}`;
          await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: formattedName, academic_year: '2026', semester: scheduleString, status: 'Pending' });
          safeAuditLog(currentUser, 'ORGANIZER_REQUEST_COURT', { court: selectedOrganizerCourt.name, time: scheduleString });
          showNotification('Court reservation request sent to Admin successfully!', 'success');
          setShowOrganizerDetailsModal(false);
          setSelectedGridSlot(null);
          setSelectedOrganizerCourt(null);
          setOrgResGcashRef('');
          fetchOrganizerData();
          fetchAllBookingsMatrix();
        } catch (err) {
          showNotification('Error requesting court reservation.', 'error');
        } finally {
          setSubmittingOrganizerBooking(false);
        }
      };

      const leaguesList = myProposals.filter(p => p.course_program?.includes('LEAGUE:'));

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-6 overflow-y-auto flex-1">
          {activeNavTab === 'create_league' ? (
            <div className="max-w-xl mx-auto bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-sm my-auto">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">🏆 Create & Publish League</h3>
                <button onClick={() => setActiveNavTab('approvals')} className="text-slate-400 font-bold text-xs">✕ Back</button>
              </div>
              <form onSubmit={handleCreateLiga} className="space-y-4 text-xs">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">League Name</label>
                  <input type="text" value={ligaTitle} onChange={e => setLigaTitle(e.target.value)} placeholder="Ormoc Basketball Cup" className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Sport</label>
                    <select value={selectedSport} onChange={e => setSelectedSport(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900">
                      <option value="Basketball">Basketball</option>
                      <option value="Volleyball">Volleyball</option>
                      <option value="Badminton">Badminton</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Approved Court</label>
                    <select value={selectedCourt} onChange={e => setSelectedCourt(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900">
                      {organizerApprovedCourts.length === 0 ? <option value="">No approved courts yet</option> : organizerApprovedCourts.map((cName, idx) => <option key={idx} value={cName}>{cName}</option>)}
                    </select>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Registration Fee (₱)</label>
                    <input type="number" value={ligaFee} onChange={e => setLigaFee(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Tournament Date</label>
                    <input type="date" value={reserveDate} onChange={e => setReserveDate(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900" />
                  </div>
                </div>
                <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow">Publish League</button>
              </form>
            </div>
          ) : activeNavTab === 'request_court' ? (
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4 max-w-xl mx-auto w-full my-auto">
              <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">🏟️ Request a Court Reservation (Slot Matrix)</h3>
                <button onClick={() => setActiveNavTab('approvals')} className="text-slate-400 font-bold text-xs">✕ Back</button>
              </div>
              {availableCourts.length === 0 ? <p className="text-xs text-slate-500 py-6 text-center">No approved courts available yet.</p> : (
                <div className="space-y-3">
                  {availableCourts.map(c => (
                    <div key={c.id} onClick={() => setSelectedOrganizerCourt(c)} className="p-4 bg-slate-50 border border-slate-200 hover:border-emerald-500 rounded-2xl cursor-pointer flex justify-between items-center transition-all">
                      <div>
                        <p className="font-bold text-slate-950 text-sm">{c.name}</p>
                        <p className="text-xs text-slate-500">📍 {c.location} • <span className="text-emerald-600 font-semibold">₱{c.rate}/hr</span></p>

                      <span className="text-xs font-bold text-emerald-600">Open Matrix ›</span>

          ) : (
            <>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1 relative">
                  <div className="flex justify-between items-start">
                    <p className="text-[11px] font-bold text-slate-400">Court listings</p>
