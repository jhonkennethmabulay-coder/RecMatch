                  <div className="w-full h-36 rounded-xl overflow-hidden border border-slate-800">
                    <img src={courtImagePreview} alt="Preview" className="w-full h-full object-cover" />
                  </div>
                )}
                <button type="submit" disabled={addingCourt} className="w-full py-3 bg-brand-500 text-slate-950 font-bold rounded-xl shadow-lg">Add Court Facility</button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7.5 USER PROFILE VIEW
    // =========================================================================
    function UserProfileView({ currentUser, showNotification }) {
      const [fullName, setFullName] = React.useState(currentUser?.full_name || '');
      const [updating, setUpdating] = React.useState(false);

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        if (!fullName.trim()) return;

        setUpdating(true);
        try {
          await supabase.from('profiles').upsert({ id: currentUser.id, full_name: fullName.trim(), email: currentUser.email, role: currentUser.role }, { onConflict: 'id' });
          currentUser.full_name = fullName.trim();
          showNotification('Profile updated successfully!', 'success');
        } catch (err) {
          showNotification('Profile update error.', 'error');
        } finally {
          setUpdating(false);
        }
      };

      return (
        <div className="p-4 sm:p-6 max-w-md mx-auto w-full space-y-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-2xl">
            <div className="flex items-center gap-3.5 border-b border-slate-800 pb-4">
              <div className="w-12 h-12 rounded-2xl bg-brand-500/10 border border-brand-500/25 flex items-center justify-center p-1.5"><MapPinLogo className="w-9 h-9" /></div>
              <div><h3 className="text-sm font-bold text-white">{currentUser?.full_name}</h3><p className="text-xs text-brand-400 capitalize font-mono">{currentUser?.role}</p></div>
            </div>
            <form onSubmit={handleUpdateProfile} className="space-y-4 text-xs">
              <div><label className="text-slate-400 mb-1 block">Email</label><input type="text" disabled value={currentUser?.email || ''} className="w-full px-3.5 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-400 font-mono" /></div>
              <div><label className="text-slate-400 mb-1 block">Full Name</label><input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white" /></div>
              <button type="submit" disabled={updating} className="w-full py-3 bg-brand-500 text-slate-950 font-bold rounded-xl">Save Profile</button>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. MAIN APP SHELL & NAVIGATION
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = React.useState(null);
      const [activeNavTab, setActiveNavTab] = React.useState('dashboard');
      const [notification, setNotification] = React.useState({ message: '', type: 'info' });
      const [showLogoutModal, setShowLogoutModal] = React.useState(false);
      const [availableCourts, setAvailableCourts] = React.useState([]);
      const [isDesktopView, setIsDesktopView] = React.useState(window.innerWidth >= 768);

      React.useEffect(() => {
        const handleResize = () => setIsDesktopView(window.innerWidth >= 768);
        window.addEventListener('resize', handleResize);
        fetchAdminCreatedCourts();
        return () => window.removeEventListener('resize', handleResize);
      }, [currentUser]);

      const fetchAdminCreatedCourts = async () => {
        const { data: allAdminCourts } = await supabase.from('enrollments').select('*').like('course_program', '%NEW COURT PROPOSAL%').in('status', ['Approved', 'dean_approved']);
        const filteredCourts = [];
        if (allAdminCourts) {
          allAdminCourts.forEach((item) => {
            let pureName = item.course_program.replace('🏟️ NEW COURT PROPOSAL: ', '').split(' (₱')[0].trim();
            const rateMatch = item.course_program.match(/₱(\d+)\/hr/);
            const rateVal = rateMatch ? parseInt(rateMatch[1], 10) : 150;
            const locMatch = item.course_program.match(/@\s*(.*)$/);
            const locVal = locMatch ? locMatch[1].trim() : 'Ormoc City';
            const imgData = item.academic_year && item.academic_year.startsWith('data:image') ? item.academic_year : null;

            filteredCourts.push({ id: `approved_court_${item.id}`, name: pureName, sport: 'Basketball', rate: rateVal, location: locVal, image: imgData });
          });
        }
        setAvailableCourts(filteredCourts);
      };

      const showNotification = (message, type = 'info') => setNotification({ message, type });
      const clearNotification = () => setNotification({ message: '', type: 'info' });

      const handleConfirmLogout = async () => {
        await supabase.auth.signOut();
        setCurrentUser(null);
        setShowLogoutModal(false);
        showNotification('Signed out of RecMatch.', 'info');
      };

      const isPlayer = currentUser?.role === 'Player / User' || currentUser?.role === 'student' || !currentUser?.role;
      const isOrganizer = currentUser?.role === 'Organizer' || currentUser?.role === 'dean';
      const isAdmin = currentUser?.role === 'Admin' || currentUser?.role === 'admin';

      const containerClasses = isDesktopView 
        ? "w-full h-full flex flex-col justify-between overflow-hidden bg-slate-950" 
        : "w-full h-full flex flex-col justify-between overflow-hidden bg-slate-950 max-w-md mx-auto shadow-2xl border border-slate-900 rounded-none sm:rounded-[40px]";

      return (
        <div className={containerClasses}>
          <ConfirmModal isOpen={showLogoutModal} title="Confirm Logout" message="Are you sure you want to log out?" confirmText="Logout" confirmStyle="danger" onConfirm={handleConfirmLogout} onCancel={() => setShowLogoutModal(false)} />
          <SystemBanner notification={notification} onClose={clearNotification} />

          {!currentUser ? (
            <div className="flex-1 flex flex-col justify-between overflow-y-auto">
              <AuthModule onAuthSuccess={(user) => {
                setCurrentUser(user);
                fetchAdminCreatedCourts();
                setActiveNavTab(user.role === 'Organizer' ? 'approvals' : user.role === 'Admin' ? 'dashboard' : 'home');
              }} showNotification={showNotification} />
              <footer className="py-3 text-center text-[10px] text-slate-600 font-mono">RecMatch Ormoc &copy; 2026</footer>
            </div>
          ) : (
            <div className="flex flex-col h-full justify-between">
              <header className="px-5 py-3.5 bg-slate-900 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3 shrink-0 shadow-md">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center p-1 shadow-sm shrink-0"><MapPinLogo className="w-7 h-7" /></div>
                  <div>
                    <h2 className="text-xs sm:text-sm font-bold text-white leading-tight">{currentUser.full_name}</h2>
                    <p className="text-[10px] sm:text-xs text-slate-400 capitalize">Role: <span className="text-brand-400 font-semibold">{currentUser.role}</span></p>
                  </div>
                </div>

                <div className="flex items-center gap-2 flex-wrap">
                  {isOrganizer && !isDesktopView && (
                    <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-xl border border-slate-800 text-[10px] font-bold">
                      <button onClick={() => setActiveNavTab('approvals')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'approvals' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Approvals</button>
                      <button onClick={() => setActiveNavTab('create_league')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'create_league' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Create League</button>
                      <button onClick={() => setActiveNavTab('request_court')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'request_court' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Request Court</button>
                    </div>
                  )}

                  {isAdmin && !isDesktopView && (
                    <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-xl border border-slate-800 text-[10px] font-bold">
                      <button onClick={() => setActiveNavTab('dashboard')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'dashboard' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Dashboard</button>
                      <button onClick={() => setActiveNavTab('courts')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'courts' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Courts</button>
                      <button onClick={() => setActiveNavTab('add_court')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'add_court' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Add Court</button>
                      <button onClick={() => setActiveNavTab('logs')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'logs' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Logs</button>
                    </div>
                  )}

                  <button type="button" onClick={() => setShowLogoutModal(true)} className="px-3.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl text-xs font-bold transition-all">Logout</button>
                </div>
              </header>

              <main className={`flex-1 min-h-0 ${isAdmin || isOrganizer ? 'flex overflow-hidden' : 'flex flex-col overflow-y-auto p-2 sm:p-4'}`}>
                {(isAdmin || isOrganizer) && isDesktopView && (
                  <aside className="flex w-64 shrink-0 flex-col border-r border-slate-800 bg-slate-900/70 p-5">
                    <div className="mb-8 flex items-center gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-2xl border border-brand-500/20 bg-brand-500/10"><MapPinLogo className="h-8 w-8" /></div>
                      <div>
                        <p className="text-sm font-extrabold tracking-wide text-white">RecMatch</p>
                        <p className="text-[10px] text-slate-500">Ormoc City workspace</p>
                      </div>
                    </div>

                    <p className="mb-3 px-3 text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500">
                      {isAdmin ? 'Administration' : 'Organizer workspace'}
                    </p>
                    <nav className="space-y-1">
                      {(isAdmin ? [
                        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                        { id: 'courts', label: 'Courts', icon: '🏟️' },
                        { id: 'add_court', label: 'Add Court', icon: '➕' },
                        { id: 'logs', label: 'Audit Logs', icon: '🛡️' },
                        { id: 'profile', label: 'Profile', icon: '👤' }
                      ] : [
                        { id: 'approvals', label: 'Approvals', icon: '✅' },
                        { id: 'create_league', label: 'Create League', icon: '🏆' },
                        { id: 'request_court', label: 'Request Court', icon: '🏟️' },
                        { id: 'profile', label: 'Profile', icon: '👤' }
                      ]).map((item) => (
                        <button key={item.id} type="button" onClick={() => setActiveNavTab(item.id)} className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-xs font-semibold transition-colors ${activeNavTab === item.id ? 'bg-brand-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <span>{item.icon}</span><span>{item.label}</span>
                        </button>
                      ))}
                    </nav>
                  </aside>
                )}

                {(isAdmin || isOrganizer) ? (
                  <div className="flex-1 min-w-0 overflow-y-auto p-4 sm:p-6 lg:p-8">
                    {activeNavTab === 'profile' ? <UserProfileView currentUser={currentUser} showNotification={showNotification} /> :
                     isAdmin ? <AdminDashboard currentUser={currentUser} showNotification={showNotification} refreshCourts={fetchAdminCreatedCourts} activeSubTab={activeNavTab} setActiveSubTab={setActiveNavTab} availableCourts={availableCourts} /> :
                     <OrganizerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} refreshCourts={fetchAdminCreatedCourts} activeNavTab={activeNavTab} />}
                  </div>
                ) : activeNavTab === 'profile' ? <UserProfileView currentUser={currentUser} showNotification={showNotification} /> :
                  <PlayerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} playerNavTab={activeNavTab} />}
              </main>

              {isPlayer && !isDesktopView && (
                <nav className="px-4 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-around text-[10px] shrink-0">
                  <button onClick={() => setActiveNavTab('home')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'home' ? 'text-brand-400 font-bold' : 'text-slate-400'}`}><span>🏠</span><span>Home</span></button>
                  <button onClick={() => setActiveNavTab('reservation')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'reservation' ? 'text-brand-400 font-bold' : 'text-slate-400'}`}><span>📅</span><span>Reservation</span></button>
                  <button onClick={() => setActiveNavTab('leagues')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'leagues' ? 'text-brand-400 font-bold' : 'text-slate-400'}`}><span>🏆</span><span>Leagues</span></button>
                  <button onClick={() => setActiveNavTab('profile')} className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-brand-400 font-bold' : 'text-slate-400'}`}><span>👤</span><span>Profile</span></button>
                </nav>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
