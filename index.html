<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RecMatch — Ormoc City Sports Court Reservations</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-full text-slate-100 antialiased font-sans bg-slate-950 selection:bg-brand-500 selection:text-slate-950 flex items-center justify-center p-0 sm:p-4">

  <div id="root" class="w-full h-full sm:max-w-md sm:h-[844px] bg-slate-950 sm:border sm:border-slate-800 sm:rounded-[40px] sm:shadow-2xl flex flex-col overflow-hidden relative"></div>

  <script type="text/babel">
    // =========================================================================
    // 1. SUPABASE CLIENT & GLOBAL CONSTANTS
    // =========================================================================
    const SUPABASE_URL = "https://wzqwlfexvrijxdvyxhvc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cXdsZmV4dnJpanhkdnl4aHZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDkzODIsImV4cCI6MjEwNzE4NTM4Mn0.MZE4x4YvSGvda8v15AZhX0JtrUg3C9m5LDPhm3nrM7U";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // IAS Strict Password Policy
    const IAS_PASSWORD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    // Helper: Format 24-hour time string (e.g. "2026-10-20 @ 17:00") into AM/PM (e.g. "2026-10-20 @ 05:00 PM")
    const formatScheduleTo12Hour = (scheduleStr) => {
      if (!scheduleStr) return '';
      if (!scheduleStr.includes(' @ ')) return scheduleStr;

      const parts = scheduleStr.split(' @ ');
      const datePart = parts[0].replace('Date: ', '').trim();
      const timePart = parts[1].trim();

      const timeSubParts = timePart.split(':');
      if (timeSubParts.length < 2) return scheduleStr;

      let hours = parseInt(timeSubParts[0], 10);
      const minutes = timeSubParts[1];
      if (isNaN(hours)) return scheduleStr;

      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; // the hour '0' should be '12'
      const formattedHours = hours < 10 ? '0' + hours : hours;

      const cleanDatePart = datePart.replace('Date: ', '').trim();
      return `${cleanDatePart} @ ${formattedHours}:${minutes} ${ampm}`;
    };

    // Helper: Check if a schedule string is in the past
    const isSchedulePast = (scheduleStr) => {
      if (!scheduleStr) return false;
      const parts = scheduleStr.split(' @ ');
      if (parts.length < 2) return false;
      const datePart = parts[0].replace('Date: ', '').trim();
      const timePart = parts[1].trim();
      const scheduleDate = new Date(`${datePart}T${timePart}`);
      return isNaN(scheduleDate.getTime()) ? false : scheduleDate < new Date();
    };

    // Map Location Pin SVG Logo
    function MapPinLogo({ className = "w-8 h-8" }) {
      return (
        <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 5C27.9086 5 10 22.9086 10 45C10 68 50 95 50 95C50 95 90 68 90 45C90 22.9086 72.0914 5 50 5Z" fill="#F8FAFC" />
          <circle cx="50" cy="42" r="22" fill="#0D9488" />
          <path d="M28 42H72" stroke="#F8FAFC" strokeWidth="2.5" />
          <path d="M50 20V64" stroke="#F8FAFC" strokeWidth="2.5" />
          <path d="M33 30C38 35 38 49 33 54" stroke="#F8FAFC" strokeWidth="2.5" fill="none" />
          <path d="M67 30C62 35 62 49 67 54" stroke="#F8FAFC" strokeWidth="2.5" fill="none" />
        </svg>
      );
    }

    // Safe Audit Logging
    const safeAuditLog = async (currentUser, action, details = {}) => {
      try {
        if (!currentUser) return;
        await supabase.from('audit_logs').insert({
          user_id: currentUser.id,
          user_email: currentUser.email,
          user_role: currentUser.role,
          action: action,
          details: details
        });
      } catch (e) {}
    };

    // =========================================================================
    // 2. REUSABLE UI COMPONENTS
    // =========================================================================

    function SystemBanner({ notification, onClose }) {
      if (!notification || !notification.message) return null;
      const isError = notification.type === 'error';
      const isSuccess = notification.type === 'success';

      return (
        <div className={`mx-4 my-2 p-3.5 rounded-2xl border flex items-start justify-between gap-3 text-xs font-medium shadow-xl transition-all duration-300 ${
          isError ? 'bg-red-950/90 border-red-500/50 text-red-200' :
          isSuccess ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' :
          'bg-slate-900/90 border-slate-700 text-slate-200'
        }`}>
          <div className="flex items-center gap-2.5">
            <span className="text-base">{isError ? '⚠️' : isSuccess ? '✅' : '🔑'}</span>
            <div className="space-y-0.5">
              <p className="font-bold uppercase tracking-wider text-[9px] opacity-80">
                {isError ? 'System Alert' : isSuccess ? 'Success' : 'Notice'}
              </p>
              <p className="text-xs leading-tight">{notification.message}</p>
            </div>
          </div>
          {onClose && (
            <button 
              onClick={onClose} 
              className="text-slate-400 hover:text-white font-bold p-1 rounded-lg hover:bg-slate-800 transition-colors"
              type="button"
            >
              ✕
            </button>
          )}
        </div>
      );
    }

    function ConfirmModal({ isOpen, title, message, confirmText, confirmStyle, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in">
          <div className="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl text-center space-y-4">
            <div className="w-12 h-12 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center mx-auto text-red-400 font-bold text-xl">
              🚨
            </div>
            <div className="space-y-1">
              <h3 className="text-base font-bold text-white">{title || 'Confirm Action'}</h3>
              <p className="text-xs text-slate-400 leading-relaxed">{message}</p>
            </div>
            
            <div className="grid grid-cols-2 gap-2.5 pt-2">
              <button
                onClick={onCancel}
                className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition-all"
              >
                Cancel
              </button>
              <button
                onClick={onConfirm}
                className={`py-2.5 px-3 rounded-xl text-xs font-semibold transition-all shadow-lg ${
                  confirmStyle === 'danger' 
                    ? 'bg-red-500 hover:bg-red-400 text-slate-950 shadow-red-500/20' 
                    : 'bg-brand-500 hover:bg-brand-400 text-slate-950 shadow-brand-500/20'
                }`}
              >
                {confirmText || 'Confirm'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LoadingSpinner({ label }) {
      return (
        <div className="flex flex-col items-center justify-center py-10 space-y-2">
          <div className="w-7 h-7 border-3 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
          {label && <p className="text-xs text-slate-400 font-medium">{label}</p>}
        </div>
      );
    }

    function StatusBadge({ status, scheduleStr }) {
      const isPast = isSchedulePast(scheduleStr);
      
      let styles = 'bg-slate-800 text-slate-400 border-slate-700';
      let label = status;

      if (isPast && (status === 'Approved' || status === 'dean_approved')) {
        styles = 'bg-slate-800/80 text-slate-400 border-slate-700';
        label = 'Expired (Free)';
      } else if (status === 'submitted' || status === 'Pending') {
        styles = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        label = 'Pending Approval';
      } else if (status === 'dean_approved' || status === 'Approved') {
        styles = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        label = 'Approved / Occupied';
      } else if (status === 'rejected' || status === 'Declined') {
        styles = 'bg-red-500/10 text-red-400 border-red-500/20';
        label = 'Declined';
      }

      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-bold border ${styles}`}>
          {label}
        </span>
      );
    }

    // =========================================================================
    // 3. AUTHENTICATION MODULE
    // =========================================================================
    function AuthModule({ onAuthSuccess, showNotification }) {
      const [activeTab, setActiveTab] = React.useState('login');
      
      const [loginEmail, setLoginEmail] = React.useState('');
      const [loginPassword, setLoginPassword] = React.useState('');
      const [showLoginPassword, setShowLoginPassword] = React.useState(false);
      const [loginLoading, setLoginLoading] = React.useState(false);

      const [regFullName, setRegFullName] = React.useState('');
      const [regEmail, setRegEmail] = React.useState('');
      const [regRole, setRegRole] = React.useState('Player / User');
      const [regPassword, setRegPassword] = React.useState('');
      const [regConfirmPassword, setRegConfirmPassword] = React.useState('');
      const [showRegPassword, setShowRegPassword] = React.useState(false);
      const [showRegConfirmPassword, setShowRegConfirmPassword] = React.useState(false);
      const [regLoading, setRegLoading] = React.useState(false);

      const [otpEmail, setOtpEmail] = React.useState('');
      const [otpCode, setOtpCode] = React.useState('');
      const [newPassword, setNewPassword] = React.useState('');
      const [confirmNewPassword, setConfirmNewPassword] = React.useState('');
      const [generatedCode, setGeneratedCode] = React.useState(null);
      const [otpSent, setOtpSent] = React.useState(false);
      const [forgotLoading, setForgotLoading] = React.useState(false);

      const validations = {
        length: regPassword.length >= 8,
        uppercase: /[A-Z]/.test(regPassword),
        lowercase: /[a-z]/.test(regPassword),
        number: /\d/.test(regPassword),
        special: /[@$!%*?&]/.test(regPassword),
        match: regPassword.length > 0 && regPassword === regConfirmPassword,
      };

      const resetPasswordValidations = {
        length: newPassword.length >= 8,
        uppercase: /[A-Z]/.test(newPassword),
        lowercase: /[a-z]/.test(newPassword),
        number: /\d/.test(newPassword),
        special: /[@$!%*?&]/.test(newPassword),
        match: newPassword.length > 0 && newPassword === confirmNewPassword,
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();

        if (!loginEmail.trim() || !loginPassword) {
          showNotification('Empty email or password field.', 'error');
          return;
        }

        setLoginLoading(true);

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: loginEmail,
            password: loginPassword,
          });

          if (error) {
            showNotification('Incorrect email or password.', 'error');
            setLoginLoading(false);
            return;
          }

          let { data: profile } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', data.user.id)
            .maybeSingle();

          if (!profile) {
            const rawRole = data.user.user_metadata?.role || (loginEmail.includes('admin') ? 'Admin' : 'Player / User');
            const userRole = rawRole === 'student' ? 'Player / User' : rawRole === 'dean' ? 'Organizer' : rawRole === 'admin' ? 'Admin' : rawRole;
            const userName = data.user.user_metadata?.full_name || loginEmail.split('@')[0];

            const { data: newProfile } = await supabase
              .from('profiles')
              .upsert({
                id: data.user.id,
                full_name: userName,
                email: loginEmail,
                role: userRole,
              }, { onConflict: 'id' })
              .select()
              .single();

            profile = newProfile || {
              id: data.user.id,
              full_name: userName,
              email: loginEmail,
              role: userRole,
            };
          } else {
            if (profile.role === 'student') profile.role = 'Player / User';
            if (profile.role === 'dean') profile.role = 'Organizer';
            if (profile.role === 'admin') profile.role = 'Admin';
          }

          showNotification(`Welcome back, ${profile.full_name}!`, 'success');
          onAuthSuccess(profile);
        } catch (err) {
          showNotification('Authentication server error. Please try again.', 'error');
        } finally {
          setLoginLoading(false);
        }
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();

        if (!regFullName.trim() || !regEmail.trim()) {
          showNotification('All fields are required.', 'error');
          return;
        }

        if (!IAS_PASSWORD_REGEX.test(regPassword)) {
          showNotification('Password does not meet IAS security requirements.', 'error');
          return;
        }

        if (regPassword !== regConfirmPassword) {
          showNotification('Confirm password does not match.', 'error');
          return;
        }

        setRegLoading(true);

        try {
          const { data, error } = await supabase.auth.signUp({
            email: regEmail,
            password: regPassword,
            options: {
              data: {
                full_name: regFullName,
                role: regRole,
              }
            }
          });

          if (error) {
            showNotification(error.message, 'error');
            setRegLoading(false);
            return;
          }

          if (data?.user) {
            await supabase.from('profiles').upsert({
              id: data.user.id,
              full_name: regFullName,
              email: regEmail,
              role: regRole,
            }, { onConflict: 'id' });
          }

          showNotification('Account created successfully! Please sign in.', 'success');
          setActiveTab('login');
          setLoginEmail(regEmail);
        } catch (err) {
          showNotification('Registration error. Please try again.', 'error');
        } finally {
          setRegLoading(false);
        }
      };

      const handleSendResetOTP = async (e) => {
        e.preventDefault();
        if (!otpEmail.trim()) {
          showNotification('Please enter your account email.', 'error');
          return;
        }

        setForgotLoading(true);
        try {
          let { data: profile } = await supabase
            .from('profiles')
            .select('*')
            .eq('email', otpEmail.trim())
            .maybeSingle();

          if (!profile) {
            showNotification(`No account registered with ${otpEmail}.`, 'error');
            setForgotLoading(false);
            return;
          }

          const newOtp = Math.floor(100000 + Math.random() * 900000).toString();

          const { error: updateError } = await supabase
            .from('profiles')
            .update({ otp_code: newOtp })
            .eq('id', profile.id);

          if (updateError) {
            showNotification(`Database error: ${updateError.message}`, 'error');
          } else {
            setGeneratedCode(newOtp);
            setOtpSent(true);
            showNotification(`OTP Code Generated: ${newOtp}`, 'success');
          }
        } catch (err) {
          showNotification('Failed to send OTP code.', 'error');
        } finally {
          setForgotLoading(false);
        }
      };

      const handleResetPasswordWithOTP = async (e) => {
        e.preventDefault();

        if (!otpCode.trim()) {
          showNotification('Please enter the OTP verification code.', 'error');
          return;
        }

        if (!IAS_PASSWORD_REGEX.test(newPassword)) {
          showNotification('New password does not meet security requirements.', 'error');
          return;
        }

        if (newPassword !== confirmNewPassword) {
          showNotification('Passwords do not match.', 'error');
          return;
        }

        setForgotLoading(true);
        try {
          const { data: profile } = await supabase
            .from('profiles')
            .select('*')
            .eq('email', otpEmail.trim())
            .maybeSingle();

          if (profile && profile.otp_code === otpCode.trim()) {
            await supabase.from('profiles').update({ otp_code: null }).eq('id', profile.id);

            const { error: authUpdateError } = await supabase.auth.updateUser({
              password: newPassword
            });

            if (authUpdateError) {
              showNotification('Password updated successfully! Please sign in with your new password.', 'success');
            } else {
              showNotification('Password changed successfully!', 'success');
            }

            await safeAuditLog(profile, 'PASSWORD_RESET_OTP', { email: profile.email });
            
            setActiveTab('login');
            setLoginEmail(otpEmail);
            setLoginPassword('');
            setOtpSent(false);
            setGeneratedCode(null);
            setOtpCode('');
            setNewPassword('');
            setConfirmNewPassword('');
          } else {
            showNotification('Invalid OTP code. Please check the code shown.', 'error');
          }
        } catch (err) {
          showNotification('Password reset failed. Please try again.', 'error');
        } finally {
          setForgotLoading(false);
        }
      };

      return (
        <div className="p-5 flex-1 flex flex-col justify-center space-y-5">
          <div className="text-center space-y-1">
            <div className="inline-flex items-center justify-center p-2 rounded-2xl bg-brand-500/10 border border-brand-500/20 shadow-inner mb-1">
              <MapPinLogo className="w-10 h-10" />
            </div>
            <h1 className="text-xl font-extrabold tracking-tight text-white">RecMatch</h1>
            <p className="text-[11px] text-slate-400">Ormoc City Sports Court & League</p>
          </div>

          {activeTab !== 'forgot' && (
            <div className="grid grid-cols-2 p-1 bg-slate-900 rounded-xl border border-slate-800 text-[10px] font-bold">
              <button
                type="button"
                onClick={() => { setActiveTab('login'); setOtpSent(false); }}
                className={`py-2 rounded-lg transition-all ${activeTab === 'login' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
              >
                Sign In
              </button>
              <button
                type="button"
                onClick={() => { setActiveTab('register'); setOtpSent(false); }}
                className={`py-2 rounded-lg transition-all ${activeTab === 'register' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
              >
                Sign Up
              </button>
            </div>
          )}

          {activeTab === 'login' && (
            <form onSubmit={handleLoginSubmit} className="space-y-3.5">
              <div>
                <label className="block text-[11px] font-bold text-slate-300 mb-1">Email Address</label>
                <input
                  type="email"
                  value={loginEmail}
                  onChange={(e) => setLoginEmail(e.target.value)}
                  placeholder="jhon@recmatch.com"
                  className="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-300 mb-1">Password</label>
                <div className="relative">
                  <input
                    type={showLoginPassword ? 'text' : 'password'}
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full pl-3.5 pr-12 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                  />
                  <button
                    type="button"
                    onClick={() => setShowLoginPassword(!showLoginPassword)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 hover:text-white font-bold"
                  >
                    {showLoginPassword ? 'Hide' : 'Show'}
                  </button>
                </div>
              </div>

              <button
                type="submit"
                disabled={loginLoading}
                className="w-full py-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg shadow-brand-500/20 disabled:opacity-50 active:scale-95"
              >
                {loginLoading ? 'Signing In...' : 'Sign In'}
              </button>

              <div className="text-center pt-1">
                <button
                  type="button"
                  onClick={() => {
                    if (loginEmail.trim()) {
                      setOtpEmail(loginEmail.trim());
                    }
                    setActiveTab('forgot');
                  }}
                  className="text-[11px] font-semibold text-brand-400 hover:text-brand-300 transition-colors"
                >
                  Forgot Password?
                </button>
              </div>
            </form>
          )}

          {activeTab === 'register' && (
            <form onSubmit={handleRegisterSubmit} className="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Full Name</label>
                <input
                  type="text"
                  value={regFullName}
                  onChange={(e) => setRegFullName(e.target.value)}
                  placeholder="Jhon Kenneth Mabulay"
                  className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Email Address</label>
                <input
                  type="email"
                  value={regEmail}
                  onChange={(e) => setRegEmail(e.target.value)}
                  placeholder="jhon@recmatch.com"
                  className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Account Role</label>
                <select
                  value={regRole}
                  onChange={(e) => setRegRole(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                >
                  <option value="Player / User">Player / User</option>
                  <option value="Organizer">Organizer</option>
                  <option value="Admin">Admin</option>
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Password</label>
                <div className="relative">
                  <input
                    type={showRegPassword ? 'text' : 'password'}
                    value={regPassword}
                    onChange={(e) => setRegPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full pl-3 pr-12 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                  />
                  <button
                    type="button"
                    onClick={() => setShowRegPassword(!showRegPassword)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 hover:text-white font-bold"
                  >
                    {showRegPassword ? 'Hide' : 'Show'}
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Confirm Password</label>
                <div className="relative">
                  <input
                    type={showRegConfirmPassword ? 'text' : 'password'}
                    value={regConfirmPassword}
                    onChange={(e) => setRegConfirmPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full pl-3 pr-12 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                  />
                  <button
                    type="button"
                    onClick={() => setShowRegConfirmPassword(!showRegConfirmPassword)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 hover:text-white font-bold"
                  >
                    {showRegConfirmPassword ? 'Hide' : 'Show'}
                  </button>
                </div>
              </div>

              <div className="p-2.5 bg-slate-900/60 rounded-xl border border-slate-800 space-y-1 text-[10px]">
                <p className="font-bold text-slate-400">IAS Security Checklist:</p>
                <div className="grid grid-cols-2 gap-0.5 font-mono text-[9px] text-slate-400">
                  <span className={validations.length ? 'text-brand-400 font-bold' : ''}>{validations.length ? '✓' : '•'} Min 8 chars</span>
                  <span className={validations.uppercase ? 'text-brand-400 font-bold' : ''}>{validations.uppercase ? '✓' : '•'} Uppercase</span>
                  <span className={validations.lowercase ? 'text-brand-400 font-bold' : ''}>{validations.lowercase ? '✓' : '•'} Lowercase</span>
                  <span className={validations.number ? 'text-brand-400 font-bold' : ''}>{validations.number ? '✓' : '•'} Number</span>
                  <span className={validations.special ? 'text-brand-400 font-bold' : ''}>{validations.special ? '✓' : '•'} Special (@$!%*?&)</span>
                  <span className={validations.match ? 'text-brand-400 font-bold' : ''}>{validations.match ? '✓' : '•'} Password Match</span>
                </div>
              </div>

              <button
                type="submit"
                disabled={regLoading}
                className="w-full py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg shadow-brand-500/20 disabled:opacity-50 active:scale-95"
              >
                {regLoading ? 'Registering...' : 'Register Account'}
              </button>
            </form>
          )}

          {activeTab === 'forgot' && (
            <div className="space-y-3.5">
              {!otpSent ? (
                <form onSubmit={handleSendResetOTP} className="space-y-3">
                  <div className="text-center space-y-0.5">
                    <h2 className="text-xs font-bold text-white uppercase tracking-wider">🔐 RESET PASSWORD</h2>
                    <p className="text-[10px] text-slate-400">Enter your email address to receive an OTP code.</p>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-300 mb-1">Account Email</label>
                    <input
                      type="email"
                      value={otpEmail}
                      onChange={(e) => setOtpEmail(e.target.value)}
                      placeholder="e.g., jhon@recmatch.com"
                      className="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={forgotLoading}
                    className="w-full py-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50"
                  >
                    {forgotLoading ? 'Sending OTP...' : 'Send OTP Code'}
                  </button>

                  <button
                    type="button"
                    onClick={() => setActiveTab('login')}
                    className="w-full text-[10px] text-slate-400 hover:text-white text-center font-bold pt-1"
                  >
                    ← Back to Sign In
                  </button>
                </form>
              ) : (
                <form onSubmit={handleResetPasswordWithOTP} className="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
                  {generatedCode && (
                    <div className="p-3 bg-emerald-950/80 border border-emerald-500/40 rounded-xl text-center space-y-1">
                      <p className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Your OTP Code</p>
                      <p className="text-2xl font-mono font-extrabold text-white tracking-widest">{generatedCode}</p>
                      <p className="text-[9px] text-emerald-300/80">Code sent for {otpEmail}</p>
                    </div>
                  )}

                  <div>
                    <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Enter OTP Code</label>
                    <input
                      type="text"
                      value={otpCode}
                      onChange={(e) => setOtpCode(e.target.value)}
                      placeholder="123456"
                      maxLength={6}
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-center font-mono text-sm tracking-widest text-white outline-none focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-300 mb-0.5">New Password</label>
                    <input
                      type="password"
                      value={newPassword}
                      onChange={(e) => setNewPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Confirm New Password</label>
                    <input
                      type="password"
                      value={confirmNewPassword}
                      onChange={(e) => setConfirmNewPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                    />
                  </div>

                  <div className="p-2 bg-slate-900/60 rounded-xl border border-slate-800 space-y-0.5 text-[10px]">
                    <p className="font-bold text-slate-400">Password Checklist:</p>
                    <div className="grid grid-cols-2 gap-0.5 font-mono text-[9px] text-slate-400">
                      <span className={resetPasswordValidations.length ? 'text-brand-400 font-bold' : ''}>{resetPasswordValidations.length ? '✓' : '•'} Min 8 chars</span>
                      <span className={resetPasswordValidations.uppercase ? 'text-brand-400 font-bold' : ''}>{resetPasswordValidations.uppercase ? '✓' : '•'} Uppercase</span>
                      <span className={resetPasswordValidations.lowercase ? 'text-brand-400 font-bold' : ''}>{resetPasswordValidations.lowercase ? '✓' : '•'} Lowercase</span>
                      <span className={resetPasswordValidations.number ? 'text-brand-400 font-bold' : ''}>{resetPasswordValidations.number ? '✓' : '•'} Number</span>
                      <span className={resetPasswordValidations.special ? 'text-brand-400 font-bold' : ''}>{resetPasswordValidations.special ? '✓' : '•'} Special</span>
                      <span className={resetPasswordValidations.match ? 'text-brand-400 font-bold' : ''}>{resetPasswordValidations.match ? '✓' : '•'} Password Match</span>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={forgotLoading}
                    className="w-full py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50"
                  >
                    {forgotLoading ? 'Updating Password...' : 'Verify OTP & Change Password'}
                  </button>

                  <button
                    type="button"
                    onClick={() => { setOtpSent(false); setGeneratedCode(null); }}
                    className="w-full text-[10px] text-slate-400 hover:text-white text-center font-bold pt-1"
                  >
                    ← Resend OTP
                  </button>
                </form>
              )}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 4. SCHEDULE / COURT SCHEDULE VIEW
    // =========================================================================
    function OrmocZoneSchedule() {
      const [approvedLigas, setApprovedLigas] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetchApprovedSchedules();
      }, []);

      const fetchApprovedSchedules = async () => {
        setLoading(true);
        const { data } = await supabase
          .from('enrollments')
          .select('*')
          .in('status', ['dean_approved', 'Approved'])
          .order('submitted_at', { ascending: false });

        const activeSchedules = (data || []).filter(item => !isSchedulePast(item.semester));

        setApprovedLigas(activeSchedules);
        setLoading(false);
      };

      return (
        <div className="p-4 space-y-4">
          <div className="text-center space-y-1 border-b border-slate-800 pb-3">
            <h3 className="text-xs font-bold text-white uppercase tracking-wider flex items-center justify-center gap-1.5">
              <span>📅</span> Official Court & League Schedule
            </h3>
            <p className="text-[10px] text-slate-400">Approved Active Tournaments & Reserved Court Timetable</p>
          </div>

          {loading ? (
            <LoadingSpinner label="Fetching active court schedules..." />
          ) : approvedLigas.length === 0 ? (
            <div className="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-center space-y-2">
              <span className="text-2xl">🏀</span>
              <p className="text-xs text-slate-400 font-semibold">All Courts Currently Free for Booking!</p>
              <p className="text-[10px] text-slate-500">No active reserved court bookings at this moment.</p>
            </div>
          ) : (
            <div className="space-y-2.5 max-h-[500px] overflow-y-auto pr-1">
              {approvedLigas.map((item) => (
                <div key={item.id} className="p-3 bg-slate-900 border border-slate-800 rounded-2xl space-y-1.5">
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="text-xs font-bold text-brand-400">{item.course_program}</p>
                      <p className="text-[10px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(item.semester) || 'Scheduled'}</p>
                    </div>
                    <span className="px-2 py-0.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[9px] font-bold rounded-full">
                      Already Occupied
                    </span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 5. PLAYER / USER DASHBOARD
    // =========================================================================
    function PlayerDashboard({ currentUser, showNotification, availableCourts, playerNavTab }) {
      const [bookings, setBookings] = React.useState([]);
      const [openLeagues, setOpenLeagues] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      
      const [selectedCourt, setSelectedCourt] = React.useState(null);
      const [reserveDate, setReserveDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [reserveTime, setReserveTime] = React.useState('16:00');
      const [submittingBooking, setSubmittingBooking] = React.useState(false);

      const [zoomedImage, setZoomedImage] = React.useState(null);

      const [activeModalLeague, setActiveModalLeague] = React.useState(null);
      const [regType, setRegType] = React.useState('team');
      const [teamName, setTeamName] = React.useState('');
      const [repName, setRepName] = React.useState('');
      const [repContact, setRepContact] = React.useState('');
      const [rosterList, setRosterList] = React.useState('');
      const [paymentMethod, setPaymentMethod] = React.useState('gcash');
      const [gcashRef, setGcashRef] = React.useState('');
      const [submittingLeague, setSubmittingLeague] = React.useState(false);

      React.useEffect(() => {
        fetchMyBookings();
        fetchOpenLeagues();
      }, []);

      const fetchMyBookings = async () => {
        setLoading(true);
        const { data, error } = await supabase
          .from('enrollments')
          .select('*')
          .eq('student_id', currentUser.id)
          .order('submitted_at', { ascending: false });

        if (!error) setBookings(data || []);
        setLoading(false);
      };

      const fetchOpenLeagues = async () => {
        const { data } = await supabase
          .from('enrollments')
          .select('*')
          .in('status', ['dean_approved', 'Approved'])
          .like('course_program', '%LEAGUE:%')
          .order('submitted_at', { ascending: false });

        setOpenLeagues(data || []);
      };

      const handleCreateBooking = async (e) => {
        e.preventDefault();
        if (!selectedCourt) return;

        if (!reserveDate || !reserveTime) {
          showNotification('Please choose a reservation Date and Time.', 'error');
          return;
        }

        const scheduleString = `${reserveDate} @ ${reserveTime}`;

        if (isSchedulePast(scheduleString)) {
          showNotification('Cannot reserve a time slot in the past.', 'error');
          return;
        }

        setSubmittingBooking(true);

        try {
          const { data: existingBookings } = await supabase
            .from('enrollments')
            .select('*')
            .eq('course_program', selectedCourt.name)
            .eq('semester', scheduleString)
            .in('status', ['submitted', 'Pending', 'dean_approved', 'Approved']);

          if (existingBookings && existingBookings.length > 0) {
            showNotification(`Already Occupied: ${selectedCourt.name} is reserved for ${formatScheduleTo12Hour(scheduleString)}!`, 'error');
            setSubmittingBooking(false);
            return;
          }

          await supabase.from('profiles').upsert({
            id: currentUser.id,
            full_name: currentUser.full_name || currentUser.email.split('@')[0],
            email: currentUser.email,
            role: currentUser.role || 'Player / User'
          }, { onConflict: 'id' });

          const { error } = await supabase.from('enrollments').insert({
            student_id: currentUser.id,
            course_program: `${selectedCourt.name}`,
            academic_year: "2026",
            semester: scheduleString,
            status: 'Pending',
          }).select();

          if (error) {
            showNotification(`Booking failed: ${error.message}`, 'error');
          } else {
            showNotification(`Court reserved for ${formatScheduleTo12Hour(scheduleString)}!`, 'success');
            safeAuditLog(currentUser, 'SUBMIT_COURT_RESERVATION', { court_name: selectedCourt.name, schedule: scheduleString });
            setSelectedCourt(null);
            fetchMyBookings();
          }
        } catch (err) {
          showNotification('Error creating reservation.', 'error');
        } finally {
          setSubmittingBooking(false);
        }
      };

      const handleLeagueRegistrationSubmit = async (e) => {
        e.preventDefault();

        if (regType === 'team' && !teamName.trim()) {
          showNotification('Please provide a Team Name.', 'error');
          return;
        }

        if (!repName.trim()) {
          showNotification('Please provide the Player Representative Name.', 'error');
          return;
        }

        if (!repContact.trim()) {
          showNotification('Please provide the Representative Contact Number.', 'error');
          return;
        }

        if (paymentMethod === 'gcash' && !gcashRef.trim()) {
          showNotification('Please provide your GCash Reference Number.', 'error');
          return;
        }

        setSubmittingLeague(true);
        try {
          const leagueTitleClean = activeModalLeague.course_program.replace('🏆 LEAGUE: ', '');
          const formattedDetails = `🏆 LEAGUE REGISTRATION: ${leagueTitleClean} | Mode: ${regType.toUpperCase()}${regType === 'team' ? ` (Team: ${teamName.trim()})` : ''} | Rep: ${repName.trim()} (Contact: ${repContact.trim()}) | Pay: ${paymentMethod.toUpperCase()}${paymentMethod === 'gcash' ? ` [Ref: ${gcashRef.trim()}]` : ''}${rosterList ? ` | Roster: ${rosterList.trim()}` : ''}`;

          const { error } = await supabase.from('enrollments').insert({
            student_id: currentUser.id,
            course_program: formattedDetails,
            academic_year: "2026",
            semester: activeModalLeague.semester || 'Pending Schedule',
            status: 'Pending',
          });

          if (error) {
            showNotification(`Registration failed: ${error.message}`, 'error');
          } else {
            showNotification(`Registered for ${leagueTitleClean} successfully!`, 'success');
            safeAuditLog(currentUser, 'LEAGUE_REGISTRATION', { league: leagueTitleClean, type: regType, rep: repName.trim(), payment: paymentMethod });
            setActiveModalLeague(null);
            setTeamName('');
            setRepName('');
            setRepContact('');
            setRosterList('');
            setGcashRef('');
            fetchMyBookings();
          }
        } catch (err) {
          showNotification('Error registering for league.', 'error');
        } finally {
          setSubmittingLeague(false);
        }
      };

      return (
        <div className="p-3 sm:p-4 flex-1 flex flex-col h-full overflow-hidden relative">
          
          {/* ZOOMED IMAGE MODAL */}
          {zoomedImage && (
            <div 
              onClick={() => setZoomedImage(null)}
              className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4 animate-fade-in cursor-zoom-out"
            >
              <div className="relative max-w-lg w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden p-3 shadow-2xl space-y-2" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center px-1">
                  <span className="text-xs font-bold text-white uppercase tracking-wider">Court Image Zoom</span>
                  <button 
                    onClick={() => setZoomedImage(null)} 
                    className="w-7 h-7 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center text-xs transition-all"
                  >
                    ✕
                  </button>
                </div>
                <div className="w-full rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 flex items-center justify-center max-h-[70vh]">
                  <img src={zoomedImage} alt="Zoomed Court" className="w-full h-auto object-contain max-h-[70vh]" />
                </div>
              </div>
            </div>
          )}

          {/* FLOATING MODAL POPUP FOR COURT RESERVATION */}
          {selectedCourt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
                
                <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                  <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                    <span>🏟️</span> Reserve Court
                  </h3>
                  <button
                    onClick={() => setSelectedCourt(null)}
                    className="text-slate-400 hover:text-white font-bold text-xs p-1 rounded-lg hover:bg-slate-800 transition-colors"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-3 bg-slate-950 rounded-2xl border border-brand-500/50 flex items-center gap-3">
                  <div 
                    onClick={() => selectedCourt.image && setZoomedImage(selectedCourt.image)}
                    className={`w-16 h-16 rounded-xl bg-slate-900 overflow-hidden border border-slate-800 shrink-0 flex items-center justify-center relative ${selectedCourt.image ? 'cursor-zoom-in hover:opacity-80 transition-opacity' : ''}`}
                    title={selectedCourt.image ? "Click to Zoom Image" : ""}
                  >
                    {selectedCourt.image ? (
                      <img src={selectedCourt.image} alt={selectedCourt.name} className="w-full h-full object-cover" />
                    ) : (
                      <span className="text-2xl">🏀</span>
                    )}
                  </div>
                  <div className="space-y-1 min-w-0">
                    <p className="text-xs font-bold text-white truncate leading-tight">{selectedCourt.name}</p>
                    <p className="text-[10px] text-slate-400 truncate">📍 {selectedCourt.location} • <span className="text-brand-400 font-semibold">₱{selectedCourt.rate}/hr</span></p>
                  </div>
                </div>

                <form onSubmit={handleCreateBooking} className="space-y-4">
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 mb-1">Reservation Date</label>
                      <input
                        type="date"
                        value={reserveDate}
                        onChange={(e) => setReserveDate(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 cursor-pointer"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 mb-1">Time Slot</label>
                      <input
                        type="time"
                        value={reserveTime}
                        onChange={(e) => setReserveTime(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 cursor-pointer"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setSelectedCourt(null)}
                      className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition-all"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={submittingBooking}
                      className="py-2.5 px-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg shadow-brand-500/20 disabled:opacity-50 active:scale-95"
                    >
                      {submittingBooking ? 'Submitting...' : 'Submit Reservation'}
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {activeModalLeague && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-3.5 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="text-xs font-bold text-white flex items-center gap-1">
                    <span>🏆</span> Register for League
                  </h3>
                  <button onClick={() => setActiveModalLeague(null)} className="text-slate-400 hover:text-white font-bold text-xs">✕</button>
                </div>

                {(() => {
                  const rawTitle = activeModalLeague.course_program.replace('🏆 LEAGUE: ', '');
                  const feeMatch = rawTitle.match(/\(Fee:\s*₱?(\d+)\)/i);
                  const cleanTitle = rawTitle.replace(/\s*\(Fee:\s*₱?\d+\)/i, '');
                  const feeVal = feeMatch ? feeMatch[1] : null;

                  return (
                    <div className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-1">
                      <div className="flex justify-between items-start gap-2">
                        <p className="font-bold text-brand-400 leading-snug">{cleanTitle}</p>
                        {feeVal && (
                          <span className="px-2 py-0.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-extrabold rounded-md shrink-0">
                            ₱{feeVal}
                          </span>
                        )}
                      </div>
                      <p className="text-[10px] text-slate-400 font-mono">📅 {formatScheduleTo12Hour(activeModalLeague.semester)}</p>
                    </div>
                  );
                })()}

                <form onSubmit={handleLeagueRegistrationSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-300 mb-1">Registration Type</label>
                    <div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 text-[10px] font-bold">
                      <button
                        type="button"
                        onClick={() => setRegType('team')}
                        className={`py-1.5 rounded-lg transition-all ${regType === 'team' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
                      >
                        👥 Team Roster
                      </button>
                      <button
                        type="button"
                        onClick={() => setRegType('solo')}
                        className={`py-1.5 rounded-lg transition-all ${regType === 'solo' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
                      >
                        👤 Solo Player
                      </button>
                    </div>
                  </div>

                  {regType === 'team' && (
                    <div>
                      <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Team Name</label>
                      <input
                        type="text"
                        value={teamName}
                        onChange={(e) => setTeamName(e.target.value)}
                        placeholder="e.g., Ormoc Ballers"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                      />
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Representative Name</label>
                      <input
                        type="text"
                        value={repName}
                        onChange={(e) => setRepName(e.target.value)}
                        placeholder="Jhon Kenneth"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Contact Number</label>
                      <input
                        type="text"
                        value={repContact}
                        onChange={(e) => setRepContact(e.target.value)}
                        placeholder="09123456789"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 font-mono"
                      />
                    </div>
                  </div>

                  {regType === 'team' && (
                    <div>
                      <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Player Roster (Optional)</label>
                      <textarea
                        value={rosterList}
                        onChange={(e) => setRosterList(e.target.value)}
                        placeholder="List player names separated by commas..."
                        rows={2}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-[10px] font-bold text-slate-300 mb-1">Payment Method</label>
                    <div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 text-[10px] font-bold">
                      <button
                        type="button"
                        onClick={() => setPaymentMethod('gcash')}
                        className={`py-1.5 rounded-lg transition-all ${paymentMethod === 'gcash' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
                      >
                        📱 GCash Online
                      </button>
                      <button
                        type="button"
                        onClick={() => setPaymentMethod('cash')}
                        className={`py-1.5 rounded-lg transition-all ${paymentMethod === 'cash' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
                      >
                        💵 On-Site Cash
                      </button>
                    </div>
                  </div>

                  {paymentMethod === 'gcash' && (
                    <div className="p-2.5 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5">
                      <div className="flex justify-between items-center text-[10px]">
                        <span className="text-slate-400">GCash Number:</span>
                        <span className="text-brand-400 font-mono font-bold">0917-123-4567</span>
                      </div>
                      <input
                        type="text"
                        value={gcashRef}
                        onChange={(e) => setGcashRef(e.target.value)}
                        placeholder="Enter 13-digit GCash Ref No."
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 font-mono"
                      />
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={submittingLeague}
                    className="w-full py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-md active:scale-95 disabled:opacity-50"
                  >
                    {submittingLeague ? 'Registering...' : 'Confirm Registration'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {playerNavTab === 'home' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col overflow-hidden">
              <h3 className="text-xs font-bold text-white flex items-center gap-1.5 mb-3">
                <span>📋</span>Court & League Registrations
              </h3>

              {loading ? (
                <LoadingSpinner label="Fetching bookings..." />
              ) : bookings.length === 0 ? (
                <p className="text-[11px] text-slate-500 py-4 text-center">No active court reservations or league entries.</p>
              ) : (
                <div className="space-y-2 overflow-y-auto flex-1 pr-1">
                  {bookings.map((b) => (
                    <div key={b.id} className="p-3 bg-slate-950 border border-slate-800/80 rounded-xl space-y-1.5">
                      <div className="flex items-start justify-between gap-2">
                        <p className="font-bold text-xs text-white leading-tight">{b.course_program}</p>
                        <StatusBadge status={b.status} scheduleStr={b.semester} />
                      </div>
                      <div className="flex justify-between items-center text-[10px] text-brand-400 font-mono">
                        <span>Schedule: {formatScheduleTo12Hour(b.semester) || 'Pending Schedule'}</span>
                        <span className="text-slate-500">{isSchedulePast(b.semester) ? 'Expired' : (b.status === 'Approved' || b.status === 'dean_approved') ? 'Approved' : 'Pending'}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {playerNavTab === 'reservation' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col overflow-hidden">
              <div className="text-xs font-bold text-white mb-3 flex items-center justify-between shrink-0">
                <span>Select a Court to Reserve</span>
                <span className="text-[10px] text-slate-400">Click Image to Zoom • Card to Reserve</span>
              </div>

              {availableCourts.length === 0 ? (
                <div className="flex-1 flex flex-col items-center justify-center text-center p-6 space-y-2">
                  <span className="text-3xl">🏟️</span>
                  <p className="text-xs font-bold text-slate-300">No Courts Available Yet</p>
                  <p className="text-[10px] text-slate-500 leading-relaxed">Organizers can propose new courts via the "Add Court" tab, which will appear here once approved by Admin.</p>
                </div>
              ) : (
                <div className="space-y-2.5 overflow-y-auto flex-1 pr-1">
                  {availableCourts.map((court, idx) => (
                    <div
                      key={court.id || idx}
                      className="p-3 bg-slate-950 rounded-2xl border border-slate-800 hover:border-brand-500 transition-all flex items-center justify-between gap-3 group shrink-0"
                    >
                      <div className="flex items-center gap-3 min-w-0 flex-1">
                        <div 
                          onClick={(e) => {
                            e.stopPropagation();
                            if (court.image) setZoomedImage(court.image);
                          }}
                          className={`w-14 h-14 rounded-xl bg-slate-900 overflow-hidden border border-slate-800 shrink-0 flex items-center justify-center relative ${court.image ? 'cursor-zoom-in hover:opacity-80 transition-opacity' : ''}`}
                          title={court.image ? "Click to Zoom Image" : ""}
                        >
                          {court.image ? (
                            <img src={court.image} alt={court.name} className="w-full h-full object-cover" />
                          ) : (
                            <span className="text-xl">🏟️</span>
                          )}
                        </div>

                        <div 
                          onClick={() => setSelectedCourt(court)}
                          className="space-y-0.5 min-w-0 flex-1 cursor-pointer"
                        >
                          <p className="text-xs font-bold text-white truncate group-hover:text-brand-400 transition-colors">{court.name}</p>
                          <p className="text-[10px] text-slate-400 truncate flex items-center gap-1">
                            <span>📍</span> {court.location} • <span className="text-brand-400 font-semibold">₱{court.rate}/hr</span>
                          </p>
                        </div>
                      </div>

                      <div 
                        onClick={() => setSelectedCourt(court)}
                        className="shrink-0 flex items-center cursor-pointer"
                      >
                        <span className="w-6 h-6 rounded-full bg-slate-900 border border-slate-800 text-slate-400 group-hover:bg-brand-500 group-hover:text-slate-950 group-hover:border-brand-500 flex items-center justify-center text-xs transition-all">›</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {playerNavTab === 'leagues' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col overflow-hidden">
              <h3 className="text-xs font-bold text-white flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                <span className="flex items-center gap-1.5"><span>🏆</span> Open Leagues & Tournaments</span>
                <span className="px-2 py-0.5 bg-brand-500/10 border border-brand-500/20 text-brand-400 text-[9px] font-bold rounded-full">
                  {openLeagues.length} Active
                </span>
              </h3>

              {openLeagues.length === 0 ? (
                <p className="text-xs text-slate-500 py-6 text-center">No active leagues open for registration.</p>
              ) : (
                <div className="space-y-2 overflow-y-auto flex-1 pr-1">
                  {openLeagues.map((league) => {
                    const rawTitle = league.course_program.replace('🏆 LEAGUE: ', '');
                    const feeMatch = rawTitle.match(/\(Fee:\s*₱?(\d+)\)/i);
                    const cleanTitle = rawTitle.replace(/\s*\(Fee:\s*₱?\d+\)/i, '');
                    const feeVal = feeMatch ? feeMatch[1] : null;

                    return (
                      <div key={league.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                        <div className="flex justify-between items-start gap-2">
                          <div>
                            <p className="font-bold text-xs text-brand-400 leading-tight">{cleanTitle}</p>
                            <p className="text-[10px] text-slate-400 font-mono mt-0.5">📅 {formatScheduleTo12Hour(league.semester)}</p>
                            {feeVal ? (
                              <p className="text-[10px] font-bold text-emerald-400 font-mono mt-1 flex items-center gap-1">
                                <span>💵 Fee:</span> <span>₱{feeVal}</span>
                              </p>
                            ) : (
                              <p className="text-[10px] font-semibold text-slate-500 font-mono mt-1">
                                💵 Free Entry / On-Site Pay
                              </p>
                            )}
                          </div>
                          <button
                            onClick={() => setActiveModalLeague(league)}
                            className="px-3 py-1.5 bg-brand-500 hover:bg-brand-400 text-slate-950 text-[10px] font-extrabold rounded-lg transition-all shadow active:scale-95 shrink-0"
                          >
                            Join League
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // 6. COURT ORGANIZER DASHBOARD
    // =========================================================================
    function OrganizerDashboard({ currentUser, showNotification, availableCourts, refreshCourts, activeNavTab }) {
      const [ligaTitle, setLigaTitle] = React.useState('');
      const [selectedSport, setSelectedSport] = React.useState('Basketball');
      const [customSport, setCustomSport] = React.useState('');
      const [selectedCourt, setSelectedCourt] = React.useState(availableCourts[0]?.name || '');
      const [ligaFee, setLigaFee] = React.useState('500');
      const [reserveDate, setReserveDate] = React.useState(new Date().toISOString().split('T')[0]);

      const [newCourtName, setNewCourtName] = React.useState('');
      const [courtLocation, setCourtLocation] = React.useState('Carlos tan St. Ormoc City');
      const [newCourtRate, setNewCourtRate] = React.useState('200');
      const [courtFile, setCourtFile] = React.useState(null);
      const [courtImagePreview, setCourtImagePreview] = React.useState('');

      // Live Camera Modal State
      const [showCameraModal, setShowCameraModal] = React.useState(false);
      const videoRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const [cameraStream, setCameraStream] = React.useState(null);

      const [myLigas, setMyLigas] = React.useState([]);
      const [playerRequests, setPlayerRequests] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      const sportOptions = [
        "Basketball",
        "Volleyball",
        "Badminton",
        "Lawn Tennis",
        "Futsal",
        "Pickleball",
        "Table Tennis"
      ];

      React.useEffect(() => {
        fetchOrganizerData();
        return () => {
          stopCamera();
        };
      }, []);

      const fetchOrganizerData = async () => {
        setLoading(true);
        
        const { data: ligas } = await supabase
          .from('enrollments')
          .select('*')
          .eq('student_id', currentUser.id)
          .order('submitted_at', { ascending: false });

        setMyLigas(ligas || []);

        const { data: rawEnrollments } = await supabase
          .from('enrollments')
          .select('*')
          .neq('student_id', currentUser.id)
          .order('submitted_at', { ascending: false });

        if (rawEnrollments) {
          const studentIds = [...new Set(rawEnrollments.map(item => item.student_id).filter(Boolean))];
          let profilesMap = {};

          if (studentIds.length > 0) {
            const { data: profilesData } = await supabase
              .from('profiles')
              .select('id, full_name, email')
              .in('id', studentIds);

            if (profilesData) {
              profilesData.forEach(p => {
                profilesMap[p.id] = p;
              });
            }
          }

          const formattedRequests = rawEnrollments.map(item => ({
            ...item,
            profiles: profilesMap[item.student_id] || { full_name: 'Player / User', email: 'Registered User' }
          }));

          setPlayerRequests(formattedRequests);
        }

        setLoading(false);
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setCourtFile(file);
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 120;
              const MAX_HEIGHT = 90;
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
              setCourtImagePreview(dataUrl);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const startCamera = async () => {
        setShowCameraModal(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          setCameraStream(stream);
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          showNotification('Unable to access camera. Please check camera permissions.', 'error');
          setShowCameraModal(false);
        }
      };

      const stopCamera = () => {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          setCameraStream(null);
        }
        setShowCameraModal(false);
      };

      const capturePhoto = () => {
        if (videoRef.current && canvasRef.current) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          canvas.width = video.videoWidth || 320;
          canvas.height = video.videoHeight || 240;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          setCourtImagePreview(dataUrl);
          setCourtFile({ name: 'camera_capture.jpg' });
          showNotification('Photo captured successfully!', 'success');
          stopCamera();
        }
      };

      const handleCreateLiga = async (e) => {
        e.preventDefault();

        if (!ligaTitle.trim()) {
          showNotification('Please provide a title for the League or Tournament.', 'error');
          return;
        }

        if (availableCourts.length === 0) {
          showNotification('No approved courts available. Please add and approve a court first.', 'error');
          return;
        }

        const finalSport = selectedSport === 'Other' ? (customSport.trim() || 'Sports') : selectedSport;
        const targetCourtName = selectedCourt || availableCourts[0].name;

        await supabase.from('profiles').upsert({
          id: currentUser.id,
          full_name: currentUser.full_name || currentUser.email.split('@')[0],
          email: currentUser.email,
          role: 'Organizer'
        }, { onConflict: 'id' });

        const fullLigaName = `🏆 LEAGUE: [${finalSport}] ${ligaTitle.trim()} @ ${targetCourtName} (Fee: ₱${ligaFee || '0'})`;

        const { error } = await supabase.from('enrollments').insert({
          student_id: currentUser.id,
          course_program: fullLigaName,
          academic_year: "2026",
          semester: `Date: ${reserveDate}`,
          status: 'Approved',
        }).select();

        if (error) {
          showNotification(`League submission error: ${error.message}`, 'error');
        } else {
          showNotification(`League "${ligaTitle}" created successfully and published to players!`, 'success');
          setLigaTitle('');
          setCustomSport('');
          setLigaFee('500');
          safeAuditLog(currentUser, 'CREATE_LIGA_DIRECT', { liga: fullLigaName });
          fetchOrganizerData();
        }
      };

      const handleProposeNewCourt = async (e) => {
        e.preventDefault();

        if (!newCourtName.trim()) {
          showNotification('Court / Facility Name is required.', 'error');
          return;
        }

        if (!courtLocation.trim()) {
          showNotification('Location is required.', 'error');
          return;
        }

        const finalLocation = courtLocation.trim();
        const attachmentName = courtFile ? courtFile.name : 'No Attachment';

        await supabase.from('profiles').upsert({
          id: currentUser.id,
          full_name: currentUser.full_name || currentUser.email.split('@')[0],
          email: currentUser.email,
          role: 'Organizer'
        }, { onConflict: 'id' });

        const courtTag = `🏟️ NEW COURT PROPOSAL: ${newCourtName.trim()} (₱${newCourtRate}/hr) - Basketball @ ${finalLocation}`;

        const { error } = await supabase.from('enrollments').insert({
          student_id: currentUser.id,
          course_program: courtTag,
          academic_year: courtImagePreview || "2026",
          semester: `Loc: ${finalLocation} | Att: ${attachmentName}`,
          status: 'Pending',
        }).select();

        if (error) {
          showNotification(`Court proposal failed: ${error.message}`, 'error');
        } else {
          showNotification(`Court facility "${newCourtName}" sent to Admin for approval!`, 'success');
          setNewCourtName('');
          setCourtLocation('Carlos tan St. Ormoc City');
          setCourtFile(null);
          setCourtImagePreview('');
          safeAuditLog(currentUser, 'PROPOSE_NEW_COURT', { court_name: newCourtName, location: finalLocation });
          fetchOrganizerData();
        }
      };

      const handleOrganizerApprove = async (id, status) => {
        const { error } = await supabase
          .from('enrollments')
          .update({ status: status })
          .eq('id', id)
          .select();

        if (error) {
          showNotification(`Action failed: ${error.message}`, 'error');
        } else {
          showNotification(`Player registration ${status === 'Approved' ? 'Approved' : 'Declined'} successfully!`, 'success');
          safeAuditLog(currentUser, 'ORGANIZER_DECISION', { request_id: id, status: status });
          fetchOrganizerData();
        }
      };

      return (
        <div className="p-4 space-y-4">
          
          {/* LIVE CAMERA CAPTURE MODAL */}
          {showCameraModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-4 animate-fade-in">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
