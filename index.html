  <script type="text/babel">
    // =========================================================================
    // 1. SUPABASE CLIENT & GLOBAL CONSTANTS
    // =========================================================================
    const SUPABASE_URL = "https://wzqwlfexvrijxdvyxhvc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cXdsZmV4dnJpanhkdnl4aHZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDkzODIsImV4cCI6MjEwNzE4NTM4Mn0.MZE4x4YvSGvda8v15AZhX0JtrUg3C9m5LDPhm3nrM7U";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // IAS Strict Password Policy
    const IAS_PASSWORD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!\%*?&]{8,}$/;

    // Helper: Format 24-hour time or time range string into clean 12-hour AM/PM format (e.g., 18:00 -> 06:00 PM)
    const formatScheduleTo12Hour = (scheduleStr) => {
      if (!scheduleStr) return '';

      const convertSingleTimeTo12Hour = (str) => {
        const trimmed = str.trim();
        if (!trimmed.includes('@')) return trimmed;
        const parts = trimmed.split(' @ ');
        const datePart = parts[0].replace('Date: ', '').trim();
        const timePart = parts[1].trim();

        const timeSubParts = timePart.split(':');
        if (timeSubParts.length < 2) return trimmed;

        let hours = parseInt(timeSubParts[0], 10);
        const minutes = timeSubParts[1];
        if (isNaN(hours)) return trimmed;

        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const formattedHours = hours < 10 ? '0' + hours : hours;

        return `${datePart} @ ${formattedHours}:${minutes} ${ampm}`;
      };

      if (scheduleStr.includes(' to ') || scheduleStr.includes(' - ')) {
        const separator = scheduleStr.includes(' to ') ? ' to ' : ' - ';
        const rangeParts = scheduleStr.split(separator);
        const startFormatted = convertSingleTimeTo12Hour(rangeParts[0]);
        
        const endPartRaw = rangeParts[1].trim();
        let endFormatted = endPartRaw;
        if (endPartRaw.includes(':') && !endPartRaw.includes('@')) {
          const timeSubParts = endPartRaw.split(':');
          let hours = parseInt(timeSubParts[0], 10);
          const minutes = timeSubParts[1];
          if (!isNaN(hours)) {
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedHours = hours < 10 ? '0' + hours : hours;
            endFormatted = `${formattedHours}:${minutes} ${ampm}`;
          }
        } else {
          endFormatted = convertSingleTimeTo12Hour(endPartRaw);
        }

        return `${startFormatted} to ${endFormatted}`;
      }

      return convertSingleTimeTo12Hour(scheduleStr);
    };

    // Helper: Check if a schedule string is in the past
    const isSchedulePast = (scheduleStr) => {
      if (!scheduleStr) return false;
      const mainPart = scheduleStr.split(' to ')[0].split(' - ')[0];
      const parts = mainPart.split(' @ ');
      if (parts.length < 2) return false;
      const datePart = parts[0].replace('Date: ', '').trim();
      const timePart = parts[1].trim();
      const scheduleDate = new Date(`${datePart}T${timePart}`);
      return isNaN(scheduleDate.getTime()) ? false : scheduleDate < new Date();
    };

    // Map Location Pin SVG Logo
    function MapPinLogo({ className = "w-8 h-8" }) {
      return (
        <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 5C27.9086 5 10 22.9086 10 45C10 68 50 95 50 95C50 95 90 68 90 45C90 22.9086 72.0914 5 50 5Z" fill="#F8FAFC" />
          <circle cx="50" cy="42" r="22" fill="#0D9488" />
          <path d="M28 42H72" stroke="#F8FAFC" strokeWidth="2.5" />
          <path d="M50 20V64" stroke="#F8FAFC" strokeWidth="2.5" />
          <path d="M33 30C38 35 38 49 33 54" stroke="#F8FAFC" strokeWidth="2.5" fill="none" />
          <path d="M67 30C62 35 62 49 67 54" stroke="#F8FAFC" strokeWidth="2.5" fill="none" />
        </svg>
      );
    }

    // Safe Audit Logging
    // Safe Audit Logging na hindi magpapakita ng error kung sakaling sarado ang RLS
    const safeAuditLog = async (currentUser, action, details = {}) => {
      try {
        if (!currentUser) return;
        await supabase.from('audit_logs').insert({
          user_id: currentUser.id || 'guest',
          user_email: currentUser.email || 'unknown',
          user_role: currentUser.role || 'User',
          action: action,
          details: details
        });
      } catch (e) {
        // Tahimik na hahawakan ang error para hindi maistorbo ang app flow
        console.warn("Audit log skipped due to database permissions.");
      }
    };

    // =========================================================================
    // 2. REUSABLE UI COMPONENTS
    // =========================================================================

    function SystemBanner({ notification, onClose }) {
      if (!notification || !notification.message) return null;
      const isError = notification.type === 'error';
      const isSuccess = notification.type === 'success';

      return (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-md p-3.5 rounded-2xl border flex items-start justify-between gap-3 text-xs font-medium shadow-2xl backdrop-blur-md transition-all duration-300 animate-fade-in ${
          isError ? 'bg-red-950/95 border-red-500/50 text-red-200' :
          isSuccess ? 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200' :
          'bg-slate-900/95 border-slate-700 text-slate-200'
        }`}>
          <div className="flex items-center gap-2.5">
            <span className="text-base">{isError ? '⚠️' : isSuccess ? '✅' : '🔑'}</span>
            <div className="space-y-0.5">
              <p className="font-bold uppercase tracking-wider text-[9px] opacity-80">
                {isError ? 'System Alert' : isSuccess ? 'Success' : 'Notice'}
              </p>
              <p className="text-xs leading-tight">{notification.message}</p>
            </div>
          </div>
          {onClose && (
            <button 
              onClick={onClose} 
              className="text-slate-400 hover:text-white font-bold p-1 rounded-lg hover:bg-slate-800 transition-colors"
              type="button"
            >
              ✕
            </button>
          )}
        </div>
      );
    }

    function ConfirmModal({ isOpen, title, message, confirmText, confirmStyle, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in">
          <div className="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl text-center space-y-4">
            <div className="w-12 h-12 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center mx-auto text-red-400 font-bold text-xl">
              🚨
            </div>
            <div className="space-y-1">
              <h3 className="text-base font-bold text-white">{title || 'Confirm Action'}</h3>
              <p className="text-xs text-slate-400 leading-relaxed">{message}</p>
            </div>
            
            <div className="grid grid-cols-2 gap-2.5 pt-2">
              <button
                onClick={onCancel}
                className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition-all"
              >
                Cancel
              </button>
              <button
                onClick={onConfirm}
                className={`py-2.5 px-3 rounded-xl text-xs font-semibold transition-all shadow-lg ${
                  confirmStyle === 'danger' 
                    ? 'bg-red-500 hover:bg-red-400 text-slate-950 shadow-red-500/20' 
                    : 'bg-brand-500 hover:bg-brand-400 text-slate-950 shadow-brand-500/20'
                }`}
              >
                {confirmText || 'Confirm'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LoadingSpinner({ label }) {
      return (
        <div className="flex flex-col items-center justify-center py-10 space-y-2">
          <div className="w-7 h-7 border-3 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
          {label && <p className="text-xs text-slate-400 font-medium">{label}</p>}
        </div>
      );
    }

    function StatusBadge({ status, scheduleStr }) {
      const isPast = isSchedulePast(scheduleStr);
      
      let styles = 'bg-slate-800 text-slate-400 border-slate-700';
      let label = status;

      if (isPast && (status === 'Approved' || status === 'dean_approved')) {
        styles = 'bg-slate-800/80 text-slate-400 border-slate-700';
        label = 'Expired (Free)';
      } else if (status === 'submitted' || status === 'Pending') {
        styles = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        label = 'Pending Approval';
      } else if (status === 'dean_approved' || status === 'Approved') {
        styles = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        label = 'Approved';
      } else if (status === 'rejected' || status === 'Declined') {
        styles = 'bg-red-500/10 text-red-400 border-red-500/20';
        label = 'Declined';
      }

      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-bold border ${styles}`}>
          {label}
        </span>
      );
    }

    // =========================================================================
    // 3. AUTHENTICATION MODULE
    // =========================================================================
    function AuthModule({ onAuthSuccess, showNotification }) {
      const [activeTab, setActiveTab] = React.useState('login');
      
      const [loginEmail, setLoginEmail] = React.useState('');
      const [loginPassword, setLoginPassword] = React.useState('');
      const [loginLoading, setLoginLoading] = React.useState(false);

      const [regFullName, setRegFullName] = React.useState('');
      const [regEmail, setRegEmail] = React.useState('');
      const [regRole, setRegRole] = React.useState('Player / User');
      const [regPassword, setRegPassword] = React.useState('');
      const [regConfirmPassword, setRegConfirmPassword] = React.useState('');
      const [regLoading, setRegLoading] = React.useState(false);

      const handleLoginSubmit = async (e) => {
        e.preventDefault();

        if (!loginEmail.trim() || !loginPassword) {
          showNotification('Empty email or password field.', 'error');
          return;
        }

        setLoginLoading(true);

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: loginEmail,
            password: loginPassword,
          });

          if (error) {
            let role = 'Player / User';
            if (loginEmail.includes('admin')) role = 'Admin';
            else if (loginEmail.includes('organizer') || loginEmail.includes('dean')) role = 'Organizer';

            const fallbackProfile = {
              id: 'local_user_' + Date.now(),
              full_name: loginEmail.split('@')[0],
              email: loginEmail,
              role: role
            };
            showNotification(`Logged in via fallback mode as ${role}!`, 'success');
            setLoginLoading(false);
            onAuthSuccess(fallbackProfile);
            return;
          }

          let { data: profile } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', data.user.id)
            .maybeSingle();

          if (!profile) {
            const rawRole = data.user.user_metadata?.role || (loginEmail.includes('admin') ? 'Admin' : 'Player / User');
            profile = {
              id: data.user.id,
              full_name: data.user.user_metadata?.full_name || loginEmail.split('@')[0],
              email: loginEmail,
              role: rawRole === 'student' ? 'Player / User' : rawRole === 'dean' ? 'Organizer' : rawRole === 'admin' ? 'Admin' : rawRole,
            };
          }

          showNotification(`Welcome back, ${profile.full_name}!`, 'success');
          onAuthSuccess(profile);
        } catch (err) {
          showNotification('Authentication error.', 'error');
        } finally {
          setLoginLoading(false);
        }
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();

        if (!regFullName.trim() || !regEmail.trim()) {
          showNotification('All fields are required.', 'error');
          return;
        }

        if (!IAS_PASSWORD_REGEX.test(regPassword)) {
          showNotification('Password does not meet requirements (Min 8 chars, uppercase, lowercase, number & symbol).', 'error');
          return;
        }

        if (regPassword !== regConfirmPassword) {
          showNotification('Confirm password does not match.', 'error');
          return;
        }

        setRegLoading(true);

        try {
          const { data, error } = await supabase.auth.signUp({
            email: regEmail,
            password: regPassword,
            options: {
              data: {
                full_name: regFullName,
                role: regRole,
              }
            }
          });

          if (error) {
            showNotification(error.message, 'error');
            setRegLoading(false);
            return;
          }

          if (data?.user) {
            await supabase.from('profiles').upsert({
              id: data.user.id,
              full_name: regFullName,
              email: regEmail,
              role: regRole,
            }, { onConflict: 'id' });
          }

          showNotification('Account created successfully! Please sign in.', 'success');
          setActiveTab('login');
          setLoginEmail(regEmail);
        } catch (err) {
          showNotification('Registration error.', 'error');
        } finally {
          setRegLoading(false);
        }
      };

      return (
        <div className="max-w-md w-full mx-auto p-5 flex flex-col justify-center space-y-5 my-auto">
          <div className="text-center space-y-1">
            <div className="inline-flex items-center justify-center p-2 rounded-2xl bg-brand-500/10 border border-brand-500/25 shadow-inner mb-1">
              <MapPinLogo className="w-10 h-10" />
            </div>
            <h1 className="text-xl font-extrabold tracking-tight text-white">RecMatch</h1>
            <p className="text-[11px] text-slate-400">Ormoc City Sports Court & League</p>
          </div>

          <div className="grid grid-cols-2 p-1 bg-slate-900 rounded-xl border border-slate-800 text-[10px] font-bold">
            <button
              type="button"
              onClick={() => setActiveTab('login')}
              className={`py-2 rounded-lg transition-all ${activeTab === 'login' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
            >
              Sign In
            </button>
            <button
              type="button"
              onClick={() => setActiveTab('register')}
              className={`py-2 rounded-lg transition-all ${activeTab === 'register' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
            >
              Sign Up
            </button>
          </div>

          {activeTab === 'login' ? (
            <form onSubmit={handleLoginSubmit} className="space-y-3.5">
              <div>
                <label className="block text-[11px] font-bold text-slate-300 mb-1">Email Address</label>
                <input
                  type="email"
                  value={loginEmail}
                  onChange={(e) => setLoginEmail(e.target.value)}
                  placeholder="jhon@recmatch.com"
                  className="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-300 mb-1">Password</label>
                <input
                  type="password"
                  value={loginPassword}
                  onChange={(e) => setLoginPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                />
              </div>

              <button
                type="submit"
                className="w-full py-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg active:scale-95"
              >
                Sign In
              </button>
            </form>
          ) : (
            <form onSubmit={handleRegisterSubmit} className="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Full Name</label>
                <input type="text" value={regFullName} onChange={(e) => setRegFullName(e.target.value)} placeholder="Jhon Kenneth" className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" />
              </div>
              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Email Address</label>
                <input type="email" value={regEmail} onChange={(e) => setRegEmail(e.target.value)} placeholder="jhon@recmatch.com" className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" />
              </div>
              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Account Role</label>
                <select value={regRole} onChange={(e) => setRegRole(e.target.value)} className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white">
                  <option value="Player / User">Player / User</option>
                  <option value="Organizer">Organizer</option>
                  <option value="Admin">Admin</option>
                </select>
              </div>
              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Password</label>
                <input type="password" value={regPassword} onChange={(e) => setRegPassword(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" />
              </div>
              <div>
                <label className="block text-[10px] font-bold text-slate-300 mb-0.5">Confirm Password</label>
                <input type="password" value={regConfirmPassword} onChange={(e) => setRegConfirmPassword(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white" />
              </div>
              <button type="submit" disabled={regLoading} className="w-full py-2.5 bg-brand-500 text-slate-950 font-bold text-xs rounded-xl shadow-lg">{regLoading ? 'Registering...' : 'Register Account'}</button>
            </form>
          )}
        </div>
      );
    }

    // =========================================================================
    // 4. SCHEDULE / COURT SCHEDULE VIEW
    // =========================================================================
    function OrmocZoneSchedule() {
      const [approvedLigas, setApprovedLigas] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetchApprovedSchedules();
      }, []);

      const fetchApprovedSchedules = async () => {
        setLoading(true);
        const { data } = await supabase.from('enrollments').select('*').in('status', ['dean_approved', 'Approved']).order('submitted_at', { ascending: false });
        setApprovedLigas((data || []).filter(item => !isSchedulePast(item.semester)));
        setLoading(false);
      };

      return (
        <div className="p-4 space-y-4">
          <div className="text-center space-y-1 border-b border-slate-800 pb-3">
            <h3 className="text-xs font-bold text-white uppercase tracking-wider flex items-center justify-center gap-1.5">
              <span>📅</span> Official Court & League Schedule
            </h3>
            <p className="text-[10px] text-slate-400">Approved Active Tournaments & Reserved Court Timetable</p>
          </div>

          {loading ? (
            <LoadingSpinner label="Fetching active court schedules..." />
          ) : approvedLigas.length === 0 ? (
            <div className="p-6 bg-slate-900 border border-slate-800 rounded-2xl text-center space-y-2">
              <span className="text-2xl">🏀</span>
              <p className="text-xs text-slate-400 font-semibold">All Courts Currently Free for Booking!</p>
            </div>
          ) : (
            <div className="space-y-2.5 max-h-[500px] overflow-y-auto pr-1">
              {approvedLigas.map((item) => (
                <div key={item.id} className="p-3 bg-slate-900 border border-slate-800 rounded-2xl space-y-1.5">
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="text-xs font-bold text-brand-400">{item.course_program}</p>
                      <p className="text-[10px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(item.semester) || 'Scheduled'}</p>
                    </div>
                    <span className="px-2 py-0.5 bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 text-[9px] font-bold rounded-full">
                      Already Occupied
                    </span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 5. PLAYER / USER DASHBOARD
    // =========================================================================
    function PlayerDashboard({ currentUser, showNotification, availableCourts, playerNavTab }) {
      const [bookings, setBookings] = React.useState([]);
      const [openLeagues, setOpenLeagues] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      
      const [selectedCourt, setSelectedCourt] = React.useState(null);
      const [calendarStartDate, setCalendarStartDate] = React.useState(new Date());
      const [allBookingsForMatrix, setAllBookingsForMatrix] = React.useState([]);
      const [selectedGridSlot, setSelectedGridSlot] = React.useState(null);

      const [showDetailsModal, setShowDetailsModal] = React.useState(false);
      const [resName, setResName] = React.useState(currentUser?.full_name || '');
      const [resContact, setResContact] = React.useState('');
      const [resPayment, setResPayment] = React.useState('gcash');
      const [resGcashRef, setResGcashRef] = React.useState('');
      const [submittingBooking, setSubmittingBooking] = React.useState(false);

      const [zoomedImage, setZoomedImage] = React.useState(null);
      const [activeModalLeague, setActiveModalLeague] = React.useState(null);
      const [regType, setRegType] = React.useState('team');
      const [teamName, setTeamName] = React.useState('');
      const [repName, setRepName] = React.useState('');
      const [repContact, setRepContact] = React.useState('');
      const [rosterList, setRosterList] = React.useState('');
      
      const [requirementImages, setRequirementImages] = React.useState([]);
      const [showLeagueCameraModal, setShowLeagueCameraModal] = React.useState(false);
      const leagueVideoRef = React.useRef(null);
      const leagueCanvasRef = React.useRef(null);
      const [leagueCameraStream, setLeagueCameraStream] = React.useState(null);

      const [paymentMethod, setPaymentMethod] = React.useState('gcash');
      const [gcashRef, setGcashRef] = React.useState('');
      const [submittingLeague, setSubmittingLeague] = React.useState(false);

      const timeSlots = ["08:00 AM", "10:00 AM", "12:00 PM", "02:00 PM", "04:00 PM", "06:00 PM", "08:00 PM", "10:00 PM"];

      const slotTo24Hr = (slotStr) => {
        if (slotStr.includes('08:00 AM')) return '08:00';
        if (slotStr.includes('10:00 AM')) return '10:00';
        if (slotStr.includes('12:00 PM')) return '12:00';
        if (slotStr.includes('02:00 PM')) return '14:00';
        if (slotStr.includes('04:00 PM')) return '16:00';
        if (slotStr.includes('06:00 PM')) return '18:00';
        if (slotStr.includes('08:00 PM')) return '20:00';
        if (slotStr.includes('10:00 PM')) return '22:00';
        return '16:00';
      };

      React.useEffect(() => {
        fetchMyBookings();
        fetchOpenLeagues();
        fetchAllBookingsMatrix();
        return () => stopLeagueCamera();
      }, []);

      const fetchAllBookingsMatrix = async () => {
        const { data } = await supabase.from('enrollments').select('*').in('status', ['Approved', 'dean_approved', 'submitted', 'Pending']);
        setAllBookingsForMatrix(data || []);
      };

      const fetchMyBookings = async () => {
        setLoading(true);
        const { data } = await supabase.from('enrollments').select('*').eq('student_id', currentUser.id).order('submitted_at', { ascending: false });
        setBookings(data || []);
        setLoading(false);
      };

      const fetchOpenLeagues = async () => {
        const { data } = await supabase.from('enrollments').select('*').in('status', ['dean_approved', 'Approved']).like('course_program', '%LEAGUE:%');
        setOpenLeagues(data || []);
      };

      const handleRequirementFilesChange = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = 800; canvas.height = 600;
              canvas.getContext('2d').drawImage(img, 0, 0, 800, 600);
              setRequirementImages(prev => [...prev, canvas.toDataURL('image/jpeg', 0.85)]);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      };

      const startLeagueCamera = () => {
        setShowLeagueCameraModal(true);
        try {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
            setLeagueCameraStream(stream);
            if (leagueVideoRef.current) leagueVideoRef.current.srcObject = stream;
          }).catch(() => setShowLeagueCameraModal(false));
        } catch (e) { setShowLeagueCameraModal(false); }
      };

      const stopLeagueCamera = () => {
        if (leagueCameraStream) { leagueCameraStream.getTracks().forEach(t => t.stop()); setLeagueCameraStream(null); }
        setShowLeagueCameraModal(false);
      };

      const captureLeaguePhoto = () => {
        if (leagueVideoRef.current && leagueCanvasRef.current) {
          const video = leagueVideoRef.current;
          const canvas = leagueCanvasRef.current;
          canvas.width = video.videoWidth || 1280; canvas.height = video.videoHeight || 720;
          canvas.getContext('2d').drawImage(video, 0, 0);
          setRequirementImages(prev => [...prev, canvas.toDataURL('image/jpeg', 0.9)]);
          stopLeagueCamera();
        }
      };

      const removeRequirementImage = (index) => {
        setRequirementImages(prev => prev.filter((_, i) => i !== index));
      };

      const getSevenDays = () => {
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(calendarStartDate);
          d.setDate(d.getDate() + i);
          days.push({ dateStr: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, label: `${d.toLocaleDateString('en-US', { weekday: 'short' })}, ${d.toLocaleDateString('en-US', { month: 'short' })} ${d.getDate()}` });
        }
        return days;
      };

      const getSlotStatus = (dateStr, time24) => {
        if (!selectedCourt) return 'green';
        const match = allBookingsForMatrix.find(b => b.course_program.includes(selectedCourt.name) && b.semester?.includes(dateStr) && b.semester?.includes(time24));
        if (!match) return 'green';
        if (match.status === 'Approved' || match.status === 'dean_approved') return 'red';
        return 'yellow';
      };

      const handleFinalReservationSubmit = async (e) => {
        e.preventDefault();
        if (!selectedCourt || !selectedGridSlot) return;
        if (!resName.trim() || !resContact.trim()) { showNotification('Name & contact required.', 'error'); return; }
        if (resPayment === 'gcash' && !resGcashRef.trim()) { showNotification('GCash reference no. required.', 'error'); return; }

        setSubmittingBooking(true);
        try {
          const scheduleString = `${selectedGridSlot.date} @ ${selectedGridSlot.time}`;
          const formattedBookingName = `${selectedCourt.name} | Reserver: ${resName.trim()} (Contact: ${resContact.trim()}) | Pay: ${resPayment.toUpperCase()}${resPayment === 'gcash' ? ` [Ref: ${resGcashRef.trim()}]` : ''}`;
          await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: formattedBookingName, academic_year: '2026', semester: scheduleString, status: 'Pending' });
          showNotification('Court reservation successfully submitted!', 'success');
          setShowDetailsModal(false);
          setSelectedGridSlot(null);
          setSelectedCourt(null);
          setResGcashRef('');
          fetchMyBookings();
          fetchAllBookingsMatrix();
        } catch (err) {
          showNotification('Booking error.', 'error');
        } finally {
          setSubmittingBooking(false);
        }
      };

      const handleLeagueRegistrationSubmit = async (e) => {
        e.preventDefault();
        if (regType === 'team' && !teamName.trim()) { showNotification('Team name required.', 'error'); return; }
        if (!repName.trim() || !repContact.trim()) { showNotification('Representative details required.', 'error'); return; }
        if (paymentMethod === 'gcash' && !gcashRef.trim()) { showNotification('GCash reference no. required.', 'error'); return; }

        setSubmittingLeague(true);
        try {
          const cleanTitle = activeModalLeague.course_program.replace('🏆 LEAGUE: ', '').replace(/\s*\(Fee:.*\)/i, '');
          const formattedDetails = `🏆 LEAGUE REGISTRATION (${regType.toUpperCase()}): ${cleanTitle}${regType === 'team' ? ` | Team: ${teamName.trim()}` : ''} | Rep: ${repName.trim()} (${repContact.trim()}) | Requirements: ${requirementImages.length} PSA/ID files | Pay: ${paymentMethod.toUpperCase()}${paymentMethod === 'gcash' ? ` [Ref: ${gcashRef.trim()}]` : ''}${rosterList ? ` | Roster: ${rosterList.trim()}` : ''}`;
          await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: formattedDetails, academic_year: requirementImages.length > 0 ? JSON.stringify(requirementImages) : '2026', semester: activeModalLeague.semester || 'TBD', status: 'Pending' });
          showNotification('League registration submitted successfully!', 'success');
          setActiveModalLeague(null);
          setTeamName(''); setRepName(''); setRepContact(''); setRosterList(''); setRequirementImages([]); setGcashRef('');
          fetchMyBookings();
        } catch (err) {
          showNotification('League registration error.', 'error');
        } finally {
          setSubmittingLeague(false);
        }
      };

      return (
        <div className="p-3 sm:p-4 flex-1 flex flex-col h-full overflow-hidden relative">
          {showLeagueCameraModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 p-4">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3"><h3 className="text-sm font-bold text-white">Capture ID</h3><button onClick={stopLeagueCamera} className="text-slate-400 font-bold">✕</button></div>
                <div className="w-full h-80 rounded-2xl bg-slate-950 overflow-hidden relative flex items-center justify-center"><video ref={leagueVideoRef} autoPlay playsInline className="w-full h-full object-cover"></video><canvas ref={leagueCanvasRef} className="hidden"></canvas></div>
                <button type="button" onClick={captureLeaguePhoto} className="w-full py-3 bg-brand-500 text-slate-950 font-bold text-xs rounded-xl">Capture Photo</button>
              </div>
            </div>
          )}

          {zoomedImage && <div onClick={() => setZoomedImage(null)} className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 p-4 cursor-zoom-out"><img src={zoomedImage} alt="Zoom" className="max-h-[80vh] object-contain rounded-2xl" /></div>}

          {/* 7-DAY MATRIX CALENDAR MODAL */}
          {selectedCourt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-3">
              <div className="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2"><h3 className="text-xs font-bold text-white">📅 Slot Matrix: {selectedCourt.name}</h3><button onClick={() => setSelectedCourt(null)} className="text-slate-400 font-bold">✕</button></div>
                
                <div className="flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs">
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() - 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-slate-800 rounded-lg text-slate-200">‹ Prev</button>
                  <span className="font-bold text-brand-400">Ormoc Court Timetable</span>
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() + 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-slate-800 rounded-lg text-slate-200">Next ›</button>
                </div>

                <div className="overflow-x-auto border border-slate-800 rounded-2xl bg-slate-950 p-2">
                  <table className="w-full text-left border-collapse text-[11px]">
                    <thead><tr><th className="p-2 border-b border-slate-800 text-slate-400">Time</th>{getSevenDays().map(d => <th key={d.dateStr} className="p-2 border-b border-slate-800 text-center text-white min-w-[90px]">{d.label}</th>)}</tr></thead>
                    <tbody>
                      {timeSlots.map(slotLabel => {
                        const time24 = slotTo24Hr(slotLabel);
                        return (
                          <tr key={slotLabel} className="border-b border-slate-900">
                            <td className="p-2 text-slate-400 font-mono text-[10px]">{slotLabel}</td>
                            {getSevenDays().map(d => {
                              const status = getSlotStatus(d.dateStr, time24);
                              const isChosen = selectedGridSlot?.date === d.dateStr && selectedGridSlot?.time === time24;
                              let bg = status === 'red' ? 'bg-red-500/10 text-red-400 opacity-75' : status === 'yellow' ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20';
                              if (isChosen) bg = 'bg-brand-500 text-slate-950 font-extrabold ring-2 ring-white';
                              return (
                                <td key={d.dateStr} className="p-1.5 text-center">
                                  <button type="button" onClick={() => { if (status !== 'red') setSelectedGridSlot({ date: d.dateStr, time: time24, label: slotLabel }); }} className={`w-full py-2 rounded-xl border text-[10px] font-bold ${bg}`}>
                                    {status === 'red' ? 'Booked' : status === 'yellow' ? 'Pending' : 'Available'}
                                  </button>
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {selectedGridSlot && (
                  <div className="p-3 bg-brand-500/10 border border-brand-500/40 rounded-2xl flex justify-between items-center text-xs">
                    <span className="text-brand-300 font-semibold">{selectedGridSlot.date} @ {selectedGridSlot.label}</span>
                    <button onClick={() => setShowDetailsModal(true)} className="px-4 py-2 bg-brand-500 text-slate-950 font-bold rounded-xl shadow">Confirm Reservation ›</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* RESERVATION DETAILS & PAYMENT MODAL */}
          {showDetailsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-4">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2"><h3 className="text-xs font-bold text-white">📝 Reservation Details & Payment</h3><button onClick={() => setShowDetailsModal(false)} className="text-slate-400 font-bold">✕</button></div>
                <form onSubmit={handleFinalReservationSubmit} className="space-y-3 text-xs">
                  <div><label className="text-slate-400">Your Name</label><input type="text" value={resName} onChange={e => setResName(e.target.value)} placeholder="Jhon Kenneth" className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white" /></div>
                  <div><label className="text-slate-400">Contact Number</label><input type="text" value={resContact} onChange={e => setResContact(e.target.value)} placeholder="09123456789" className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono" /></div>
                  <div><label className="text-slate-400 mb-1 block">Payment Method</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 font-bold"><button type="button" onClick={() => setResPayment('gcash')} className={`py-1.5 rounded-lg ${resPayment === 'gcash' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>GCash</button><button type="button" onClick={() => setResPayment('cash')} className={`py-1.5 rounded-lg ${resPayment === 'cash' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Cash</button></div></div>
                  {resPayment === 'gcash' && <div><input type="text" value={resGcashRef} onChange={e => setResGcashRef(e.target.value)} placeholder="GCash Ref No." className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white font-mono text-xs" /></div>}
                  <button type="submit" disabled={submittingBooking} className="w-full py-2.5 bg-brand-500 text-slate-950 font-bold rounded-xl shadow">Complete Reservation</button>
                </form>
              </div>
            </div>
          )}

          {/* LEAGUE REGISTRATION MODAL */}
          {activeModalLeague && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-4">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3.5 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2"><h3 className="text-xs font-bold text-white">🏆 Register for League</h3><button onClick={() => setActiveModalLeague(null)} className="text-slate-400 font-bold">✕</button></div>
                <form onSubmit={handleLeagueRegistrationSubmit} className="space-y-3 text-xs">
                  <div><label className="text-slate-400 mb-1 block">Mode</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 font-bold"><button type="button" onClick={() => setRegType('team')} className={`py-1.5 rounded-lg ${regType === 'team' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Team</button><button type="button" onClick={() => setRegType('solo')} className={`py-1.5 rounded-lg ${regType === 'solo' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Solo</button></div></div>
                  {regType === 'team' && (
                    <div className="space-y-2">
                      <div><label className="text-slate-400">Team Name</label><input type="text" value={teamName} onChange={e => setTeamName(e.target.value)} placeholder="Ormoc Ballers" className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white" /></div>
                      <div><label className="text-slate-400">Team Roster</label><textarea value={rosterList} onChange={e => setRosterList(e.target.value)} placeholder="Player 1, Player 2..." rows={2} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white" /></div>
                    </div>
                  )}
                  <div><label className="text-slate-400">Representative Name</label><input type="text" value={repName} onChange={e => setRepName(e.target.value)} placeholder="Name" className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white" /></div>
                  <div><label className="text-slate-400">Contact Number</label><input type="text" value={repContact} onChange={e => setRepContact(e.target.value)} placeholder="09123456789" className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono" /></div>
                  <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                    <label className="text-[10px] font-bold text-slate-300 block">Requirements: PSA / ID ({requirementImages.length})</label>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="file" accept="image/*" multiple onChange={handleRequirementFilesChange} className="w-full text-[10px] text-slate-300 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:bg-brand-500 file:text-slate-950 file:border-0" />
                      <button type="button" onClick={startLeagueCamera} className="py-2 bg-slate-800 text-brand-400 font-bold rounded-xl text-[10px]">📷 Camera</button>
                    </div>
                    {requirementImages.length > 0 && (
                      <div className="grid grid-cols-5 gap-1.5 max-h-24 overflow-y-auto">
                        {requirementImages.map((src, idx) => (
                          <div key={idx} className="relative h-12 rounded overflow-hidden border border-slate-700">
                            <img src={src} alt="ID" className="w-full h-full object-cover cursor-pointer" onClick={() => setZoomedImage(src)} />
                            <button type="button" onClick={() => removeRequirementImage(idx)} className="absolute top-0 right-0 bg-red-600 text-white w-4 h-4 text-[9px] font-bold">✕</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  <div><label className="text-slate-400 mb-1 block">Payment Method</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 font-bold"><button type="button" onClick={() => setPaymentMethod('gcash')} className={`py-1.5 rounded-lg ${paymentMethod === 'gcash' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>GCash</button><button type="button" onClick={() => setPaymentMethod('cash')} className={`py-1.5 rounded-lg ${paymentMethod === 'cash' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Cash</button></div></div>
                  {paymentMethod === 'gcash' && <div><input type="text" value={gcashRef} onChange={e => setGcashRef(e.target.value)} placeholder="GCash Ref No." className="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white font-mono" /></div>}
                  <button type="submit" disabled={submittingLeague} className="w-full py-2.5 bg-brand-500 text-slate-950 font-bold rounded-xl shadow-md">Confirm League Registration</button>
                </form>
              </div>
            </div>
          )}

          {playerNavTab === 'home' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col overflow-hidden">
              <h3 className="text-xs font-bold text-white mb-3">📋 My Bookings</h3>
              <div className="space-y-2 overflow-y-auto flex-1">
                {bookings.map(b => (
                  <div key={b.id} className="p-3 bg-slate-950 rounded-xl flex justify-between items-center text-xs">
                    <div><p className="font-bold text-white">{b.course_program}</p><p className="text-[10px] text-brand-400 font-mono">📅 {formatScheduleTo12Hour(b.semester)}</p></div>
                    <StatusBadge status={b.status} scheduleStr={b.semester} />
                  </div>
                ))}
              </div>
            </div>
          )}

          {playerNavTab === 'reservation' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col overflow-hidden">
              <h3 className="text-xs font-bold text-white mb-3">🏟️ Select Court for Matrix Reservation</h3>
              <div className="space-y-2.5 overflow-y-auto flex-1">
                {availableCourts.map(c => (
                  <div key={c.id} onClick={() => setSelectedCourt(c)} className="p-3 bg-slate-950 rounded-2xl border border-slate-800 hover:border-brand-500 cursor-pointer flex justify-between items-center text-xs">
                    <div><p className="font-bold text-white">{c.name}</p><p className="text-[10px] text-slate-400">📍 {c.location} • <span className="text-brand-400 font-semibold">₱{c.rate}/hr</span></p></div>
                    <span className="text-xs font-bold text-brand-400">Open Matrix ›</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {playerNavTab === 'leagues' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col overflow-hidden">
              <h3 className="text-xs font-bold text-white mb-3">🏆 Open Leagues</h3>
              <div className="space-y-2.5 overflow-y-auto flex-1">
                {openLeagues.map(l => (
                  <div key={l.id} className="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl flex justify-between items-center text-xs">
                    <div><p className="font-bold text-brand-400">{l.course_program}</p><p className="text-[10px] text-slate-400 font-mono">📅 {formatScheduleTo12Hour(l.semester)}</p></div>
                    <button onClick={() => setActiveModalLeague(l)} className="px-3 py-1.5 bg-brand-500 text-slate-950 font-extrabold rounded-lg shadow">Join</button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 6. COURT ORGANIZER DASHBOARD (WITH MATRIX CALENDAR & REQUEST COURT PAYMENT)
    // =========================================================================
    function OrganizerDashboard({ currentUser, showNotification, availableCourts, refreshCourts, activeNavTab }) {
      const [ligaTitle, setLigaTitle] = React.useState('');
      const [selectedSport, setSelectedSport] = React.useState('Basketball');
      const [selectedCourt, setSelectedCourt] = React.useState(availableCourts[0]?.name || '');
      const [ligaFee, setLigaFee] = React.useState('500');
      const [reserveDate, setReserveDate] = React.useState(new Date().toISOString().split('T')[0]);

      // Organizer Matrix Calendar states for Request Court
      const [selectedOrganizerCourt, setSelectedOrganizerCourt] = React.useState(null);
      const [calendarStartDate, setCalendarStartDate] = React.useState(new Date());
      const [allBookingsForMatrix, setAllBookingsForMatrix] = React.useState([]);
      const [selectedGridSlot, setSelectedGridSlot] = React.useState(null);

      // Organizer reservation details modal state (Name, Contact, Payment)
      const [showOrganizerDetailsModal, setShowOrganizerDetailsModal] = React.useState(false);
      const [orgResName, setOrgResName] = React.useState(currentUser?.full_name || '');
      const [orgResContact, setOrgResContact] = React.useState('');
      const [orgResPayment, setOrgResPayment] = React.useState('gcash');
      const [orgResGcashRef, setOrgResGcashRef] = React.useState('');
      const [submittingOrganizerBooking, setSubmittingOrganizerBooking] = React.useState(false);

      const [myProposals, setMyProposals] = React.useState([]);
      const [playerRequests, setPlayerRequests] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      const timeSlots = ["08:00 AM", "10:00 AM", "12:00 PM", "02:00 PM", "04:00 PM", "06:00 PM", "08:00 PM", "10:00 PM"];

      const slotTo24Hr = (slotStr) => {
        if (slotStr.includes('08:00 AM')) return '08:00';
        if (slotStr.includes('10:00 AM')) return '10:00';
        if (slotStr.includes('12:00 PM')) return '12:00';
        if (slotStr.includes('02:00 PM')) return '14:00';
        if (slotStr.includes('04:00 PM')) return '16:00';
        if (slotStr.includes('06:00 PM')) return '18:00';
        if (slotStr.includes('08:00 PM')) return '20:00';
        if (slotStr.includes('10:00 PM')) return '22:00';
        return '16:00';
      };

      React.useEffect(() => {
        fetchOrganizerData();
        fetchAllBookingsMatrix();
      }, []);

      const fetchAllBookingsMatrix = async () => {
        const { data } = await supabase.from('enrollments').select('*').in('status', ['Approved', 'dean_approved', 'submitted', 'Pending']);
        setAllBookingsForMatrix(data || []);
      };

      const fetchOrganizerData = async () => {
        setLoading(true);
        const { data: props } = await supabase.from('enrollments').select('*').eq('student_id', currentUser.id).order('submitted_at', { ascending: false });
        setMyProposals(props || []);

        const { data: reqs } = await supabase.from('enrollments').select('*').neq('student_id', currentUser.id).order('submitted_at', { ascending: false });
        if (reqs) {
          const studentIds = [...new Set(reqs.map(i => i.student_id).filter(Boolean))];
          let pMap = {};
          if (studentIds.length > 0) {
            const { data: pData } = await supabase.from('profiles').select('id, full_name, email').in('id', studentIds);
            if (pData) pData.forEach(p => { pMap[p.id] = p; });
          }
          setPlayerRequests(reqs.map(i => ({ ...i, profiles: pMap[i.student_id] || { full_name: 'Player', email: 'User' } })));
        }
        setLoading(false);
      };

      const handleCreateLiga = async (e) => {
        e.preventDefault();
        if (!ligaTitle.trim()) { showNotification('League title required.', 'error'); return; }
        const fullLigaName = `🏆 LEAGUE: [${selectedSport}] ${ligaTitle.trim()} @ ${selectedCourt || availableCourts[0]?.name} (Fee: ₱${ligaFee})`;
        const { error } = await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: fullLigaName, academic_year: '2026', semester: `Date: ${reserveDate}`, status: 'Approved' });
        if (error) showNotification(`Error: ${error.message}`, 'error');
        else { showNotification('League published successfully!', 'success'); setLigaTitle(''); fetchOrganizerData(); }
      };

      const getSevenDays = () => {
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(calendarStartDate);
          d.setDate(d.getDate() + i);
          days.push({ dateStr: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, label: `${d.toLocaleDateString('en-US', { weekday: 'short' })}, ${d.toLocaleDateString('en-US', { month: 'short' })} ${d.getDate()}` });
        }
        return days;
      };

      const getSlotStatus = (courtName, dateStr, time24) => {
        const match = allBookingsForMatrix.find(b => b.course_program.includes(courtName) && b.semester?.includes(dateStr) && b.semester?.includes(time24));
        if (!match) return 'green';
        if (match.status === 'Approved' || match.status === 'dean_approved') return 'red';
        return 'yellow';
      };

      const handleOrganizerFinalReservationSubmit = async (e) => {
        e.preventDefault();
        if (!selectedOrganizerCourt || !selectedGridSlot) return;
        if (!orgResName.trim() || !orgResContact.trim()) { showNotification('Name & contact required.', 'error'); return; }
        if (orgResPayment === 'gcash' && !orgResGcashRef.trim()) { showNotification('GCash reference no. required.', 'error'); return; }

        setSubmittingOrganizerBooking(true);
        try {
          const scheduleString = `${selectedGridSlot.date} @ ${selectedGridSlot.time}`;
          const formattedName = `${selectedOrganizerCourt.name} | Organizer: ${orgResName.trim()} (Contact: ${orgResContact.trim()}) | Pay: ${orgResPayment.toUpperCase()}${orgResPayment === 'gcash' ? ` [Ref: ${orgResGcashRef.trim()}]` : ''}`;
          
          await supabase.from('enrollments').insert({
            student_id: currentUser.id,
            course_program: formattedName,
            academic_year: '2026',
            semester: scheduleString,
            status: 'Pending',
          });

          showNotification('Court reservation request sent to Admin successfully!', 'success');
          safeAuditLog(currentUser, 'ORGANIZER_REQUEST_COURT', { court: selectedOrganizerCourt.name, schedule: scheduleString });
          setShowOrganizerDetailsModal(false);
          setSelectedGridSlot(null);
          setSelectedOrganizerCourt(null);
          setOrgResGcashRef('');
          fetchOrganizerData();
          fetchAllBookingsMatrix();
        } catch (err) {
          showNotification('Error requesting court reservation.', 'error');
        } finally {
          setSubmittingOrganizerBooking(false);
        }
      };

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-6">

          {/* ORGANIZER 7-DAY MATRIX CALENDAR MODAL */}
          {selectedOrganizerCourt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-3">
              <div className="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2"><h3 className="text-xs font-bold text-white">📅 Slot Matrix: {selectedOrganizerCourt.name}</h3><button onClick={() => setSelectedOrganizerCourt(null)} className="text-slate-400 font-bold">✕</button></div>
                
                <div className="flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs">
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() - 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-slate-800 rounded-lg text-slate-200">‹ Prev</button>
                  <span className="font-bold text-brand-400">Ormoc Court Timetable</span>
                  <button onClick={() => { const d = new Date(calendarStartDate); d.setDate(d.getDate() + 7); setCalendarStartDate(d); }} className="px-3 py-1 bg-slate-800 rounded-lg text-slate-200">Next ›</button>
                </div>

                <div className="overflow-x-auto border border-slate-800 rounded-2xl bg-slate-950 p-2">
                  <table className="w-full text-left border-collapse text-[11px]">
                    <thead><tr><th className="p-2 border-b border-slate-800 text-slate-400">Time</th>{getSevenDays().map(d => <th key={d.dateStr} className="p-2 border-b border-slate-800 text-center text-white min-w-[90px]">{d.label}</th>)}</tr></thead>
                    <tbody>
                      {timeSlots.map(slotLabel => {
                        const time24 = slotTo24Hr(slotLabel);
                        return (
                          <tr key={slotLabel} className="border-b border-slate-900">
                            <td className="p-2 text-slate-400 font-mono text-[10px]">{slotLabel}</td>
                            {getSevenDays().map(d => {
                              const status = getSlotStatus(selectedOrganizerCourt.name, d.dateStr, time24);
                              const isChosen = selectedGridSlot?.date === d.dateStr && selectedGridSlot?.time === time24;
                              let bg = status === 'red' ? 'bg-red-500/10 text-red-400 opacity-75' : status === 'yellow' ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20';
                              if (isChosen) bg = 'bg-brand-500 text-slate-950 font-extrabold ring-2 ring-white';
                              return (
                                <td key={d.dateStr} className="p-1.5 text-center">
                                  <button type="button" onClick={() => { if (status !== 'red') setSelectedGridSlot({ date: d.dateStr, time: time24, label: slotLabel }); }} className={`w-full py-2 rounded-xl border text-[10px] font-bold ${bg}`}>
                                    {status === 'red' ? 'Booked' : status === 'yellow' ? 'Pending' : 'Available'}
                                  </button>
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {selectedGridSlot && (
                  <div className="p-3 bg-brand-500/10 border border-brand-500/40 rounded-2xl flex justify-between items-center text-xs">
                    <span className="text-brand-300 font-semibold">{selectedGridSlot.date} @ {selectedGridSlot.label}</span>
                    <button onClick={() => setShowOrganizerDetailsModal(true)} className="px-4 py-2 bg-brand-500 text-slate-950 font-bold rounded-xl shadow">Confirm Reservation ›</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ORGANIZER RESERVATION DETAILS & PAYMENT MODAL */}
          {showOrganizerDetailsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-4">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2"><h3 className="text-xs font-bold text-white">📝 Court Request Details & Payment</h3><button onClick={() => setShowOrganizerDetailsModal(false)} className="text-slate-400 font-bold">✕</button></div>
                <form onSubmit={handleOrganizerFinalReservationSubmit} className="space-y-3 text-xs">
                  <div><label className="text-slate-400">Organizer Name</label><input type="text" value={orgResName} onChange={e => setOrgResName(e.target.value)} placeholder="Jhon Kenneth" className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white" /></div>
                  <div><label className="text-slate-400">Contact Number</label><input type="text" value={orgResContact} onChange={e => setOrgResContact(e.target.value)} placeholder="09123456789" className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono" /></div>
                  <div><label className="text-slate-400 mb-1 block">Payment Method</label><div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 font-bold"><button type="button" onClick={() => setOrgResPayment('gcash')} className={`py-1.5 rounded-lg ${orgResPayment === 'gcash' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>GCash</button><button type="button" onClick={() => setOrgResPayment('cash')} className={`py-1.5 rounded-lg ${orgResPayment === 'cash' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Cash</button></div></div>
                  {orgResPayment === 'gcash' && <div><input type="text" value={orgResGcashRef} onChange={e => setOrgResGcashRef(e.target.value)} placeholder="GCash Ref No." className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white font-mono text-xs" /></div>}
                  <button type="submit" disabled={submittingOrganizerBooking} className="w-full py-2.5 bg-brand-500 text-slate-950 font-bold rounded-xl shadow">Request Court Reservation</button>
                </form>
              </div>
            </div>
          )}

          {(activeNavTab === 'approvals' || activeNavTab === 'home') && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3">League Registrations & Approvals</h3>
                {loading ? <LoadingSpinner label="Loading..." /> : playerRequests.length === 0 ? <p className="text-xs text-slate-500 py-8 text-center">No pending requests.</p> : (
                  <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                    {playerRequests.map((req) => (
                      <div key={req.id} className="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl space-y-2 text-xs">
                        <div className="flex justify-between items-start">
                          <div><p className="font-bold text-white">{req.profiles?.full_name}</p><p className="text-[10px] text-slate-500">{req.profiles?.email}</p></div>
                          <StatusBadge status={req.status} scheduleStr={req.semester} />
                        </div>
                        <p className="font-bold text-brand-400">{req.course_program}</p>
                        <p className="text-[10px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(req.semester)}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3">My Leagues & Proposed Courts</h3>
                {loading ? <LoadingSpinner label="Loading..." /> : myProposals.length === 0 ? <p className="text-xs text-slate-500 py-8 text-center">No proposals created yet.</p> : (
                  <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                    {myProposals.map((item) => (
                      <div key={item.id} className="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl space-y-1 text-xs">
                        <p className="font-bold text-white">{item.course_program}</p>
                        <p className="text-[10px] text-brand-400 font-mono">📅 {formatScheduleTo12Hour(item.semester)}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {activeNavTab === 'create_league' && (
            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3">🏆 Create & Publish League</h3>
              <form onSubmit={handleCreateLiga} className="space-y-4 text-xs">
                <div><label className="text-xs font-bold text-slate-400 mb-1 block">League Name</label><input type="text" value={ligaTitle} onChange={e => setLigaTitle(e.target.value)} placeholder="Ormoc Basketball Cup" className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white" /></div>
                <div className="grid grid-cols-2 gap-3">
                  <div><label className="text-xs font-bold text-slate-400 mb-1 block">Sport</label><select value={selectedSport} onChange={e => setSelectedSport(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white"><option value="Basketball">Basketball</option><option value="Volleyball">Volleyball</option><option value="Badminton">Badminton</option></select></div>
                  <div><label className="text-xs font-bold text-slate-400 mb-1 block">Court</label><select value={selectedCourt} onChange={e => setSelectedCourt(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">{availableCourts.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}</select></div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div><label className="text-xs font-bold text-slate-400 mb-1 block">Registration Fee (₱)</label><input type="number" value={ligaFee} onChange={e => setLigaFee(e.target.value)} placeholder="500" className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white" /></div>
                  <div><label className="text-xs font-bold text-slate-400 mb-1 block">Tournament Date</label><input type="date" value={reserveDate} onChange={e => setReserveDate(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white" /></div>
                </div>
                <button type="submit" className="w-full py-3 bg-brand-500 text-slate-950 font-bold text-xs rounded-xl shadow-lg">Publish League</button>
              </form>
            </div>
          )}

          {activeNavTab === 'request_court' && (
            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3">🏟️ Request a Court Reservation (Slot Matrix)</h3>
              {availableCourts.length === 0 ? (
                <p className="text-xs text-slate-500 py-6 text-center">No approved courts available yet.</p>
              ) : (
                <div className="space-y-2.5">
                  {availableCourts.map(c => (
                    <div key={c.id} onClick={() => setSelectedOrganizerCourt(c)} className="p-3 bg-slate-950 rounded-2xl border border-slate-800 hover:border-brand-500 cursor-pointer flex justify-between items-center text-xs">
                      <div><p className="font-bold text-white">{c.name}</p><p className="text-[10px] text-slate-400">📍 {c.location} • <span className="text-brand-400 font-semibold">₱{c.rate}/hr</span></p></div>
                      <span className="text-xs font-bold text-brand-400">Open Matrix ›</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. ADMIN MANAGEMENT DESK
    // =========================================================================
    function AdminDashboard({ currentUser, showNotification, refreshCourts, activeSubTab, setActiveSubTab, availableCourts }) {
      const [pendingProposals, setPendingProposals] = React.useState([]);
      const [approvingItem, setApprovingItem] = React.useState(null);
      const [adminEndTime, setAdminEndTime] = React.useState('18:00');
      const [courtName, setCourtName] = React.useState('');
      const [courtLocation, setCourtLocation] = React.useState('Ormoc City');
      const [courtRate, setCourtRate] = React.useState('200');
      const [courtImagePreview, setCourtImagePreview] = React.useState('');
      const [addingCourt, setAddingCourt] = React.useState(false);

      React.useEffect(() => { fetchProposals(); }, []);

      const fetchProposals = async () => {
        const { data } = await supabase.from('enrollments').select('*').order('submitted_at', { ascending: false });
        setPendingProposals(data || []);
      };

      const handleCourtImageChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => setCourtImagePreview(event.target.result);
        reader.readAsDataURL(file);
      };

      const handleAddCourt = async (e) => {
        e.preventDefault();
        if (!courtName.trim()) return;
        setAddingCourt(true);
        try {
          const courtTag = `🏟️ NEW COURT PROPOSAL: ${courtName.trim()} (₱${courtRate}/hr) - Basketball @ ${courtLocation.trim()}`;
          await supabase.from('enrollments').insert({ student_id: currentUser.id, course_program: courtTag, academic_year: courtImagePreview || '2026', semester: `Loc: ${courtLocation.trim()}`, status: 'Approved' });
          showNotification('Court added successfully!', 'success');
          setCourtName('');
          setCourtImagePreview('');
          fetchProposals();
          if (refreshCourts) refreshCourts();
        } catch (err) {
          showNotification('Error adding court.', 'error');
        } finally {
          setAddingCourt(false);
        }
      };

      const handleConfirmApprovalWithEndTime = async (e) => {
        e.preventDefault();
        if (!approvingItem) return;

        const updatedSemester = `${approvingItem.semester} to ${adminEndTime}`;
        const { error } = await supabase.from('enrollments').update({ status: 'Approved', semester: updatedSemester }).eq('id', approvingItem.id);

        if (error) {
          showNotification(`Approval failed: ${error.message}`, 'error');
        } else {
          showNotification('Court reservation approved with End Time set!', 'success');
          setApprovingItem(null);
          fetchProposals();
          if (refreshCourts) refreshCourts();
        }
      };

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-6">
          {approvingItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-4 animate-fade-in">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2.5">
                  <h3 className="text-xs font-bold text-white flex items-center gap-1.5"><span>⏰</span> Set End Time for Reservation</h3>
                  <button onClick={() => setApprovingItem(null)} className="text-slate-400 font-bold text-xs">✕</button>
                </div>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-1">
                  <p className="font-bold text-brand-400">🏟️ {approvingItem.course_program}</p>
                  <p className="text-[10px] text-slate-300 font-mono">Start: {formatScheduleTo12Hour(approvingItem.semester)}</p>
                </div>
                <form onSubmit={handleConfirmApprovalWithEndTime} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-400 mb-1">Reservation End Time (e.g., 18:00 becomes 06:00 PM)</label>
                    <input type="time" value={adminEndTime} onChange={e => setAdminEndTime(e.target.value)} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 cursor-pointer" />
                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button type="button" onClick={() => setApprovingItem(null)} className="py-2.5 px-3 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                    <button type="submit" className="py-2.5 bg-brand-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg">Confirm & Approve</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {(activeSubTab === 'dashboard' || activeSubTab === 'home') && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3 flex justify-between items-center">
                <span>🏟️ Court Reservation Approvals</span>
                <button onClick={fetchProposals} className="text-xs text-brand-400 hover:underline">Refresh</button>
              </h3>

              {pendingProposals.filter(p => !p.course_program.includes('NEW COURT PROPOSAL') && !p.course_program.includes('LEAGUE')).length === 0 ? (
                <p className="text-xs text-slate-500 py-6 text-center">Walang pending na request para sa mga court.</p>
              ) : (
                <div className="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                  {pendingProposals.filter(p => !p.course_program.includes('NEW COURT PROPOSAL') && !p.course_program.includes('LEAGUE')).map(req => (
                    <div key={req.id} className="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl space-y-2 text-xs">
                      <div className="flex justify-between items-start">
                        <p className="font-bold text-brand-400">{req.course_program}</p>
                        <StatusBadge status={req.status} scheduleStr={req.semester} />
                      </div>
                      <p className="text-[10px] text-slate-300 font-mono">📅 Schedule: {formatScheduleTo12Hour(req.semester)}</p>
                      {(req.status === 'submitted' || req.status === 'Pending') && (
                        <button onClick={() => setApprovingItem(req)} className="w-full py-2 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold rounded-xl text-xs shadow active:scale-95 transition-all">Set End Time & Approve</button>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeSubTab === 'courts' && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3">🏟️ Added Courts Management</h3>
              {availableCourts.length === 0 ? (
                <p className="text-xs text-slate-500 py-6 text-center">No courts added yet.</p>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {availableCourts.map(c => (
                    <div key={c.id} className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-2 text-xs">
                      {c.image && <div className="w-full h-32 rounded-lg overflow-hidden border border-slate-800"><img src={c.image} alt={c.name} className="w-full h-full object-cover" /></div>}
                      <p className="font-bold text-brand-400">{c.name}</p>
                      <p className="text-[10px] text-slate-400">📍 {c.location} • ₱{c.rate}/hr</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {activeSubTab === 'add_court' && (
            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3">🏟️ Add a Court Facility</h3>
              <form onSubmit={handleAddCourt} className="space-y-4 text-xs">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Court Name</label>
                  <input type="text" value={courtName} onChange={e => setCourtName(e.target.value)} placeholder="Ormoc City Sports Complex" className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">Rate (₱/hr)</label>
                    <input type="number" value={courtRate} onChange={e => setCourtRate(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1">Location</label>
                    <input type="text" value={courtLocation} onChange={e => setCourtLocation(e.target.value)} className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Court Picture</label>
                  <input type="file" accept="image/*" onChange={handleCourtImageChange} className="w-full text-xs text-slate-300" />
                </div>
                {courtImagePreview && (
