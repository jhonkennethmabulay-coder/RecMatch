              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                <h3 className="text-sm font-bold text-white flex items-center justify-between border-b border-slate-800 pb-3">
                  <span>League Registrations & Approvals</span>
                </h3>

                {loading ? (
                  <LoadingSpinner label="Fetching player requests..." />
                ) : playerRequests.length === 0 ? (
                  <p className="text-xs text-slate-500 py-8 text-center">No player league registration requests pending review.</p>
                ) : (
                  <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                    {playerRequests.map((req) => {
                      let reqImgs = [];
                      try {
                        if (req.academic_year && req.academic_year.startsWith('[')) {
                          reqImgs = JSON.parse(req.academic_year);
                        }
                      } catch (e) {}

                      return (
                        <div key={req.id} className="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl space-y-2.5">
                          <div className="flex justify-between items-start">
                            <div>
                              <p className="font-bold text-xs text-white">{req.profiles?.full_name || 'Player'}</p>
                              <p className="text-[10px] text-slate-500">{req.profiles?.email}</p>
                            </div>
                            <StatusBadge status={req.status} scheduleStr={req.semester} />
                          </div>

                          <p className="text-xs font-bold text-brand-400">{req.course_program}</p>
                          <p className="text-[10px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(req.semester)}</p>

                          {reqImgs.length > 0 && (
                            <div className="space-y-1">
                              <p className="text-[10px] text-slate-400 font-bold">Attached Requirements ({reqImgs.length} images):</p>
                              <div className="grid grid-cols-6 gap-1 max-h-24 overflow-y-auto p-1 bg-slate-900 rounded-lg border border-slate-800">
                                {reqImgs.map((imgSrc, i) => (
                                  <div key={i} className="w-full h-10 rounded overflow-hidden border border-slate-700">
                                    <img src={imgSrc} alt={`Req ${i}`} className="w-full h-full object-cover" />
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}

                          {(req.status === 'submitted' || req.status === 'Pending') && (
                            <div className="grid grid-cols-2 gap-2 pt-1">
                              <button
                                onClick={() => handleOrganizerApprove(req.id, 'Approved')}
                                className="py-2 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold rounded-xl text-xs active:scale-95 shadow"
                              >
                                Approve
                              </button>
                              <button
                                onClick={() => handleOrganizerApprove(req.id, 'Declined')}
                                className="py-2 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-bold rounded-xl text-xs active:scale-95"
                              >
                                Decline
                              </button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                <h3 className="text-sm font-bold text-white flex items-center justify-between border-b border-slate-800 pb-3">
                  <span>Leagues & Proposed Courts</span>
                </h3>

                {loading ? (
                  <LoadingSpinner label="Fetching proposals..." />
                ) : myProposals.length === 0 ? (
                  <p className="text-xs text-slate-500 py-8 text-center">No leagues or court proposals created yet.</p>
                ) : (
                  <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                    {myProposals.map((item) => {
                      let imgData = item.academic_year && item.academic_year.startsWith('data:image') ? item.academic_year : null;
                      if (!imgData && item.academic_year && item.academic_year.startsWith('[')) {
                        try {
                          const parsed = JSON.parse(item.academic_year);
                          if (parsed.length > 0) imgData = parsed[0];
                        } catch (e) {}
                      }

                      return (
                        <div key={item.id} className="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl space-y-2.5">
                          <div className="flex justify-between items-start gap-2">
                            <p className="font-bold text-xs text-white leading-tight flex-1">{item.course_program}</p>
                            <StatusBadge status={item.status} scheduleStr={item.semester} />
                          </div>

                          {imgData && (
                            <div className="w-full h-36 rounded-xl bg-slate-900 overflow-hidden border border-slate-800 shadow-md">
                              <img src={imgData} alt="Proposal Attachment" className="w-full h-full object-cover" />
                            </div>
                          )}

                          <div className="flex items-center justify-between pt-1">
                            <span className="text-[11px] text-brand-400 font-mono">📅 {formatScheduleTo12Hour(item.semester) || 'Active'}</span>
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => openEditModal(item)}
                                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-brand-400 text-xs font-bold rounded-xl transition-all shadow"
                              >
                                Edit / Image
                              </button>
                              <button
                                onClick={() => handleDeleteItem(item.id, item.course_program)}
                                className="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs font-bold rounded-xl transition-all shadow"
                              >
                                Delete
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {activeNavTab === 'create_league' && (
            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                <span>🏆</span> Create & Publish League
              </h3>

              <form onSubmit={handleCreateLiga} className="space-y-4 text-xs">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1.5">League Name</label>
                  <input
                    type="text"
                    value={ligaTitle}
                    onChange={(e) => setLigaTitle(e.target.value)}
                    placeholder="e.g., Ormoc Inter-Barangay Basketball Cup"
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Select Sport</label>
                    <select
                      value={selectedSport}
                      onChange={(e) => setSelectedSport(e.target.value)}
                      className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                    >
                      {sportOptions.map((sport) => (
                        <option key={sport} value={sport}>{sport}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Select Court</label>
                    <select
                      value={selectedCourt}
                      onChange={(e) => setSelectedCourt(e.target.value)}
                      className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                    >
                      {availableCourts.length === 0 ? (
                        <option value="">No courts available</option>
                      ) : (
                        availableCourts.map((c) => (
                          <option key={c.id} value={c.name}>
                            {c.name}
                          </option>
                        ))
                      )}
                    </select>
                  </div>
                </div>

                {selectedSport === 'Other' && (
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Specify Custom Sport</label>
                    <input
                      type="text"
                      value={customSport}
                      onChange={(e) => setCustomSport(e.target.value)}
                      placeholder="e.g., Sepak Takraw, Dodgeball..."
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                    />
                  </div>
                )}

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Registration Fee (₱)</label>
                    <input
                      type="number"
                      value={ligaFee}
                      onChange={(e) => setLigaFee(e.target.value)}
                      placeholder="100"
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Tournament Date</label>
                    <input
                      type="date"
                      value={reserveDate}
                      onChange={(e) => setReserveDate(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 cursor-pointer"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1.5">League Banner / Picture (HD)</label>
                  <div className="grid grid-cols-2 gap-3">
                    <input
                      type="file"
                      accept="image/*,.pdf"
                      onChange={(e) => handleFileChange(e, 'liga')}
                      className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-300 outline-none file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-brand-500 file:text-slate-950 hover:file:bg-brand-400 cursor-pointer"
                    />
                    <button
                      type="button"
                      onChange={(e) => handleFileChange(e, 'liga')}
                      onClick={() => startCamera('liga')}
                      className="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-brand-400 border border-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow"
                    >
                      <span>📷</span> HD Camera
                    </button>
                  </div>
                </div>

                {ligaImagePreview && (
                  <div className="w-full h-40 rounded-2xl bg-slate-950 border border-slate-800 overflow-hidden relative shadow-md">
                    <img src={ligaImagePreview} alt="League Preview" className="w-full h-full object-cover" />
                    <span className="absolute bottom-2 right-2 px-2.5 py-1 bg-slate-900/95 text-[10px] text-brand-400 font-mono rounded-lg">HD Preview</span>
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full py-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg active:scale-95"
                >
                  Publish League
                </button>
              </form>
            </div>
          )}

          {activeNavTab === 'request_court' && (
            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                <span>🏟️</span> Request a Court Reservation
              </h3>

              <form onSubmit={handleRequestCourt} className="space-y-4 text-xs">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1.5">Select Court</label>
                  <select
                    value={selectedCourt || availableCourts[0]?.name || ''}
                    onChange={(e) => setSelectedCourt(e.target.value)}
                    disabled={availableCourts.length === 0}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 disabled:opacity-50"
                  >
                    {availableCourts.length === 0 ? (
                      <option value="">No courts available</option>
                    ) : (
                      availableCourts.map((court) => (
                        <option key={court.id} value={court.name}>{court.name} - ₱{court.rate}/hr</option>
                      ))
                    )}
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Reservation Date</label>
                    <input
                      type="date"
                      value={courtRequestDate}
                      onChange={(e) => setCourtRequestDate(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 cursor-pointer"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Time Slot</label>
                    <input
                      type="time"
                      value={courtRequestTime}
                      onChange={(e) => setCourtRequestTime(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 cursor-pointer"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1.5">Payment Method</label>
                  <div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 text-xs font-bold">
                    <button
                      type="button"
                      onClick={() => setCourtPaymentMethod('gcash')}
                      className={`py-2 rounded-lg transition-all ${courtPaymentMethod === 'gcash' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
                    >
                      📱 GCash Online
                    </button>
                    <button
                      type="button"
                      onClick={() => setCourtPaymentMethod('cash')}
                      className={`py-2 rounded-lg transition-all ${courtPaymentMethod === 'cash' ? 'bg-brand-500 text-slate-950 font-extrabold' : 'text-slate-400'}`}
                    >
                      💵 On-Site Cash
                    </button>
                  </div>
                </div>

                {courtPaymentMethod === 'gcash' && (
                  <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-slate-400">GCash Account Number:</span>
                      <span className="text-brand-400 font-mono font-bold">0917-123-4567</span>
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-400 mb-1">GCash Reference Number</label>
                      <input
                        type="text"
                        value={courtGcashRef}
                        onChange={(e) => setCourtGcashRef(e.target.value)}
                        placeholder="Enter 13-digit Ref No."
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500 font-mono"
                      />
                    </div>
                  </div>
                )}

                <button
                  type="submit"
                  disabled={!availableCourts.length || submittingCourtRequest}
                  className="w-full py-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50"
                >
                  {submittingCourtRequest ? 'Submitting...' : 'Request Court Reservation'}
                </button>
              </form>
            </div>
          )}

          {activeNavTab === 'profile' && (
            <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <div className="flex items-center gap-3.5 border-b border-slate-800 pb-4">
                <div className="w-12 h-12 rounded-2xl bg-brand-500/10 border border-brand-500/25 flex items-center justify-center p-1.5">
                  <MapPinLogo className="w-9 h-9" />
                </div>
                <div>
                  <h3 className="text-sm font-bold text-white">{currentUser?.full_name}</h3>
                  <p className="text-xs text-brand-400 capitalize font-mono">{currentUser?.role}</p>
                </div>
              </div>

              <div className="space-y-3 text-xs">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Email Address</label>
                  <input
                    type="text"
                    disabled
                    value={currentUser?.email || ''}
                    className="w-full px-3.5 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-xs text-slate-400 font-mono outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Role</label>
                  <input
                    type="text"
                    disabled
                    value={currentUser?.role || 'Organizer'}
                    className="w-full px-3.5 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-xs text-slate-400 font-mono outline-none"
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7. ADMIN LIGA & COURT PROPOSAL APPROVAL DESK
    // =========================================================================
    function AdminDashboard({ currentUser, showNotification, refreshCourts, activeSubTab, setActiveSubTab }) {
      const [pendingProposals, setPendingProposals] = React.useState([]);
      const [totalAccountsCount, setTotalAccountsCount] = React.useState(0);
      const [logs, setLogs] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [courtName, setCourtName] = React.useState('');
      const [courtLocation, setCourtLocation] = React.useState('Ormoc City');
      const [courtRate, setCourtRate] = React.useState('200');
      const [courtImagePreview, setCourtImagePreview] = React.useState('');
      const [addingCourt, setAddingCourt] = React.useState(false);

      React.useEffect(() => {
        fetchProposals();
        fetchAuditLogs();
      }, []);

      const fetchProposals = async () => {
        setLoading(true);
        
        const { data: rawEnrollments, error } = await supabase
          .from('enrollments')
          .select('*')
          .order('submitted_at', { ascending: false });

        const { count: profilesCount } = await supabase
          .from('profiles')
          .select('*', { count: 'exact', head: true });

        setTotalAccountsCount(profilesCount || 0);

        if (error || !rawEnrollments) {
          setPendingProposals([]);
          setLoading(false);
          return;
        }

        const studentIds = [...new Set(rawEnrollments.map(item => item.student_id).filter(Boolean))];
        let profilesMap = {};

        if (studentIds.length > 0) {
          const { data: profilesData } = await supabase
            .from('profiles')
            .select('id, full_name, email')
            .in('id', studentIds);

          if (profilesData) {
            profilesData.forEach(p => {
              profilesMap[p.id] = p;
            });
          }
        }

        const formattedProposals = rawEnrollments.map(item => ({
          ...item,
          profiles: profilesMap[item.student_id] || { full_name: 'Organizer / User', email: 'Registered User' }
        }));

        setPendingProposals(formattedProposals);
        setLoading(false);
      };

      const fetchAuditLogs = async () => {
        const { data } = await supabase
          .from('audit_logs')
          .select('*')
          .order('created_at', { ascending: false });

        setLogs(data || []);
      };

      const handleAdminApprove = async (id, status) => {
        const { error } = await supabase
          .from('enrollments')
          .update({ status: status })
          .eq('id', id)
          .select();

        if (error) {
          showNotification(`Approval error: ${error.message}`, 'error');
        } else {
          showNotification(`Proposal ${status === 'Approved' ? 'Approved' : 'Declined'} successfully!`, 'success');
          safeAuditLog(currentUser, 'ADMIN_DECISION', { proposal_id: id, status: status });
          fetchProposals();
          if (refreshCourts) refreshCourts();
        }
      };

      const handleCourtImageChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          showNotification('Please choose an image file.', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const image = new Image();
          image.onload = () => {
            const scale = Math.min(1, 900 / image.width, 700 / image.height);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            const context = canvas.getContext('2d');
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            setCourtImagePreview(canvas.toDataURL('image/jpeg', 0.9));
          };
          image.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleAddCourt = async (e) => {
        e.preventDefault();
        const rate = Number(courtRate);

        if (!courtName.trim() || !courtLocation.trim()) {
          showNotification('Court name and location are required.', 'error');
          return;
        }

        if (!Number.isFinite(rate) || rate < 0) {
          showNotification('Please enter a valid hourly rate.', 'error');
          return;
        }

        setAddingCourt(true);
        try {
          const courtTag = `🏟️ NEW COURT PROPOSAL: ${courtName.trim()} (₱${rate}/hr) - Basketball @ ${courtLocation.trim()}`;
          const { error } = await supabase.from('enrollments').insert({
            student_id: currentUser.id,
            course_program: courtTag,
            academic_year: courtImagePreview || '2026',
            semester: `Loc: ${courtLocation.trim()} | Admin-managed court`,
            status: 'Approved',
          });

          if (error) {
            showNotification(`Court could not be added: ${error.message}`, 'error');
          } else {
            showNotification(`${courtName.trim()} is now available for reservations.`, 'success');
            safeAuditLog(currentUser, 'ADD_COURT', { court_name: courtName.trim(), location: courtLocation.trim(), hourly_rate: rate });
            setCourtName('');
            setCourtLocation('Ormoc City');
            setCourtRate('200');
            setCourtImagePreview('');
            fetchProposals();
            if (refreshCourts) refreshCourts();
          }
        } catch (err) {
          showNotification('Error adding court.', 'error');
        } finally {
          setAddingCourt(false);
        }
      };

      const pendingCount = pendingProposals.filter(p => p.status === 'submitted' || p.status === 'Pending').length;
      const courtProposalsList = pendingProposals.filter(p => p.course_program.includes('🏟️ NEW COURT PROPOSAL'));
      const leagueRegistrationsList = pendingProposals.filter(p => p.course_program.includes('🏆 LEAGUE') || (!p.course_program.includes('🏟️ NEW COURT PROPOSAL') && p.status !== 'Approved' && p.status !== 'dean_approved'));

      return (
        <div className="p-4 sm:p-6 max-w-6xl mx-auto w-full space-y-6">

          {(activeSubTab === 'approvals' || activeSubTab === 'home') && (
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex items-center gap-3.5 shadow-md">
                <div className="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/20 text-brand-400 flex items-center justify-center font-bold text-lg">
                  👥
                </div>
                <div>
                  <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Accounts</p>
                  <p className="text-xl font-extrabold text-white">{totalAccountsCount}</p>
                </div>
              </div>

              <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex items-center gap-3.5 shadow-md">
                <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg">
                  ⏳
                </div>
                <div>
                  <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pending Approvals</p>
                  <p className="text-xl font-extrabold text-white">{pendingCount}</p>
                </div>
              </div>

              <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex items-center gap-3.5 shadow-md">
                <div className="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-lg">
                  🏟️
                </div>
                <div>
                  <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Courts & Proposals</p>
                  <p className="text-xl font-extrabold text-white">{courtProposalsList.length}</p>
                </div>
              </div>
            </div>
          )}

          {activeSubTab === 'add_court' && (
            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                <span>🏟️</span> Add a Court
              </h3>

              <form onSubmit={handleAddCourt} className="space-y-4 text-xs">
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1.5">Court / Facility Name</label>
                  <input
                    type="text"
                    value={courtName}
                    onChange={(e) => setCourtName(e.target.value)}
                    placeholder="e.g., Ormoc City Sports Complex"
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-brand-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Hourly Rate (₱)</label>
                    <input
                      type="number"
                      min="0"
                      step="1"
                      value={courtRate}
                      onChange={(e) => setCourtRate(e.target.value)}
                      placeholder="200"
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-400 mb-1.5">Location</label>
                    <input
                      type="text"
                      value={courtLocation}
                      onChange={(e) => setCourtLocation(e.target.value)}
                      placeholder="e.g., Ormoc City"
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1.5">Court Picture</label>
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleCourtImageChange}
                    className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-300 outline-none file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-brand-500 file:text-slate-950 hover:file:bg-brand-400 cursor-pointer"
                  />
                </div>

                {courtImagePreview && (
                  <div className="w-full h-40 rounded-2xl bg-slate-950 border border-slate-800 overflow-hidden">
                    <img src={courtImagePreview} alt="Court preview" className="w-full h-full object-cover" />
                  </div>
                )}

                <button
                  type="submit"
                  disabled={addingCourt}
                  className="w-full py-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50"
                >
                  {addingCourt ? 'Adding Court...' : 'Add Court'}
                </button>
              </form>
            </div>
          )}

          {activeSubTab === 'approvals' && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3 flex items-center justify-between">
                <span>League & Court Reservation Requests</span>
                <span className="px-2.5 py-1 bg-brand-500/10 border border-brand-500/20 text-brand-400 text-[10px] font-bold rounded-lg">
                  {leagueRegistrationsList.length} Entries
                </span>
              </h3>

              {loading ? (
                <LoadingSpinner label="Fetching registrations..." />
              ) : leagueRegistrationsList.length === 0 ? (
                <p className="text-xs text-slate-500 py-8 text-center">No league registrations pending review.</p>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[500px] overflow-y-auto pr-1">
                  {leagueRegistrationsList.map((item) => {
                    let reqImgs = [];
                    try {
                      if (item.academic_year && item.academic_year.startsWith('[')) {
                        reqImgs = JSON.parse(item.academic_year);
                      }
                    } catch (e) {}

                    return (
                      <div key={item.id} className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3 shadow-inner">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold text-xs text-white">{item.profiles?.full_name || 'User'}</p>
                            <p className="text-[10px] text-slate-500">{item.profiles?.email}</p>
                          </div>
                          <StatusBadge status={item.status} scheduleStr={item.semester} />
                        </div>
                        
                        <p className="text-xs font-bold text-brand-400 leading-snug">{item.course_program}</p>
                        <p className="text-[11px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(item.semester) || 'Date Unspecified'}</p>

                        {reqImgs.length > 0 && (
                          <div className="space-y-1">
                            <p className="text-[10px] text-slate-400 font-bold">Attached Requirements ({reqImgs.length} images):</p>
                            <div className="grid grid-cols-6 gap-1 max-h-24 overflow-y-auto p-1 bg-slate-900 rounded-lg border border-slate-800">
                              {reqImgs.map((imgSrc, i) => (
                                <div key={i} className="w-full h-10 rounded overflow-hidden border border-slate-700">
                                  <img src={imgSrc} alt={`Req ${i}`} className="w-full h-full object-cover" />
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        {(item.status === 'submitted' || item.status === 'Pending') && (
                          <div className="grid grid-cols-2 gap-2 pt-1">
                            <button
                              onClick={() => handleAdminApprove(item.id, 'Approved')}
                              className="py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold rounded-xl text-xs active:scale-95 shadow"
                            >
                              Approve
                            </button>
                            <button
                              onClick={() => handleAdminApprove(item.id, 'Declined')}
                              className="py-2.5 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-bold rounded-xl text-xs active:scale-95 shadow"
                            >
                              Decline
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {activeSubTab === 'court_approvals' && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3 flex items-center justify-between">
                <span>🏟️ Courts & Proposals</span>
                <span className="px-2.5 py-1 bg-brand-500/10 border border-brand-500/20 text-brand-400 text-[10px] font-bold rounded-lg">
                  {courtProposalsList.length} Proposals
                </span>
              </h3>

              {loading ? (
                <LoadingSpinner label="Fetching court proposals..." />
              ) : courtProposalsList.length === 0 ? (
                <p className="text-xs text-slate-500 py-8 text-center">No courts or proposals available yet.</p>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[500px] overflow-y-auto pr-1">
                  {courtProposalsList.map((item) => {
                    const imgData = item.academic_year && item.academic_year.startsWith('data:image') ? item.academic_year : null;

                    return (
                      <div key={item.id} className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3 shadow-inner">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold text-xs text-white">{item.profiles?.full_name || 'Organizer'}</p>
                            <p className="text-[10px] text-slate-500">{item.profiles?.email}</p>
                          </div>
                          <StatusBadge status={item.status} scheduleStr={item.semester} />
                        </div>
                        
                        <p className="text-xs font-bold text-brand-400 leading-snug">{item.course_program}</p>
                        
                        {imgData && (
                          <div className="w-full h-40 rounded-xl bg-slate-900 border border-slate-800 overflow-hidden shadow-md">
                            <img src={imgData} alt="Court Proposal" className="w-full h-full object-cover" />
                          </div>
                        )}

                        <p className="text-[11px] text-slate-300 font-mono">📅 {formatScheduleTo12Hour(item.semester) || 'Date Unspecified'}</p>

                        {(item.status === 'submitted' || item.status === 'Pending') && (
                          <div className="grid grid-cols-2 gap-2 pt-1">
                            <button
                              onClick={() => handleAdminApprove(item.id, 'Approved')}
                              className="py-2.5 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold rounded-xl text-xs active:scale-95 shadow"
                            >
                              Approve Court
                            </button>
                            <button
                              onClick={() => handleAdminApprove(item.id, 'Declined')}
                              className="py-2.5 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-bold rounded-xl text-xs active:scale-95 shadow"
                            >
                              Decline
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {activeSubTab === 'logs' && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-2xl">
              <h3 className="text-sm font-bold text-white border-b border-slate-800 pb-3 flex justify-between items-center">
                <span>🛡️ System Security Audit Logs</span>
                <button onClick={fetchAuditLogs} className="text-xs text-brand-400 hover:underline">Refresh Logs</button>
              </h3>

              <div className="space-y-2.5 max-h-[500px] overflow-y-auto pr-1">
                {logs.map((log) => (
                  <div key={log.id} className="p-3.5 bg-slate-950 border border-slate-800 rounded-2xl space-y-1 font-mono text-xs">
                    <div className="flex justify-between text-slate-400 text-[11px]">
                      <span>{new Date(log.created_at).toLocaleString()}</span>
                      <span className="text-brand-400 font-bold">{log.action}</span>
                    </div>
                    <p className="text-white font-sans text-xs">{log.user_email || 'System'}</p>
                    <p className="text-slate-500 text-[10px] truncate">{JSON.stringify(log.details)}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 7.5 USER PROFILE VIEW
    // =========================================================================
    function UserProfileView({ currentUser, showNotification }) {
      const [fullName, setFullName] = React.useState(currentUser?.full_name || '');
      const [updating, setUpdating] = React.useState(false);

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        if (!fullName.trim()) {
          showNotification('Full name cannot be empty.', 'error');
          return;
        }

        setUpdating(true);
        try {
          const { error } = await supabase
            .from('profiles')
            .upsert({
              id: currentUser.id,
              full_name: fullName.trim(),
              email: currentUser.email,
              role: currentUser.role
            }, { onConflict: 'id' });

          if (error) {
            showNotification(`Update failed: ${error.message}`, 'error');
          } else {
            currentUser.full_name = fullName.trim();
            showNotification('Profile updated successfully!', 'success');
            safeAuditLog(currentUser, 'UPDATE_PROFILE', { updated_name: fullName.trim() });
          }
        } catch (err) {
          showNotification('Profile update error.', 'error');
        } finally {
          setUpdating(false);
        }
      };

      return (
        <div className="p-4 sm:p-6 max-w-md mx-auto w-full space-y-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-2xl">
            <div className="flex items-center gap-3.5 border-b border-slate-800 pb-4">
              <div className="w-12 h-12 rounded-2xl bg-brand-500/10 border border-brand-500/25 flex items-center justify-center p-1.5">
                <MapPinLogo className="w-9 h-9" />
              </div>
              <div>
                <h3 className="text-sm font-bold text-white">{currentUser?.full_name}</h3>
                <p className="text-xs text-brand-400 capitalize font-mono">{currentUser?.role}</p>
              </div>
            </div>

            <form onSubmit={handleUpdateProfile} className="space-y-4 text-xs">
              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">Email Address (Read-only)</label>
                <input
                  type="text"
                  disabled
                  value={currentUser?.email || ''}
                  className="w-full px-3.5 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-xs text-slate-400 font-mono outline-none cursor-not-allowed"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">Full Name</label>
                <input
                  type="text"
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-brand-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">Account Role</label>
                <input
                  type="text"
                  disabled
                  value={currentUser?.role || 'Player / User'}
                  className="w-full px-3.5 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-xs text-slate-400 font-mono outline-none cursor-not-allowed"
                />
              </div>

              <button
                type="submit"
                disabled={updating}
                className="w-full py-3 bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-md active:scale-95 disabled:opacity-50"
              >
                {updating ? 'Saving Profile...' : 'Save Profile Changes'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. MAIN APP SHELL & NAVIGATION
    // =========================================================================
    function App() {
      const [currentUser, setCurrentUser] = React.useState(null);
      const [activeNavTab, setActiveNavTab] = React.useState('home');
      const [notification, setNotification] = React.useState({ message: '', type: 'info' });
      const [showLogoutModal, setShowLogoutModal] = React.useState(false);
      const [availableCourts, setAvailableCourts] = React.useState([]);

      // Responsive screen detector (Desktop vs Mobile)
      const [isDesktopView, setIsDesktopView] = React.useState(window.innerWidth >= 768);

      React.useEffect(() => {
        const handleResize = () => {
          setIsDesktopView(window.innerWidth >= 768);
        };
        window.addEventListener('resize', handleResize);
        fetchApprovedCustomCourts();
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const fetchApprovedCustomCourts = async () => {
        const { data } = await supabase
          .from('enrollments')
          .select('*')
          .in('status', ['dean_approved', 'Approved'])
          .like('course_program', '%NEW COURT PROPOSAL%');

        if (data && data.length > 0) {
          const customCourts = data.map((item) => {
            let pureName = item.course_program.replace('🏟️ NEW COURT PROPOSAL: ', '');
            if (pureName.includes(' (₱')) {
              pureName = pureName.split(' (₱')[0];
            }

            const rateMatch = item.course_program.match(/₱(\d+)\/hr/);
            const rateVal = rateMatch ? parseInt(rateMatch[1], 10) : 150;

            const locMatch = item.course_program.match(/@\s*(.*)$/);
            const locVal = locMatch ? locMatch[1].trim() : 'Ormoc City';

            const imgData = item.academic_year && item.academic_year.startsWith('data:image') ? item.academic_year : null;

            return {
              id: `approved_court_${item.id}`,
              name: pureName.trim(),
              sport: 'Basketball',
              rate: rateVal,
              location: locVal,
              image: imgData
            };
          });

          setAvailableCourts(customCourts);
        } else {
          setAvailableCourts([]);
        }
      };

      const showNotification = (message, type = 'info') => {
        setNotification({ message, type });
      };

      const clearNotification = () => {
        setNotification({ message: '', type: 'info' });
      };

      const handleConfirmLogout = async () => {
        await supabase.auth.signOut();
        setCurrentUser(null);
        setShowLogoutModal(false);
        showNotification('Signed out of RecMatch.', 'info');
      };

      const isPlayer = currentUser?.role === 'Player / User' || currentUser?.role === 'student' || !currentUser?.role;
      const isOrganizer = currentUser?.role === 'Organizer' || currentUser?.role === 'dean';
      const isAdmin = currentUser?.role === 'Admin' || currentUser?.role === 'admin';

      // True responsive container styling: Full web layout for Desktop, mobile app view for mobile screens
      const containerClasses = isDesktopView 
        ? "w-full h-full flex flex-col justify-between overflow-hidden bg-slate-950" 
        : "w-full h-full flex flex-col justify-between overflow-hidden bg-slate-950 max-w-md mx-auto shadow-2xl border border-slate-900 rounded-none sm:rounded-[40px]";

      return (
        <div className={containerClasses}>
          
          <ConfirmModal
            isOpen={showLogoutModal}
            title="Confirm Logout"
            message="Are you sure you want to log out of RecMatch?"
            confirmText="Logout"
            confirmStyle="danger"
            onConfirm={handleConfirmLogout}
            onCancel={() => setShowLogoutModal(false)}
          />

          {!currentUser ? (
            <div className="flex-1 flex flex-col justify-between overflow-y-auto">
              <SystemBanner notification={notification} onClose={clearNotification} />
              <AuthModule onAuthSuccess={(user) => {
                setCurrentUser(user);
                if (user.role === 'Organizer' || user.role === 'dean') {
                  setActiveNavTab('approvals');
                } else if (user.role === 'Admin' || user.role === 'admin') {
                  setActiveNavTab('approvals');
                } else {
                  setActiveNavTab('home');
                }
              }} showNotification={showNotification} />
              <footer className="py-3 text-center text-[10px] text-slate-600 font-mono">
                RecMatch Ormoc &copy; 2026
              </footer>
            </div>
          ) : (
            <div className="flex flex-col h-full justify-between">
              
              {/* TOP APP BAR */}
              <header className="px-5 py-3.5 bg-slate-900 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3 shrink-0 shadow-md">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center p-1 shadow-sm shrink-0">
                    <MapPinLogo className="w-7 h-7" />
                  </div>
                  <div>
                    <h2 className="text-xs sm:text-sm font-bold text-white leading-tight">{currentUser.full_name}</h2>
                    <p className="text-[10px] sm:text-xs text-slate-400 capitalize">
                      Role: <span className="text-brand-400 font-semibold">{currentUser.role}</span>
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2 flex-wrap">
                  {isOrganizer && !isDesktopView && (
                    <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-xl border border-slate-800 text-[10px] font-bold">
                      <button onClick={() => setActiveNavTab('approvals')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'approvals' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Approvals</button>
                      <button onClick={() => setActiveNavTab('create_league')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'create_league' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Create League</button>
                      <button onClick={() => setActiveNavTab('request_court')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'request_court' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Request Court</button>
                    </div>
                  )}

                  {isAdmin && !isDesktopView && (
                    <div className="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-xl border border-slate-800 text-[10px] font-bold">
                      <button onClick={() => setActiveNavTab('approvals')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'approvals' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Leagues</button>
                      <button onClick={() => setActiveNavTab('court_approvals')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'court_approvals' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Courts</button>
                      <button onClick={() => setActiveNavTab('add_court')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'add_court' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Add Court</button>
                      <button onClick={() => setActiveNavTab('logs')} className={`px-2 py-1 rounded-lg ${activeNavTab === 'logs' ? 'bg-brand-500 text-slate-950' : 'text-slate-400'}`}>Logs</button>
                    </div>
                  )}

                  <button
                    type="button"
                    onClick={() => setShowLogoutModal(true)}
                    className="px-3.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-xl text-xs font-bold transition-all"
                  >
                    Logout
                  </button>
                </div>
              </header>

              <SystemBanner notification={notification} onClose={clearNotification} />

              {/* MAIN CONTENT AREA */}
              <main className={`flex-1 min-h-0 ${isAdmin || isOrganizer ? 'flex overflow-hidden' : 'flex flex-col overflow-y-auto p-2 sm:p-4'}`}>
                {(isAdmin || isOrganizer) && isDesktopView && (
                  <aside className="flex w-64 shrink-0 flex-col border-r border-slate-800 bg-slate-900/70 p-5">
                    <div className="mb-8 flex items-center gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-2xl border border-brand-500/20 bg-brand-500/10">
                        <MapPinLogo className="h-8 w-8" />
                      </div>
                      <div>
                        <p className="text-sm font-extrabold tracking-wide text-white">RecMatch</p>
                        <p className="text-[10px] text-slate-500">Ormoc City workspace</p>
                      </div>
                    </div>

                    <p className="mb-3 px-3 text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500">
                      {isAdmin ? 'Administration' : 'Organizer workspace'}
                    </p>
                    <nav className="space-y-1">
                      {(isAdmin
                        ? [
                            { id: 'approvals', label: 'Dashboard', icon: '🏆' },
                            { id: 'court_approvals', label: 'Court Approvals', icon: '🏟️' },
                            { id: 'add_court', label: 'Add Court', icon: '➕' },
                            { id: 'logs', label: 'Audit Logs', icon: '🛡️' },
                            { id: 'profile', label: 'Profile', icon: '👤' }
                          ]
                        : [
                            { id: 'approvals', label: 'Approvals', icon: '✅' },
                            { id: 'create_league', label: 'Create League', icon: '🏆' },
                            { id: 'request_court', label: 'Request Court', icon: '🏟️' },
                            { id: 'profile', label: 'Profile', icon: '👤' }
                          ]
                      ).map((item) => (
                        <button
                          key={item.id}
                          type="button"
                          onClick={() => setActiveNavTab(item.id)}
                          className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-xs font-semibold transition-colors ${
                            activeNavTab === item.id
                              ? 'bg-brand-500 text-slate-950 shadow-lg shadow-brand-950/30'
                              : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                          }`}
                        >
                          <span aria-hidden="true">{item.icon}</span>
                          <span>{item.label}</span>
                        </button>
                      ))}
                    </nav>

                    <div className="mt-auto rounded-2xl border border-slate-800 bg-slate-950/70 p-3">
                      <p className="truncate text-xs font-bold text-white">{currentUser.full_name}</p>
                      <p className="mt-1 text-[10px] text-brand-400">{currentUser.role}</p>
                    </div>
                  </aside>
                )}

                {(isAdmin || isOrganizer) ? (
                  <div className="flex-1 min-w-0 overflow-y-auto p-4 sm:p-6 lg:p-8">
                    {activeNavTab === 'zone' ? (
                      <OrmocZoneSchedule />
                    ) : activeNavTab === 'profile' ? (
                      <UserProfileView currentUser={currentUser} showNotification={showNotification} />
                    ) : isAdmin ? (
                      <AdminDashboard currentUser={currentUser} showNotification={showNotification} refreshCourts={fetchApprovedCustomCourts} activeSubTab={activeNavTab} setActiveSubTab={setActiveNavTab} />
                    ) : (
                      <OrganizerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} refreshCourts={fetchApprovedCustomCourts} activeNavTab={activeNavTab} />
                    )}
                  </div>
                ) : activeNavTab === 'zone' ? (
                  <OrmocZoneSchedule />
                ) : activeNavTab === 'profile' ? (
                  <UserProfileView currentUser={currentUser} showNotification={showNotification} />
                ) : (
                  <PlayerDashboard currentUser={currentUser} showNotification={showNotification} availableCourts={availableCourts} playerNavTab={activeNavTab} />
                )}
              </main>

              {/* BOTTOM NAVIGATION BAR (Visible for Mobile Users only) */}
              {isPlayer && !isDesktopView && (
                <nav className="px-4 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-around text-[10px] shrink-0">
                  <button
                    onClick={() => setActiveNavTab('home')}
                    className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'home' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                  >
                    <span>🏠</span>
                    <span>Home</span>
                  </button>
                  <button
                    onClick={() => setActiveNavTab('reservation')}
                    className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'reservation' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                  >
                    <span>📅</span>
                    <span>Reservation</span>
                  </button>
                  <button
                    onClick={() => setActiveNavTab('leagues')}
                    className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'leagues' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                  >
                    <span>🏆</span>
                    <span>Leagues</span>
                  </button>
                  <button
                    onClick={() => setActiveNavTab('profile')}
                    className={`flex flex-col items-center gap-0.5 ${activeNavTab === 'profile' ? 'text-brand-400 font-bold' : 'text-slate-400 opacity-60'}`}
                  >
                    <span>👤</span>
                    <span>Profile</span>
                  </button>
                </nav>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
